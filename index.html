  const one=id==="__one"&&msList(m)[0], sermonOne=one&&(m.genre==="sermon"||/설교/.test(one.type||""));
  let oneFmt=null; try{ oneFmt=JSON.parse(localStorage.getItem("seojae.oneFmt")||"null"); }catch(_){}
  const o=Object.assign({fmt:"a5",preface:true,biblio:true,done:false,pfs:"xl"},G(m).exp.fmt?{fmt:G(m).exp.fmt}:{},m.exportOpts||{},id==="__one"?(oneFmt?.[sermonOne?"s":"o"]||(sermonOne?{fmt:"pulpit"}:{})):{}), bib=msBiblio(m); o.genre=m.genre||"free";
  const ov=document.createElement("div"); ov.className="bookview expopts"; const P=expPrefs(m);
  ov.innerHTML=`<section class="sheet" style="max-width:620px;margin:40px auto;display:grid;gap:12px">
    <p class="label" style="margin:0">${ICO.closed}「${esc(m.title)}」 책으로 묶기</p>
    <div class="setrow"><span class="k">판형</span><div class="pills"><button class="pill ${o.fmt==="a5"?"on":""}" data-fmt="a5">A5 책 (표지·차례·쪽 번호)</button><button class="pill ${o.fmt==="a4"?"on":""}" data-fmt="a4">A4 투고 원고 (넓은 줄 간격)</button><button class="pill ${o.fmt==="pulpit"?"on":""}" data-fmt="pulpit" title="강단에서 12인치 태블릿(세로)으로 보기 좋게: 표지·차례 없이 A4 세로, 슬라이드 그림·전달 큐 상자">강단용 태블릿 (A4 세로·슬라이드)</button></div></div>
    <div class="setrow" id="eo-pfsrow" ${o.fmt==="pulpit"?"":"hidden"}><span class="k">글씨 크기</span><div class="pills">${[["l","보통"],["xl","조금 크게"],["xxl","크게"]].map(([k,n])=>`<button class="pill ${o.pfs===k?"on":""}" data-pfs="${k}">${n} <small>${PULPIT_FS[k]}pt</small></button>`).join("")}</div><label class="chk" style="width:100%"><input type="checkbox" ${pulpitTags()?"checked":""} onchange="try{localStorage.setItem('seojae.pulpitTags',this.checked?'1':'')}catch(_){}"> 확인 꼬리표 (확인함)·(확인 못 함)와 「■ 부록 — 검증표」도 싣기 <small class="muted">(기본: 빼고 — 작성자용 표시)</small></label><small class="hint" style="display:block;width:100%">표지·차례 없이 첫 쪽부터 본문(A4 세로 = 12인치 태블릿 세로 화면). 🎬 슬라이드 줄 옆 오른쪽에 그 슬라이드 그림, 🎙️ 전달 큐는 노란 작은 상자, 성경 낭독은 파란 굵은 글씨, 【설교자의 자리】는 주황. 쪽 번호는 「3 / 12」.</small></div>
    ${o.fmt==="pulpit"?"":expRowHtml(P)}
    <label class="chk"><input type="checkbox" id="eo-done" ${o.done?"checked":""}> 「완성」 ${esc(G(m).item)}만 넣기 (${msList(m).filter(w=>w.status==="완성").length}${esc(G(m).item==="꼭지"?"꼭지":"편")})</label>
    <label class="chk"><input type="checkbox" id="eo-pre" ${o.preface?"checked":""}> 머리말 넣기</label>
    <textarea id="eo-preface" placeholder="머리말 — 이 책을 쓰게 된 까닭, 읽을 이에게 드리는 말 (비워 두면 넣지 않습니다)" style="min-height:120px">${esc(m.preface||"")}</textarea>
    <label class="chk"><input type="checkbox" id="eo-bib" ${o.biblio?"checked":""}> 참고 문헌 넣기 — 꼭지에 쓰인 책 ${bib.length}권 (책장 정보로 자동)</label>
    ${bib.length?`<p class="hint" style="margin:0">${bib.slice(0,4).map(b=>esc(b)).join(" / ")}${bib.length>4?" …":""}</p>`:""}
    <div class="row" style="gap:6px"><button class="btn ink" id="eo-go">미리보기</button><button class="btn" id="eo-x">닫기</button></div></section>`;
  document.body.appendChild(ov);
  ov.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{ o.fmt=b.dataset.fmt; ov.querySelectorAll("[data-fmt]").forEach(x=>x.classList.toggle("on",x===b)); ov.querySelector("#eo-pfsrow").hidden=o.fmt!=="pulpit"; });

  ov.querySelector("#eo-x").onclick=()=>ov.remove(); expRowWire(ov,m,P);
  ov.querySelector("#eo-go").onclick=()=>{ o.done=ov.querySelector("#eo-done").checked; o.preface=ov.querySelector("#eo-pre").checked; o.biblio=ov.querySelector("#eo-bib").checked;
    const pre=ov.querySelector("#eo-preface").value; if(pre!==(m.preface||"")) m.preface=pre; if(id==="__one"){ const k=sermonOne?"s":"o"; try{ localStorage.setItem("seojae.oneFmt",JSON.stringify(Object.assign(oneFmt||{},{[k]:{fmt:o.fmt,pfs:o.pfs}}))); }catch(_){} } else m.exportOpts={fmt:o.fmt,preface:o.preface,biblio:o.biblio,done:o.done,pfs:o.pfs};
    if(o.fmt==="pulpit"){ o.preface=false; o.biblio=false; } o.P=P; save(); ov.remove(); if(TMP_SEND_IDS){ o.ids=TMP_SEND_IDS; TMP_SEND_IDS=null; } bookPreview(id,o); };
}
// 원고에 쓰인 책(글의 책, 꼭지에 인용된 밑줄의 책)을 「지은이, 『제목』, 출판사, 연도.」 꼴로
function msBiblio(m){ const ids=new Set(); msList(m).forEach(w=>{ if(w.bookId) ids.add(w.bookId); if(w.fromNote){ const n=S.notes.find(x=>x.id===w.fromNote); if(n?.bookId) ids.add(n.bookId); }
    S.books.forEach(b=>{ const t=b.title, B=w.body||""; if(t&&t.length>=2&&(B.includes("("+t)||B.includes("『"+t)||B.includes("《"+t))) ids.add(b.id); }); });   // 「(제목」·『제목』·《제목》 인용 (각주 안도)
  const fromRes=(m.research||[]).filter(r=>!(S.deleted||{})[r.id]&&r.kind!=="AI 조사"&&(r.kind==="문헌"||r.au||r.jn||r.pub||(r.kind==="웹 글"&&r.url))&&r.t&&resUsed(m,r).length).map(r=>({t:resBib(r),f:resFor(r)}));   // 자료 모음 가운데 원고에 쓰인 것 (AI 조사 요약은 빼고)
  const P2=k=>c=>((c.props||[]).find(p=>p.k===k)||{}).v||"", bodies=msList(m).map(w=>w.body||"").join("\n");
  const fromNote=cxScope(m.id).filter(c=>c.kind==="문헌").map(c=>({t:P2("제목")(c)||c.name,au:P2("저자")(c),yr:P2("연도")(c),jn:"",pub:P2("출판·학술지")(c)})).filter(r=>r.t&&(bodies.includes(r.t)||(r.au&&bodies.includes(r.au)))).map(r=>({t:resBib(r),f:resFor(r)}));   // 노트의 「문헌」 항목 중 본문에 제목·저자가 나온 것
  const fromBook=[...ids].map(id=>S.books.find(b=>b.id===id)).filter(Boolean).map(b=>{ const r={au:(b.authors||[]).join(", "),t:b.title,pub:b.publisher||"",yr:b.pubDate?String(b.pubDate).slice(0,4):""}; return {t:resBib(r),f:resFor(r)}; });
  const all=[...fromBook,...fromRes,...fromNote], seen=new Set(), uniq=all.filter(x=>!seen.has(x.t)&&seen.add(x.t));
  return [...uniq.filter(x=>!x.f).map(x=>x.t).sort((a,b)=>a.localeCompare(b,"ko")),...uniq.filter(x=>x.f).map(x=>x.t).sort((a,b)=>a.localeCompare(b,"en"))]; }
function bookPreview(id,o){
  const m=id==="__one"?TMP_MS:S.manuscripts.find(x=>x.id===id); let ch=msList(m); if(o.done) ch=ch.filter(w=>w.status==="완성"); if(o.ids) ch=ch.filter(w=>o.ids.includes(w.id));
  if(!ch.length) return toast("넣을 꼭지가 없습니다 (「완성」 꼭지만을 골랐다면 상태를 확인해 주세요)");
  if(o.fmt==="pulpit"&&!o._sl){ o._sl=1; const need=ch.filter(w=>w.slides&&!SLIDES[w.slides.deck]); if(need.length){ toast("슬라이드 그림을 불러오는 중…"); return Promise.all(need.map(w=>slideData(w.slides.deck))).then(()=>bookPreview(id,o)); } }
  let author=S.settings.author;
  author=author||"";   // 지은이는 보내기·책으로 묶기 창의 「지은이」 칸에서 (묻는 창을 띄우지 않음)
  const ov=document.createElement("div"); ov.className="bookview";
  ov.innerHTML=`<div class="bv-bar"><b class="pen" style="font-size:22px">${ICO.closed}${esc(m.title)}</b><span class="muted" id="bvstate">쪽을 나누는 중…</span><span class="spacer"></span><button class="btn small" id="bvback">고르기로</button>
    <button class="btn ink small" id="bvprint" disabled>PDF로 저장</button><button class="btn small" id="bvclose">닫기</button></div>
    <p class="hint bv-hint">「PDF로 저장」을 누른 뒤, 컴퓨터는 인쇄 창의 <b>대상 → PDF로 저장</b>, 휴대폰은 <b>인쇄 → 공유 → 파일에 저장</b>을 고르세요.</p>
    <iframe title="책 미리보기" sandbox="allow-scripts allow-modals"></iframe>`;
  document.body.appendChild(ov);
  const frame=ov.querySelector("iframe");
  ov.querySelector("#bvprint").onclick=()=>frame.contentWindow.postMessage("print","*");
  ov.querySelector("#bvclose").onclick=()=>{ window.removeEventListener("message",onReady); ov.remove(); };
  ov.querySelector("#bvback").onclick=()=>{ window.removeEventListener("message",onReady); ov.remove(); exportPdf(id); };
  const onReady=ev=>{ if(ev.source!==frame.contentWindow||ev.data?.bookReady==null) return; window.removeEventListener("message",onReady);
    ov.querySelector("#bvstate").textContent=`${ev.data.bookReady}쪽 · ${o.fmt==="a4"?"A4 투고 원고":o.fmt==="pulpit"?"강단용 태블릿":"A5 판형"}`; ov.querySelector("#bvprint").disabled=false; };
  window.addEventListener("message",onReady);
  setTimeout(()=>{ const st=ov.querySelector("#bvstate"); if(st&&/나누는 중/.test(st.textContent)) st.textContent="쪽 나누기 라이브러리를 받지 못했습니다 — 인터넷을 확인하거나 「원고 내려받기(.md)」를 써 주세요"; },25000);
  frame.srcdoc=bookHtml(m,ch,author,o);
}
function msDraftHtml(){

  if(d.kind==="manual") return `<div class="row"><input id="mtitle" value="${esc(d.title)}" placeholder="새 책의 가제 (예: 아침의 문장들)" style="flex:1" onkeydown="if(event.key==='Enter'&&!event.isComposing)addMs()"><button class="btn ink" onclick="addMs()">원고 만들기</button><button class="btn ghost" onclick="msDraft=null;render()">취소</button></div>
    <p class="hint">만든 뒤 「＋ 간직한 글 더하기」로 글을 골라 넣고 ↑↓로 순서를 정합니다.</p>`;
  const chip=(key,val,label,on)=>`<span class="chip ${on?"on":""}" onclick="toggleRule(${jsArg(key)},${jsArg(val)})">${esc(label)}</span>`;
  const books=[...new Set([...usedBooks(),...r.books])].sort((a,b)=>a-b);
  const preview=live().filter(w=>matches(w,r));
  return `<div class="row"><input id="mtitle" value="${esc(d.title)}" placeholder="새 책의 가제 (예: 요한복음 묵상집)" style="flex:1"></div>
    <p class="hint" style="margin:10px 0 4px">아래에서 모을 글의 조건을 고르세요. 같은 줄 안에서는 <b>하나라도</b> 맞으면, 줄끼리는 <b>모두</b> 맞아야 모입니다.</p>
    <div class="rulegrid">
      <div class="rl">글 종류</div><div>${ALL_TYPES.map(t=>chip("types",t,t,r.types.includes(t))).join("")}</div>
      <div class="rl">성경책</div><div>${books.map(i=>chip("books",i,BIBLE[i][0],r.books.includes(i))).join("")}
        <select style="width:auto;display:inline-block;margin-top:4px" onchange="if(this.value)toggleRule('books',+this.value)"><option value="">＋ 다른 성경책</option>${BIBLE.map(([n],i)=>r.books.includes(i)?"":`<option value="${i}">${n}</option>`).join("")}</select></div>
      <div class="rl">주제</div><div>${[...new Set([...usedTopics(),...r.topics])].map(t=>chip("topics",t,t,r.topics.includes(t))).join("")||`<span class="muted">글에 주제를 고르면 여기에 나옵니다</span>`}
        <select style="width:auto;display:inline-block;margin-top:4px" onchange="if(this.value)toggleRule('topics',this.value)"><option value="">＋ 다른 주제</option>${allTopics().filter(t=>!r.topics.includes(t)).map(t=>`<option>${esc(t)}</option>`).join("")}</select></div>
      ${S.books.length?`<div class="rl">읽은 책</div><div>${S.books.map(b=>chip("readBooks",b.id,b.title,r.readBooks.includes(b.id))).join("")}</div>`:""}
      <div class="rl">해</div><div><select style="width:auto" onchange="setRuleYear(this.value)"><option value="">모든 해</option>${years().map(y=>`<option ${r.year===y?"selected":""}>${y}</option>`).join("")}</select></div>
      <div class="rl">순서</div><div><span class="chip ${d.order!=="date"?"on":""}" onclick="msDraft.order='bible';msDraft.title=$('#mtitle').value;render()">성경 순서(장·절)</span><span class="chip ${d.order==="date"?"on":""}" onclick="msDraft.order='date';msDraft.title=$('#mtitle').value;render()">쓴 날짜</span></div>
    </div>
    <div class="preview"><b class="pen" style="font-size:22px">${ruleEmpty(r)?"조건을 골라 주세요":`지금 맞는 글 ${preview.length}편`}</b>${!ruleEmpty(r)&&preview.length?`<span class="muted"> — ${preview.slice(0,4).map(w=>esc(w.title||"(제목 없음)")).join(", ")}${preview.length>4?" …":""}</span>`:""}
      <div class="hint">앞으로 쓰는 글도 이 조건에 맞으면 저절로 이 원고에 들어옵니다.</div></div>
    <div class="row" style="margin-top:12px"><button class="btn ink" onclick="addMs()">${d.editing?"조건 고치기":"원고 만들기"}</button><button class="btn ghost" onclick="msDraft=null;render()">취소</button></div>`;

function msCardHtml(m,i){
  const ch=msList(m), total=ch.reduce((a,w)=>a+charsAll(w.body),0);
  const row=(w,k)=>`<li><span class="pen cn">${k+1}</span><a href="#" onclick="go('write',{edit:'${w.id}'});return false">${esc(w.title||"(제목 없음)")}</a>${w.passage?`<span class="muted">${esc(w.passage)}</span>`:""}<span class="muted">${chars(w.body).toLocaleString()}자</span><span class="spacer"></span>
    ${m.rule?"":`<button class="btn small ghost" ${k?"":"disabled"} onclick="msMove('${m.id}','${w.id}',-1)" title="앞으로">↑</button><button class="btn small ghost" ${k<ch.length-1?"":"disabled"} onclick="msMove('${m.id}','${w.id}',1)" title="뒤로">↓</button><button class="btn small ghost" onclick="msRemove('${m.id}','${w.id}')" title="원고에서 빼기 (글은 남습니다)">빼기</button>`}</li>`;
  const others=live().filter(w=>!(m.items||[]).includes(w.id)).slice().reverse();
  return `<section class="sheet tape ${["","b","c"][i%3]}">
    <p class="label" style="font-size:19px">${m.rule?"조건으로 모으는 원고":"직접 고른 원고"}</p>
    <div class="big">${esc(m.title)}</div>
    ${m.rule?`<div class="rulechips">${esc(ruleText(m.rule))}</div>`:""}
    <div class="sub">${ch.length}꼭지 · ${total.toLocaleString()}자 · 원고지 약 ${Math.ceil(total/200)}매</div>
    ${m.rule?`<div class="row" style="gap:4px;margin-top:6px"><span class="muted">순서</span><span class="chip ${m.order!=="date"?"on":""}" onclick="setOrder('${m.id}','bible')">성경 순서</span><span class="chip ${m.order==="date"?"on":""}" onclick="setOrder('${m.id}','date')">쓴 날짜</span></div>`:""}
    <ol class="chapters">${ch.map(row).join("")||`<p class="muted">${m.rule?"아직 조건에 맞는 글이 없습니다. 글을 쓰면 저절로 들어옵니다.":"아직 넣은 글이 없습니다."}</p>`}</ol>
    ${m.rule?"":others.length?`<select onchange="msAdd('${m.id}',this.value)"><option value="">＋ 간직한 글 더하기…</option>${others.map(w=>`<option value="${w.id}">${esc(w.date)} · ${esc(w.title||w.body.slice(0,20))}</option>`).join("")}</select>`:""}
    <div class="row" style="margin-top:12px">
      ${m.rule?`<button class="btn small" onclick="editRule('${m.id}')">조건 고치기</button><button class="btn small" onclick="freezeMs('${m.id}')" title="지금 모인 글로 고정하고 순서를 직접 정합니다">직접 다듬기로 바꾸기</button>`:""}
      <button class="btn small ink" onclick="exportPdf('${m.id}')">${ICO.closed}책 모양 PDF</button><button class="btn small" onclick="exportMs('${m.id}')">원고 내려받기</button><button class="btn small danger" onclick="delMs('${m.id}')">${ICO.trash}휴지통에</button></div>
  </section>`;
}

// ───────── 글방: 「글쓰기」 메뉴 — 원고를 책처럼 엮고 다듬는 곳 (서가·코르크보드·상태 보드·목표) ─────────
// 원고의 items 에 「part:<번호>」 표시를 끼워 부·장을 나눕니다(이름은 m.parts[번호]={t,lv:1부|2장}). 옛 버전은 이 표시를 글로 못 찾아 건너뛰므로 글은 그대로 보입니다.
// 목표: m.goal(원고지 매수), m.due(마감일). 원고는 통째로 「나중에 고친 쪽」으로 합쳐지는 기존 규칙 그대로입니다.
let SEL_MS=null, ROOM_MS=null, ROOM_VIEW="binder", ROOM_DRAG=null;
// 글의 성격(원고마다 m.genre): 부·장 이름, 꼭지 이름, 새 꼭지의 틀·종류, 목표 단위(매/자/편), 카드·노트 이름, 검토 관점, 내보내기 모양이 달라집니다
const GENRES={

function msFindOpen(mid){ const m=S.manuscripts.find(x=>x.id===mid); if(!m) return; if(tab==="write"&&$("#wbody")) autoKeepNow(); if(SCRIV_EDIT&&$("#scta")) scrivAuto(true);

async function msVerSave(m,name){ const r=await gcall("msVerSave",{ms:m.id,name:String(name||"").slice(0,80),snap:msSnapOf(m)}); if(!r.ok) throw new Error(r.error||"판을 남기지 못했습니다"); return r; }
function msVerOpen(mid){ const m=S.manuscripts.find(x=>x.id===mid); if(!m) return; if(tab==="write"&&$("#wbody")) autoKeepNow(); if(SCRIV_EDIT&&$("#scta")) scrivAuto(true);
  const ov=document.createElement("div"); ov.className="bookview sendview"; let list=null, err="", cmp=null, open=new Set();
  const load=async()=>{ if(!SERVER){ err="구글 서버에 닿아야 원고 판을 쓸 수 있습니다"; return draw(); } try{ const r=await gcall("msVerList",{ms:m.id}); if(!r.ok) throw new Error(r.error); list=r.list; err=""; }catch(e){ err="판 목록을 받지 못했습니다: "+e.message; } draw(); };
  const fmtAt=a=>{ const d=new Date(a); return isNaN(d)?a:`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  const cmpRows=ver=>{ const S2=ver.snap||{}, snapW=new Map((S2.writings||[]).map(w=>[w.id,w])), cur=msList(m), rows=[];

function msVerRestoreOne(m,o,ver){ const now=new Date().toISOString(); let w=S.writings.find(x=>x.id===o.id&&!(S.deleted||{})[x.id]);

function roomDnd(){
  const m=S.manuscripts.find(x=>x.id===ROOM_MS); if(!m) return;

  if(list&&!m.rule){
    list.querySelectorAll("[data-k]").forEach(el=>{
      el.addEventListener("dragstart",e=>{ ROOM_DRAG=el.dataset.k; el.classList.add("dragging"); try{ e.dataTransfer.setData("text/plain",ROOM_DRAG); e.dataTransfer.effectAllowed="move"; }catch(_){} });
      el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); list.querySelectorAll(".dropb,.dropa").forEach(x=>x.classList.remove("dropb","dropa")); });
      el.addEventListener("dragover",e=>{ if(!ROOM_DRAG) return; e.preventDefault(); const r=el.getBoundingClientRect(), after=ROOM_VIEW==="cork"&&!el.classList.contains("corkpart")?(e.clientX>r.left+r.width/2):(e.clientY>r.top+r.height/2);
        el.classList.toggle("dropa",after); el.classList.toggle("dropb",!after); });
      el.addEventListener("dragleave",()=>el.classList.remove("dropb","dropa"));
      el.addEventListener("drop",e=>{ e.preventDefault(); const k=ROOM_DRAG; ROOM_DRAG=null; if(!k||k===el.dataset.k) return;
        const after=el.classList.contains("dropa"); const all=[...list.querySelectorAll("[data-k]")].map(x=>x.dataset.k), i=all.indexOf(el.dataset.k);
        let before=after?all[i+1]:el.dataset.k; if(before===k) before=all[all.indexOf(k)+1]; msReorder(m.id,k,before||null); });
    }); }
  document.querySelectorAll(".scard[data-w]").forEach(el=>{ el.addEventListener("dragstart",e=>{ ROOM_DRAG="w:"+el.dataset.w; try{ e.dataTransfer.setData("text/plain",ROOM_DRAG); }catch(_){} }); });
  document.querySelectorAll(".scol[data-st]").forEach(col=>{

    col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("over"); const k=ROOM_DRAG; ROOM_DRAG=null; if(k?.startsWith("w:")) setWStatus(k.slice(2),col.dataset.st); });
  });
  document.querySelectorAll(".scol[data-beat]").forEach(col=>{   // 플롯 보드: 단계로
    col.addEventListener("dragover",e=>{ if(ROOM_DRAG?.startsWith("w:")){ e.preventDefault(); col.classList.add("over"); } });
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("over"); const k=ROOM_DRAG; ROOM_DRAG=null; if(k?.startsWith("w:")) plotSet(k.slice(2),col.dataset.beat); });
  });
}

// 메모(포스트잇)는 「내 생각의 씨앗」, 자료 모음은 「바깥에서 가져온 근거」 — 출처와 함께 두고 인용·각주·참고 문헌으로 이어짐.
// 원고 안 m.research=[{id,kind,t 제목,body 내용·원문,au 저자,yr 연도,pg 쪽,url,src(예전 한 줄 출처),note 내 생각,tags[],ok 확인 상태,at,u}] — 자료마다 u 시각으로 합침(mergeInner)
const RES_KINDS=["인용","주석·해설","문헌","통계·자료","사례·예화","웹 글","AI 조사","기타"];
const RES_IC={"인용":"❝","주석·해설":"✎","문헌":"▤","통계·자료":"▦","사례·예화":"❀","웹 글":"⌁","AI 조사":"✦","기타":"◎"};
let RES_EDIT=null, RES_Q="", RES_KIND="", RES_TAG="", RES_SORT="new", RES_VIEW=(()=>{ try{ return localStorage.getItem("seojae.resView")||"card"; }catch(_){ return "card"; } })();
// 인용 표기: 저자, 『제목』, 연도, 쪽 (서지 칸이 없으면 예전 출처 한 줄)
const resFor=r=>r.lang?r.lang==="국외":!/[가-힣]/.test((r.au||"")+(r.t||""));   // 국외 문헌인가 (칸이 비면 글자로 짐작)
// 인용 표기: 학술지 논문 = 저자, 「논문」, 『학술지』 권호 (연도), 쪽 · 단행본 = 저자, 『책』 (출판사, 연도), 쪽 · 국외는 겹낫표 없이 "제목". 새 칸이 없으면 예전 표기 그대로(이미 넣은 각주와 맞게)
function resCite(r){ const f=resFor(r), T=t=>f?`"${t}"`:`「${t}」`, B=t=>f?t:`『${t}』`;
  if(r.jn) return [r.au,r.t?T(r.t):"",`${B(r.jn)}${r.vol?" "+r.vol:""}${r.yr?` (${r.yr})`:""}`,r.pg?(f?`p. ${r.pg}`:`${r.pg}쪽`):""].filter(Boolean).join(", ");
  if(r.pub) return [[r.au,r.t?B(r.t):""].filter(Boolean).join(", ")+` (${[r.pub,r.yr].filter(Boolean).join(", ")})`,r.pg?(f?`p. ${r.pg}`:`${r.pg}쪽`):""].filter(Boolean).join(", ");
  if(r.au||r.yr||r.pg) return [r.au,r.t?`『${r.t}』`:"",r.yr,r.pg?`${r.pg}쪽`:""].filter(Boolean).join(", "); return r.src||r.t||""; }
// 참고 문헌 한 줄 (쪽수 없이)
function resBib(r){ const f=resFor(r), T=t=>f?`"${t}"`:`「${t}」`, B=t=>f?t:`『${t}』`, au=r.au||(f?"Anon.":"지은이 미상");
  if(r.jn) return `${au}, ${T(r.t)}, ${B(r.jn)}${r.vol?" "+r.vol:""}${r.yr?` (${r.yr})`:""}${r.pg?(f?`, pp. ${r.pg}`:`, ${r.pg}쪽`):""}.`;
  if(!r.au&&r.url&&!r.pub) return `${T(r.t)}, ${r.url}${r.at?` (${r.at} 확인)`:""}.`;
  return `${au}, ${B(r.t)}${r.pub||r.yr?`, ${[r.pub,r.yr].filter(Boolean).join(", ")}`:""}.`; }
// 이 원고에서 쓰인 곳: 인용 표기나 원문 앞부분이 들어간 글
function resUsed(m,r){ const old=r.au||r.yr||r.pg?[r.au,r.t?`『${r.t}』`:"",r.yr].filter(Boolean).join(", "):"";
  const keys=[resCite(r),old,r.t&&r.t.length>=2?`『${r.t}』`:"",r.t&&r.t.length>=2?`「${r.t}」`:"",r.t&&r.t.length>=4?`"${r.t}"`:"",(r.body||"").replace(/\s+/g," ").trim().slice(0,18)].filter(k=>k&&k.length>=4);
  const ay=r.au&&r.yr?[r.au,String(r.yr)]:null; if(!keys.length&&!ay) return [];
  return msList(m).filter(w=>{ const B=(w.body||"").replace(/\s+/g," "); return keys.some(k=>B.includes(k))||(ay&&B.split(/\[\^/).slice(1).some(f=>f.includes(ay[0])&&f.includes(ay[1]))); }); }
function resList(m){ const q=RES_Q.trim().toLowerCase(); let L=(m.research||[]).filter(r=>!(S.deleted||{})[r.id]);
  if(RES_KIND) L=L.filter(r=>(r.kind||"기타")===RES_KIND); if(RES_TAG) L=L.filter(r=>(r.tags||[]).includes(RES_TAG));
  if(q) L=L.filter(r=>[r.t,r.body,r.au,r.yr,r.src,r.note,r.url,...(r.tags||[])].join(" ").toLowerCase().includes(q));
  const by={new:(a,b)=>(b.u||b.at||"").localeCompare(a.u||a.at||""),title:(a,b)=>(a.t||"").localeCompare(b.t||"","ko"),author:(a,b)=>(a.au||"힣").localeCompare(b.au||"힣","ko")||(a.yr||"").localeCompare(b.yr||"")}[RES_SORT];
  return L.slice().sort(by); }
function resForm(m,r){ r=r||{}; const sel=RES_KINDS.map(k=>`<option ${(r.kind||"인용")===k?"selected":""}>${k}</option>`).join("");

    <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn small ghost" onclick="cxSecAdd('${c.id}')">＋ 새 섹션</button>${sug.map(h=>`<button class="btn small ghost" onclick="cxSecAdd('${c.id}',${jsArg(h).replace(/"/g,"&quot;")})">＋ ${esc(h)}</button>`).join("")}</div></div>`; }
function cxSecAdd(id,h){ const c=(S.codex||[]).find(x=>x.id===id); if(!c) return; h=h||(prompt("섹션 이름 (예: 외모, 성격과 심리, 전개)","")||"").trim(); if(!h) return; const s={id:uid(),h,t:"",u:new Date().toISOString()};
  c.secs=[...(c.secs||[]),s]; c.updated=s.u; save(); render(); setTimeout(()=>cxSecEdit(id,s.id),60); }
function cxSecDel(id,sid){ const c=(S.codex||[]).find(x=>x.id===id); if(!c) return; const s=(c.secs||[]).find(x=>x.id===sid); if(s?.t&&!confirm(`「${s.h}」 섹션을 지울까요?`)) return; c.secs=(c.secs||[]).filter(x=>x.id!==sid); c.updated=new Date().toISOString(); save(); render(); }
function cxSecEdit(id,sid){ const box=document.querySelector(`.cxsec[data-s="${sid}"] .cxsecb`), c=(S.codex||[]).find(x=>x.id===id), s=c?.secs?.find(x=>x.id===sid); if(!box||!s||box.querySelector("textarea")) return;

  const done=()=>{ const v=t.value; if(v!==(s.t||"")){ s.t=v; s.u=new Date().toISOString(); c.updated=s.u; save(); } box.innerHTML=s.t?cxLinkify(s.t,c,cxHome(c)||ROOM_MS):`<span class="muted">눌러서 쓰기</span>`; };
  let tm=0; t.addEventListener("input",()=>{ clearTimeout(tm); tm=setTimeout(()=>{ if(t.value!==(s.t||"")){ s.t=t.value; s.u=new Date().toISOString(); c.updated=s.u; save(); } },800); });
  t.addEventListener("blur",()=>{ clearTimeout(tm); done(); }); t.addEventListener("keydown",e=>{ if(e.key==="Escape"||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s")){ e.preventDefault(); e.stopPropagation(); t.blur(); } }); }

// 검증표 w.meta.vtab={at,ai,rows:[{kind,claim,status,source,note,me}]} · 점검 w.meta.chk10={at,a:[{me,ai,why}]} — 카드처럼 글의 meta 칸(칸마다 시각으로 합침, 저장 형식 그대로). 말 속도 S.settings.spm(1분 음절, 기본 350)
const SPM=()=>parseInt(S.settings.spm)||350;
// ■ 칸 이름으로 도입·본론·결론을 나눔. 준비 칸(본문 낭독·중심 메시지·주해·뼈대·후보·더 살펴볼…)과 기도·축도·부록은 셈에서 뺌
function sermonRatio(text){ const n={intro:0,body:0,end:0}; let cur=null, named=false;
  for(const l of stripMemo(text||"").split("\n")){ if(/^\s*■/.test(l)){ const h=l.replace(/^\s*■\s*/,"");
      cur=/본문 낭독|중심 메시지|본문 주해|본문의 흐름|본문에서 붙잡|신학|듣는 이|뼈대|후보|더 살펴볼|설계|씨앗|기도|축도|설교 길이|묵상에서|부록|검증표|떠오른 메시지|결단·초청/.test(h)?null:/서론|도입|들어가/.test(h)?"intro":/결론|맺음|맺는|나가며|나가는|마무리/.test(h)?"end":"body";
      if(cur==="intro"||cur==="end") named=true; continue; }
    if(cur) n[cur]+=chars(l); }
  return {...n,tot:n.intro+n.body+n.end,named}; }
function ratioHtml(text){ const r=sermonRatio(text); if(!r.tot) return `<small class="muted">■ 서론 · 대지 · ■ 결론 칸에 글이 생기면 비율을 잽니다</small>`;
  const p=k=>Math.round(r[k]*100/r.tot), spm=SPM(), warn=[];
  if(!r.named) warn.push("■ 서론·■ 결론 칸 이름을 찾지 못해 모두 본론으로 셉니다");
  else { const pe=p("end"), pi=p("intro"); if(r.end<1000) warn.push(`결론 ${r.end.toLocaleString()}자 — 최소 1,000자`); if(pe<15) warn.push(`결론 ${pe}% — 20% 안팎으로`); else if(pe>30) warn.push(`결론 ${pe}% — 늘어지지 않는지`); if(pi>20) warn.push(`도입 ${pi}% — 10% 안팎으로`); }
  const seg=(k,n)=>r[k]?`<span class="rs ${k}" style="flex:${r[k]}" title="${n} ${r[k].toLocaleString()}자 · 말하면 약 ${(r[k]*1.2/spm).toFixed(1)}분">${p(k)>=8?`${n} ${p(k)}%`:""}</span>`:"";
  return `<div class="rbar"><div class="rtrack">${seg("intro","도입")}${seg("body","본론")}${seg("end","결론")}<i class="rmark" style="left:10%" title="목표: 도입 10%"></i><i class="rmark" style="left:80%" title="목표: 결론 20%"></i></div>
    <small class="muted">도입 ${p("intro")}% · 본론 ${p("body")}% · 결론 ${p("end")}% (${r.end.toLocaleString()}자) · 말하면 약 ${Math.round(r.tot*1.2/spm)}분 · 1분에 <input class="spm" type="number" min="150" max="600" step="10" value="${spm}" onchange="spmSet(this.value)" title="1분에 말하는 음절(공백 제외). 지난 영상 길이와 그 원고의 음절 수로 재서 바꾸세요 — 모든 기기 같이 (원칙 5-12)">음절</small>
    ${warn.length?`<small class="warn">${warn.map(esc).join(" · ")}</small>`:""}</div>`; }
function spmSet(v){ v=parseInt(v); if(!(v>=150&&v<=600)) return toast("1분 음절은 150~600 사이로 적어 주세요"); S.settings.spm=v; save(); countW(); }
function ratioPaint(){ const el=$("#ratiobar"); if(el&&!el.contains(document.activeElement)) el.innerHTML=ratioHtml($("#wbody")?.value||""); }

// 검증표 (원칙 2장 사실·3장 부록) — AI가 대조, 판단·고침은 글쓴이. 본문에 단 (확인함)·(추론)·(확인 못 함) 꼬리표도 함께 모음
const VF_ST=["확인함","추론","확인 못 함"], VF_TAG=/[(（](확인함|추론|확인 못 함)[)）]/;
function vfTags(text){ const out=[]; stripMemo(text||"").split("\n").forEach(l=>{ if(/^\s*■\s*부록/.test(l)) return; const m=l.match(VF_TAG); if(m) out.push({kind:"꼬리표",claim:l.replace(new RegExp(VF_TAG.source,"g"),"").replace(/^\s*[■◆·\-]\s*/,"").trim().slice(0,120),status:m[1],source:"",note:"",tag:1}); }); return out; }
const vfGet=w=>{ const t=wMeta(w,"vtab"); return t&&Array.isArray(t.rows)?t:{rows:[]}; };
const vfLeft=w=>vfGet(w).rows.filter(x=>x.status!=="확인함"&&!x.me).length;
function vfAppendix(w,rows){ const mark=x=>x.me?" ✓직접 확인":"";
  return `\n■ 부록 — 검증표 (${today()})\n`+rows.map(x=>`· [${x.status}] ${x.claim}${x.note?` — ${x.note}`:""}${x.source?` (출처: ${x.source})`:""}${mark(x)}`).join("\n")+"\n"; }
function vfOpen(){ const w=cardW(); if(!w) return toast("몇 자 써서 간직되면 검증표를 만들 수 있습니다");
  const ov=document.createElement("div"); ov.className="bookview sendview"; let busy=false, err="", filt="";
  const draw=()=>{ const T=vfGet(w), rows=[...T.rows,...vfTags($("#wbody")?.value??w.body).filter(t=>!T.rows.some(x=>x.claim===t.claim))], cnt=s=>rows.filter(x=>x.status===s).length, left=vfLeft(w);
    ov.innerHTML=`<section class="sheet" style="max-width:820px;margin:36px auto;display:grid;gap:12px">
      <div class="row"><p class="label" style="margin:0">검증표 — ${esc(w.title||"제목 없음")}</p><span class="spacer"></span><button class="btn small ghost" data-x>닫기</button></div>
      <p class="hint" style="margin:0">AI가 글에서 연도·인명·숫자·인용·성경 문구·원어·예화의 사실을 뽑아 웹으로 대조합니다. <b>확인함</b> 출처와 맞음 · <b>추론</b> 해석이니 그렇다고 밝힐 것 · <b>확인 못 함</b> 직접 대조할 것 (원칙 2·3장). 고치는 것은 직접 — 대조를 마친 줄은 「직접 확인」에 표시하세요. 본문에 (확인함)·(추론)·(확인 못 함) 꼬리표를 단 문장도 여기 모입니다.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn small aibtn" data-ai ${busy||!SERVER?"disabled":""}>${busy?"글을 출처와 대조하는 중… (1분쯤)":T.rows.length?"✦ 다시 검증":"✦ AI로 검증표 만들기"}</button>
        <span class="pills">${["","확인함","추론","확인 못 함"].map(s=>`<button class="pill ${filt===s?"on":""}" data-f="${s}">${s||"모두"} ${s?cnt(s):rows.length}</button>`).join("")}</span><span class="spacer"></span>
        ${rows.length?`<button class="btn small" data-ins title="원고 맨 끝에 ■ 부록 — 검증표 칸으로 넣습니다. 내보내기에도 실리니, 독자에게 보이고 싶지 않으면 내보내기 전에 지우세요 (↶ 되돌리기)">원고 끝 부록으로 넣기</button>`:""}</div>
      ${err?`<p class="warn" style="margin:0">${esc(err)}</p>`:""}${!SERVER?`<small class="muted">구글 서버에 닿아야 AI 검증을 쓸 수 있습니다. 꼬리표 모으기·부록 넣기는 됩니다.</small>`:""}
      ${T.at?`<small class="muted">${esc(T.at)} 검증${T.ai?` · ${esc(T.ai)}`:""}${left?` · <b>아직 대조할 줄 ${left}</b>`:" · 모두 확인됨"}</small>`:""}
      <div class="vflist">${rows.map((x,i)=>filt&&x.status!==filt?"":`<div class="vfrow st${VF_ST.indexOf(x.status)}"><span class="vfst">${esc(x.status)}</span><div style="min-width:0;flex:1"><b>${esc(x.claim)}</b> <small class="muted">${esc(x.kind||"")}</small>${x.note?`<div style="font-size:13px">${esc(x.note)}</div>`:""}${x.source?`<small class="muted vfsrc">${/^https?:\/\//.test(x.source)?`<a href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.source.slice(0,80))}</a>`:esc(x.source)}</small>`:""}</div>
          <div class="vfme"><button class="btn small ghost" data-go="${i}" title="본문에서 이 구절로">본문</button>${x.tag?"":`<label class="chk" title="직접 대조했으면 표시"><input type="checkbox" data-me="${i}" ${x.me?"checked":""}> 직접 확인</label>`}</div></div>`).join("")||`<p class="muted" style="margin:0">아직 검증표가 없습니다.</p>`}</div></section>`;
    ov.querySelector("[data-x]").onclick=()=>{ ov.remove(); cardPaint(); };

      if(at<0) return toast("본문에서 같은 구절을 찾지 못했습니다 — 고쳐 썼거나 AI가 줄여 옮긴 구절입니다"); ov.remove(); el.focus(); el.setSelectionRange(at,at+Math.min(key.length,60)); el.blur(); el.focus(); });
    ov.querySelector("[data-ins]")?.addEventListener("click",()=>{ const el=$("#wbody"); if(!el) return; if(/^\s*■\s*부록\s*—\s*검증표/m.test(el.value)&&!confirm("원고에 이미 검증표 부록이 있습니다. 새 표를 하나 더 넣을까요? (옛 표는 직접 지워 주세요)")) return;

        const old=vfGet(w).rows; metaSet(w.id,"vtab",{at:today(),ai:r.ai||"",rows:(r.rows||[]).map(x=>({...x,me:old.find(o=>o.claim===x.claim)?.me||""}))}); save(); }
      catch(e){ err="검증하지 못했습니다: "+e.message; } busy=false; draw(); }); };
  document.body.appendChild(ov); draw(); }

    <div class="setrow"><span class="k">못 읽은 날</span>

}
function resetStreak(){ if(!confirm("「이어지는 아침」 날 수를 오늘부터 다시 셀까요?\n(읽은 기록·글·일기는 그대로 남습니다)")) return; S.settings.streakFrom=today(); save(); render(); toast("오늘부터 다시 셉니다 — 1일째 아침"); }
function setWeek(list){ const d=[...new Set(list)].sort(); if(!d.length) return toast("하루는 골라 주세요");
  S.settings.days=d; restPeek=false;
  const p=S.settings.plan; if(p.spanM&&p.spanUntil>today()){ _days.key=""; if(applySpan(p.spanM,p.spanUntil)) return; }   // 기간을 정해 두었으면 같은 끝날에 맞춰 다시 계산
  planChanged(d.length===7?"매일 읽습니다":`${[1,2,3,4,5,6,0].filter(x=>d.includes(x)).map(x=>WEEK[x]).join("·")}요일에 읽습니다`); }
function toggleWeekday(x){ const w=readWeek(); setWeek(w.includes(x)?w.filter(y=>y!==x):[...w,x]); }
function planChanged(msg){ _days.key=""; save(); toast(msg); render(); }
// 통독 방법마다 진도를 따로 보관합니다. 지우는 것은 resetPlan() 뿐입니다.
const freshPlan=()=>({perDay:3,day:0,mode:"pace",start:today(),done:{},checks:[],last:null,setOn:today()});
function planState(id){ return id===S.settings.plan.id?S.settings.plan:(S.settings.planStates||{})[id]; }
function readDays(st){ return st?(st.mode==="date"?Object.keys(st.done||{}).length:st.day||0):0; }
function setPlan(id){
  const p=S.settings.plan; if(id===p.id) return;
  const keep=S.settings.planStates=S.settings.planStates||{};
  const {id:_,...cur}=p; keep[p.id]=cur;               // 지금 방법의 진도를 보관
  const back=keep[id]; delete keep[id];
  S.settings.plan={id,...(back||freshPlan())};         // 예전 진도가 있으면 그대로 이어서
  const name=PLANS.find(x=>x.id===id).name;
  planChanged(back?`「${name}」 읽던 자리(${todayIdx()+1}일째)로 돌아왔습니다`:`「${name}」를 1일째부터 시작합니다`);
}
function resetPlan(){
  const p=S.settings.plan, name=planObj().name;
  if(!confirm(`「${name}」의 진도를 지우고 1일째부터 다시 시작할까요?\n(다른 통독 방법의 진도와 읽은 날 기록은 그대로 남습니다)`)) return;
  S.settings.plan={id:p.id,...freshPlan(),perDay:p.perDay,mode:p.mode,start:p.mode==="date"?p.start:today()};
  planChanged(`「${name}」를 처음부터 다시 시작합니다`);
}
function setMode(m){ const p=S.settings.plan; if(p.mode===m) return; const i=todayIdx(), was=doneToday();   // 읽던 자리와 오늘 읽음 도장은 그대로 두고 방식만 바꿉니다
  p.mode=m; if(!p.start) p.start=today(); setIndexTo(i,was); planChanged(m==="date"?"날짜에 맞춰 넘어갑니다":"내 속도로 넘어갑니다"); }
function setStart(v){ const p=S.settings.plan; if(!v) return; p.start=v; p.checks=[]; p.done={}; p.setOn=today(); planChanged(`${v}부터 시작한 것으로 맞췄습니다`); }
function setDay(v){ const p=S.settings.plan; p.day=Math.min(planDays().length-1,Math.max(0,(+v||1)-1)); p.checks=[]; p.last=null; planChanged(`${p.day+1}일째부터 읽습니다`); }
function setPerDay(v){ ["spanM","spanUntil","spanPer","perDayBase"].forEach(k=>delete S.settings.plan[k]); const p=S.settings.plan, old=p.perDay, n=Math.max(1,+v||1), i=Math.floor(todayIdx()*old/n); p.perDay=n; _days.key=""; setIndexTo(i); planChanged(`하루 ${n}장씩 읽습니다`); }

      <button class="btn small" onclick="saveCredit()">저장</button></div></details></div>`; }

      mergeFrom(d); save(); render(); toast("백업 파일을 합쳤습니다"); }catch(_){ toast("아침 서재 백업 파일이 아닙니다"); } };

let P=(()=>{ let o=null; try{ o=JSON.parse(localStorage.getItem("seojae.pomo")||"null"); }catch(_){} return Object.assign({phase:"focus",on:false,endsAt:0,left:null,round:1,waiting:false},o||{}); })();
const pomoSave=()=>{ try{ localStorage.setItem("seojae.pomo",JSON.stringify(P)); }catch(_){} };
const pomoLen=ph=>{ const c=pomoSet(); return ph==="focus"?c.focus:ph==="long"?c.long:c.short; };
const pomoLeft=()=>P.on?Math.max(0,P.endsAt-Date.now()):(P.left??pomoLen(P.phase)*60000);
const pomoActive=()=>P.on||(P.left!=null&&P.left<pomoLen(P.phase)*60000)||P.waiting;
const mmss=ms=>{ const t=Math.ceil(ms/1000); return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; };
const PH_NAME={focus:"집중",short:"쉼",long:"긴 쉼"};
// 오늘 집중한 횟수·분 (이 기기)
function pomoDay(){ let o=null; try{ o=JSON.parse(localStorage.getItem("seojae.pomoDay")||"null"); }catch(_){} return o&&o.d===today()?o:{d:today(),n:0,min:0}; }
function pomoDayAdd(min){ const o=pomoDay(); o.n++; o.min+=min; try{ localStorage.setItem("seojae.pomoDay",JSON.stringify(o)); }catch(_){} }
// 단축어 부르기 (맥·아이폰): shortcuts://run-shortcut?name=…&input=text&text=…
function runShortcut(name,text){ if(!name) return; const a=document.createElement("a"); a.href="shortcuts://run-shortcut?name="+encodeURIComponent(name)+(text!=null?"&input=text&text="+encodeURIComponent(text):""); a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); }
function pomoDnd(on,min){ const c=pomoSet(); if(!c.dnd) return; if(on) runShortcut(c.sOn,String(min)); else runShortcut(c.sOff); }
function pomoStart(){
  const c=pomoSet(); if(P.waiting){ P.waiting=false; }
  const left=P.left!=null&&P.left>0?P.left:pomoLen(P.phase)*60000;
  P.on=true; P.endsAt=Date.now()+left; P.left=null; pomoSave();
  if(P.phase==="focus") pomoDnd(true,Math.ceil(left/60000));
  try{ if(window.Notification&&Notification.permission==="default") Notification.requestPermission(); }catch(_){}
  pomoAudio(); pomoTick(); pomoPaint(true); }
function pomoPause(){ if(!P.on) return; P.left=pomoLeft(); P.on=false; pomoSave(); pomoPaint(true); }
function pomoStop(){ const wasFocus=P.phase==="focus"&&(P.on||P.left!=null); P.on=false; P.left=null; P.phase="focus"; P.round=1; P.waiting=false; pomoSave(); if(wasFocus) pomoDnd(false); pomoPaint(true); toast("집중 시간을 마쳤습니다"); }
function pomoSkip(){ pomoEnd(true); }
function pomoNext(){ const c=pomoSet();
  if(P.phase==="focus"){ P.phase=P.round>=c.rounds?"long":"short"; }
  else { P.round=P.phase==="long"?1:P.round+1; P.phase="focus"; } }
function pomoEnd(skipped){
  const c=pomoSet(), was=P.phase;
  if(was==="focus"&&!skipped) pomoDayAdd(c.focus);
  if(was==="focus") pomoDnd(false);
  pomoNext(); P.on=false; P.left=null;
  if(was==="focus"){ // 쉼은 저절로 시작 (설정), 집중은 내가 눌러야 시작
    if(c.autoBreak){ P.on=true; P.endsAt=Date.now()+pomoLen(P.phase)*60000; } else P.waiting=true; }
  else P.waiting=true;
  pomoSave(); pomoPaint(true);
  if(!skipped){ const msg=was==="focus"?`집중 ${c.focus}분을 마쳤습니다. ${P.phase==="long"?"길게":""} 쉬어 가세요`:"쉼이 끝났습니다. 다음 집중을 시작해 보세요";
    pomoChime(was==="focus"); toast(msg); try{ if(window.Notification&&Notification.permission==="granted"&&document.visibilityState!=="visible") new Notification("아침 서재 · 집중 시간",{body:msg,silent:false}); }catch(_){} } }
let POMO_T=null;
function pomoTick(){ clearInterval(POMO_T); POMO_T=setInterval(()=>{ if(P.on&&Date.now()>=P.endsAt) pomoEnd(false); pomoPaint(); if(!pomoActive()){ clearInterval(POMO_T); POMO_T=null; } },1000); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(P.on&&Date.now()>=P.endsAt) pomoEnd(false); pomoPaint(true); if(pomoActive()&&!POMO_T) pomoTick(); } });
// 소리: 작은 종 (집중 끝 세 번, 쉼 끝 두 번)
let AC=null; function pomoAudio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(_){} }
function pomoChime(three){ if(!pomoSet().sound) return; try{ pomoAudio(); const t0=AC.currentTime; [0,.45,.9].slice(0,three?3:2).forEach((d,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=[784,659,523][i]; g.gain.setValueAtTime(0,t0+d); g.gain.linearRampToValueAtTime(.18,t0+d+.02); g.gain.exponentialRampToValueAtTime(.001,t0+d+1.4); o.connect(g).connect(AC.destination); o.start(t0+d); o.stop(t0+d+1.5); }); }catch(_){} }
// 그리기
function pomoRing(sz,frac,ph,stroke=6){ const r=sz/2-stroke, c=2*Math.PI*r; return `<svg class="pring" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--edge)" stroke-width="${stroke}"/><circle class="parc ${ph}" cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-frac)).toFixed(1)}" transform="rotate(-90 ${sz/2} ${sz/2})"/></svg>`; }
function pomoCardHtml(){
  const c=pomoSet(), left=pomoLeft(), tot=pomoLen(P.phase)*60000, frac=1-left/tot, d=pomoDay(), act=pomoActive();
  const lens=[15,25,45,50];
  return `<div class="pomohead"><p class="label" style="margin:0">집중 시간</p><span class="muted pomoday">${d.n?`오늘 ${d.n}번 · ${d.min}분`:"오늘 아직 시작 전"}</span></div>
    <div class="pomobody"><div class="pomodial">${pomoRing(150,P.on||act?frac:0,P.phase,7)}<div class="pomoin"><span class="pph ${P.phase}">${P.waiting?(P.phase==="focus"?"다음 집중":"쉼 준비"):PH_NAME[P.phase]}</span><b id="pomotime">${mmss(left)}</b><span class="prounds">${Array.from({length:c.rounds},(_,i)=>`<i class="${i<P.round-1||(i===P.round-1&&P.phase!=="focus")?"done":i===P.round-1?"cur":""}"></i>`).join("")}</span></div></div>
      <div class="pomoctl"><div class="row" style="gap:6px;flex-wrap:wrap">
        ${P.on?`<button class="btn ink" onclick="pomoPause()">잠시 멈춤</button>`:`<button class="btn ink" onclick="pomoStart()">${P.waiting?(P.phase==="focus"?"다음 집중 시작":"쉬기 시작"):act?"이어서":"집중 시작"}</button>`}
        ${act?`<button class="btn ghost" onclick="pomoSkip()" title="이 시간을 건너뛰고 다음으로">건너뛰기</button><button class="btn ghost" onclick="pomoStop()">그만</button>`:""}</div>
        ${!act?`<div class="pills plen">${lens.map(n=>`<button class="pill ${c.focus===n?"on":""}" onclick="pomoSetSave('focus',${n})">${n}분</button>`).join("")}</div>`:""}
        <p class="hint">${P.phase==="focus"?`${c.focus}분 집중하고 ${c.short}분 쉽니다. ${c.rounds}번째 뒤에는 ${c.long}분.`:"쉬는 동안은 눈을 감거나 창밖을 보세요."}${c.dnd?" 집중하는 동안 방해금지가 켜집니다.":` <a href="#" onclick="go('settings');setTimeout(()=>$('#pomoset')?.scrollIntoView({block:'center'}),200);return false">맥 방해금지 함께 켜기</a>`}</p>
      </div></div>`;
}
// 아날로그 집중 시계: 「타임 타이머」처럼 남은 시간만큼의 부채꼴(60분 문자판)이 12시 쪽으로 줄어듭니다
function pomoClock(sz){ const left=pomoLeft(), min=left/60000, c=sz/2, R=c-2, r=R*.86, ph=P.phase;
  const ang=Math.min(359.99,Math.max(0,min/60*360)), rad=a=>(a-90)*Math.PI/180, pt=(a,rr)=>[c+rr*Math.cos(rad(a)),c+rr*Math.sin(rad(a))];
  const [x,y]=pt(ang,r), big=ang>180?1:0, ticks=[];
  for(let i=0;i<60;i++){ const m=i%5===0, [x1,y1]=pt(i*6,R-1), [x2,y2]=pt(i*6,R-(m?sz*.09:sz*.045)); ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="${m?"tk m":"tk"}"/>`); }
  const nums=sz>=90?[0,15,30,45].map(n=>{ const [tx,ty]=pt(n*6,R-sz*.17); return `<text x="${tx.toFixed(1)}" y="${(ty+sz*.035).toFixed(1)}" class="cnum">${n}</text>`; }).join(""):"";
  const [hx,hy]=pt(ang,r*.98);
  return `<svg class="pclock ${ph}" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${R}" class="face"/>
    ${ang>0.2?`<path d="M${c} ${c} L${c} ${(c-r).toFixed(1)} A${r} ${r} 0 ${big} 1 ${x.toFixed(1)} ${y.toFixed(1)} Z" class="wedge"/>`:""}
    ${ticks.join("")}${nums}<line x1="${c}" y1="${c}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" class="hand"/><circle cx="${c}" cy="${c}" r="${Math.max(2.5,sz*.045)}" class="knob"/></svg>`; }
// 넓은 화면: 본문 오른쪽 빈 공간 위쪽에 고정(스크롤해도 보임). 좁은 화면: 머리의 날 수 아래에 작은 시계
let PF=null;
function pomoFloatRoom(){ if(matchMedia("(pointer:coarse)").matches&&innerWidth<1000) return 0; const m=$("#main"); if(!m) return 0; const r=m.getBoundingClientRect(); return innerWidth-r.right; }
function pomoPlace(){ if(!PF||PF.hidden) return; const m=$("#main"), h=document.querySelector("header"); if(!m) return; const r=m.getBoundingClientRect(), room=innerWidth-r.right, w=PF.offsetWidth||150;
  PF.style.left=Math.round(r.right+(room-w)/2)+"px"; PF.style.top=Math.round(Math.max(16,(h?h.getBoundingClientRect().bottom:0)+18))+"px"; }
addEventListener("scroll",()=>{ if(PF&&!PF.hidden) pomoPlace(); },{passive:true});
addEventListener("resize",()=>{ if(pomoActive()) pomoMini(); });
function pomoMini(){ const el=$("#pomomini"); if(!el) return; const act=pomoActive();
  if(!PF){ PF=document.createElement("div"); PF.id="pomofloat"; PF.hidden=true; document.body.appendChild(PF); }
  const lbl=P.waiting?(P.phase==="focus"?"다음 집중":"쉼 준비"):PH_NAME[P.phase], tm=P.waiting?"준비":mmss(pomoLeft());
  const btns=(P.on?`<button class="pmb" onclick="pomoPause()" title="잠시 멈춤" aria-label="잠시 멈춤">❙❙</button>`:`<button class="pmb" onclick="pomoStart()" title="${P.waiting?"시작":"이어서"}" aria-label="시작">▶</button>`)+`<button class="pmb" onclick="pomoStop()" title="그만" aria-label="그만">■</button>`;
  const cls=P.phase+(P.on?"":" paused")+(P.waiting?" waiting":"");
  const room=pomoFloatRoom(), float=act&&room>=128, dsz=Math.round(Math.max(96,Math.min(132,room-32)));   // 빈 공간 크기에 맞춰 96~132px
  PF.hidden=!float; el.hidden=!act||float; if(!float) PF.dataset.k="";
  if(float&&PF.dataset.k===cls&&PF.querySelector(".pfdial")){ PF.querySelector(".pfdial").innerHTML=pomoClock(dsz); PF.querySelector(".pfinfo").innerHTML=`<span class="pml">${lbl}</span><b>${tm}</b>`; pomoPlace(); }
  else if(float){ PF.dataset.k=cls; PF.className="pomofloat "+cls; PF.innerHTML=`<div class="pfdial" title="${lbl} ${tm}">${pomoClock(dsz)}</div><div class="pfinfo"><span class="pml">${lbl}</span><b>${tm}</b></div><div class="pfbtn">${btns}<button class="pmb" onclick="go('today');setTimeout(()=>$('#pomocard')?.scrollIntoView({block:'center',behavior:'smooth'}),80)" title="집중 시간 카드로" aria-label="카드로">⌂</button></div>`; pomoPlace(); }
  if(!act){ el.innerHTML=""; return; }
  if(!float){ el.className="pomomini "+cls;
    el.innerHTML=`<button class="pmgo" onclick="go('today');setTimeout(()=>$('#pomocard')?.scrollIntoView({block:'center',behavior:'smooth'}),80)" title="집중 시간 카드로">${pomoClock(34)}<span class="pml">${lbl}</span><b>${tm}</b></button>`+btns; } }
function pomoPaint(full){ pomoMini(); const card=$("#pomocard"); if(!card) return;
  if(full||!$("#pomotime")) card.innerHTML=pomoCardHtml();
  else { const left=pomoLeft(), tot=pomoLen(P.phase)*60000, r=card.querySelector(".pomodial .parc"); $("#pomotime").textContent=mmss(left); if(r){ const c=+r.getAttribute("stroke-dasharray"); r.setAttribute("stroke-dashoffset",(c*(left/tot)).toFixed(1)); } }
  document.title=P.on?`${mmss(pomoLeft())} ${PH_NAME[P.phase]} · 아침 서재`:"아침 서재"; }
setTimeout(()=>{ if(P.on&&Date.now()>=P.endsAt) pomoEnd(false); pomoPaint(true); if(pomoActive()) pomoTick(); },0);

document.addEventListener("focusin",e=>{ if(e.target.matches?.("textarea,input:not([type=checkbox]):not([type=file]),select")) document.body.classList.add("typing"); });
document.addEventListener("focusout",()=>setTimeout(()=>{ if(!document.activeElement?.matches?.("textarea,input,select")) document.body.classList.remove("typing"); },60));
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="s"&&tab==="write"){ e.preventDefault(); saveWriting(); }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"&&tab==="room"&&ROOM_CODEX&&$(".codexpage")){ e.preventDefault(); codexSave(ROOM_CODEX,true); }   // 노트 화면 「간직」 (⌘S·Ctrl+S) — 화면을 다시 그리지 않아 커서 그대로
  if(e.ctrlKey&&!e.metaKey&&e.key==="y"&&tab==="write"&&e.target.matches?.("#wbody")){ e.preventDefault(); tUndo(true); }   // 윈도우식 다시 하기 (⌘Z·⇧⌘Z·Ctrl+Z 는 브라우저가 그대로 처리)
  if(e.key==="Escape"&&document.body.classList.contains("focus")) toggleFocus();
});
function ensurePlan(){
  const st=S.settings;
  if(st.plan) return;
  const b=st.bible||{idx:0,ch:1,perDay:3};  // 첫 버전의 '순서대로' 진도를 이어받습니다
  const offset=BIBLE.slice(0,b.idx).reduce((a,x)=>a+x[1],0)+b.ch-1;
  st.plan={id:"seq",perDay:b.perDay||3,day:Math.floor(offset/(b.perDay||3)),mode:"pace",start:today(),done:{},checks:[],last:null};
}
load().then(()=>{ ensurePlan(); ensureMs(); render(); setTimeout(checkUpdate,1500); });
</script>
