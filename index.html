<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아침 서재</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아침 서재">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8dfcf" id="themecolor">
<meta name="color-scheme" content="light" id="colorscheme">
<script>
// 화면 밝기: 기기의 야간 모드와 상관없이 기본은 '밝게'. 설정에서 기기마다 '어둡게'·'기기 설정 따라'를 고를 수 있습니다.
// (화면이 그려지기 전에 정해야 어둡게 번쩍이지 않아서 맨 앞에 둡니다)
function applyTheme(t){
  t=t||(()=>{ try{ return localStorage.getItem("seojae.theme"); }catch(_){ return null; } })()||"light";
  const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.getElementById("colorscheme").content=dark?"dark":"light";
  document.getElementById("themecolor").content=dark?"#1a1612":"#e8dfcf";
  return t;
}
applyTheme();
// 이 기기만의 노트 꾸미기(종이 색·글자 색·글자 크기): 화면이 그려지기 전에 적용 (localStorage seojae.look — 휴대폰과 컴퓨터를 따로)
function applyLook(){
  let L={}; try{ L=JSON.parse(localStorage.getItem("seojae.look")||"{}")||{}; }catch(_){}
  const r=document.documentElement.style, fs=+L.fs||0;
  if(fs){ r.setProperty("--note-fs",fs+"px"); r.setProperty("--note-lh",Math.round(fs*2)+"px"); } else { r.removeProperty("--note-fs"); r.removeProperty("--note-lh"); }
  if(L.bg) r.setProperty("--note-bg",L.bg); else r.removeProperty("--note-bg");
  if(L.ink) r.setProperty("--note-ink",L.ink); else r.removeProperty("--note-ink");
  if(+L.sufs) r.setProperty("--su-fs",(+L.sufs)+"px"); else r.removeProperty("--su-fs");   // 매일성경 본문·해설 글자 크기
  return L;
}
applyLook();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e8dfcf; --paper:#fbf7ee; --paper-2:#f5eedf; --ink:#2e2721; --ink-soft:#6d6157; --faint:#7a6d5c; --deco:#b8ab98;
  --rule:rgba(110,140,170,.28); --margin:rgba(196,84,72,.42); --edge:rgba(80,60,40,.14);
  --sepia:#8a5a2b; --bible:#7a2e3a; --bible-wash:rgba(122,46,58,.08); --book:#2f5d4e; --book-wash:rgba(47,93,78,.09);
  --tape-a:rgba(214,170,120,.55); --tape-b:rgba(160,190,170,.55); --tape-c:rgba(200,150,160,.5);
  --wood-1:#9b6b43; --wood-2:#7c5233; --stamp:#b23a2e; --shadow:0 1px 1px rgba(60,40,20,.08),0 10px 24px -14px rgba(60,40,20,.35);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1a1612; --paper:#29231d; --paper-2:#231e19; --ink:#ece2d2; --ink-soft:#b7a993; --faint:#9a8c78; --deco:#6a5e50;
    --rule:rgba(236,226,210,.10); --margin:rgba(220,110,95,.35); --edge:rgba(0,0,0,.4);
    --sepia:#d9a466; --bible:#e09aa6; --bible-wash:rgba(224,154,166,.08); --book:#8fcfb8; --book-wash:rgba(143,207,184,.08);
    --tape-a:rgba(190,150,100,.35); --tape-b:rgba(120,160,140,.35); --tape-c:rgba(180,120,135,.35);
    --wood-1:#5a3d26; --wood-2:#3f2a1a; --stamp:#e0705f; --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --desk:#1a1612; --paper:#29231d; --paper-2:#231e19; --ink:#ece2d2; --ink-soft:#b7a993; --faint:#9a8c78; --deco:#6a5e50;
  --rule:rgba(236,226,210,.10); --margin:rgba(220,110,95,.35); --edge:rgba(0,0,0,.4);
  --sepia:#d9a466; --bible:#e09aa6; --bible-wash:rgba(224,154,166,.08); --book:#8fcfb8; --book-wash:rgba(143,207,184,.08);
  --tape-a:rgba(190,150,100,.35); --tape-b:rgba(120,160,140,.35); --tape-c:rgba(180,120,135,.35);
  --wood-1:#5a3d26; --wood-2:#3f2a1a; --stamp:#e0705f; --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{background:var(--desk)}
body{margin:0;min-height:100vh;background:var(--desk) var(--grain);color:var(--ink);font-family:"Gowun Batang",serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--sepia)}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}   /* 모든 메뉴 같은 폭 (2026-10-28) */
html{scrollbar-gutter:stable}   /* 글이 짧아 스크롤 막대가 없어져도 화면이 옆으로 밀리지 않게 */
.pen{font-family:"Nanum Pen Script",cursive;font-weight:400}
.myeongjo{font-family:"Nanum Myeongjo",serif}

/* 머리 */
header{padding:22px 0 0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:"Nanum Pen Script";font-size:44px;line-height:1;color:var(--ink);cursor:pointer;user-select:none;border-radius:6px;padding:2px 6px;margin-left:-6px;transition:background .15s}
.brand:hover{background:rgba(138,90,43,.08)}
.brand small{display:block;font-family:"Nanum Myeongjo";font-size:12px;letter-spacing:.35em;color:var(--faint);margin-top:6px}
/* 오른쪽: 이어지는 날 수(또렷한 숫자) + 톱니 */
.topright{display:flex;align-items:center;gap:14px;padding-bottom:4px}
.streak{display:flex;align-items:baseline;gap:6px;font-family:"Nanum Pen Script";font-size:21px;color:var(--sepia);line-height:1;white-space:nowrap}
.streak .n{font-family:"Nanum Myeongjo";font-weight:800;font-size:34px;color:var(--bible);letter-spacing:-.02em;line-height:1}
.streak .rest{font-size:12.5px;font-family:"Gowun Batang";color:var(--faint);border:1px solid var(--edge);border-radius:999px;padding:1px 8px;margin-right:4px;align-self:center}
nav{display:flex;gap:6px;margin-top:20px;overflow-x:auto;overflow-y:hidden;padding:0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:15px;color:var(--ink-soft);background:var(--paper-2) var(--grain);border:1px solid var(--edge);border-bottom:0;border-radius:10px 10px 0 0;padding:8px 16px 7px;cursor:pointer;white-space:nowrap;transform:translateY(3px);transition:transform .15s}
nav button:hover{transform:translateY(0)}
nav button.on{background:var(--paper) var(--grain);color:var(--ink);font-weight:700;transform:translateY(1px);box-shadow:0 -2px 0 var(--sepia) inset}
/* 글쓰기(글방): 다른 탭과 떨어진 먹빛 탭 — 펜 그림, 손글씨 이름 */
nav button.navroom{margin-left:auto;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#2f3b52,#253045);color:#efe6d4;border-color:#1d2536;font-family:"Nanum Pen Script";font-size:21px;line-height:1;padding:7px 18px 6px;letter-spacing:.02em}
nav button.navroom .ico{width:16px;height:16px;stroke:#d9b779}
nav button.navroom:hover{color:#fff}
nav button.navroom.on{background:linear-gradient(180deg,#34425c,#2a3650);color:#fff;box-shadow:0 -2px 0 #d9b779 inset;font-weight:400}
nav button.navai{display:flex;align-items:center;gap:4px;margin-left:6px;background:color-mix(in srgb,#7a5aa8 12%,var(--paper));color:#6b4a9a;border-color:#c9b4e3;font-weight:700;padding:8px 13px 7px}
nav button.navai.on{background:#7a5aa8;color:#fff;box-shadow:none}
:root[data-theme="dark"] nav button.navai{color:#d7c4f0;border-color:#5e4a80}
:root[data-theme="dark"] nav button.navroom{background:linear-gradient(180deg,#3a4a68,#2c3852);border-color:#46577a}
.navline{height:1px;background:var(--edge)}
main.wrap{padding:34px 16px 80px}

/* 종이 */
.sheet{position:relative;background:var(--paper) var(--grain);border-radius:3px;padding:24px 24px 22px;box-shadow:var(--shadow);border:1px solid var(--edge)}
.sheet.tape::before{content:"";position:absolute;top:-11px;left:calc(50% - 55px);width:110px;height:24px;background:repeating-linear-gradient(45deg,var(--tape-a) 0 8px,transparent 8px 12px),var(--tape-a);opacity:.85;transform:rotate(-2.5deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet.tape.b::before{background:var(--tape-b);transform:rotate(2deg);left:24px}
.sheet.tape.c::before{background:repeating-linear-gradient(90deg,var(--tape-c) 0 6px,transparent 6px 10px),var(--tape-c);transform:rotate(-1.5deg);left:auto;right:28px}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
.sheet.wide{grid-column:1 / -1}
.lookgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 32px;margin-top:4px}
.lookgrid .setrow{margin-top:12px;align-items:flex-start} .lookgrid .setrow>.k{min-width:96px;padding-top:4px}
.lookgrid .pills{gap:6px} .lookgrid .pill{padding:4px 11px;font-size:13.5px}
.label{font-family:"Nanum Pen Script";font-size:22px;color:var(--sepia);line-height:1.1;margin:0 0 6px}
.label.bible{color:var(--bible)} .label.book{color:var(--book)}
h2{font-family:"Nanum Myeongjo";font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:14px}
.muted{color:var(--faint);font-size:14.5px}
.big{font-family:"Nanum Myeongjo";font-weight:700;font-size:22px;margin:4px 0 6px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* 날짜 */
.dateline{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.dateline .d{font-family:"Nanum Myeongjo";font-weight:800;font-size:46px;letter-spacing:-.02em;line-height:1}
.dateline .w{font-family:"Nanum Pen Script";font-size:28px;color:var(--ink-soft)}
/* 날마다 하는 세 가지: 성경 읽기 · 묵상 · 책 읽기 (오늘 했으면 체크) */
.routine{display:inline-flex;gap:6px;margin-left:auto;align-self:center}
.routine button{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--edge);background:var(--paper-2);border-radius:999px;padding:3px 12px 3px 6px;color:var(--faint);cursor:pointer}
.routine button.on{color:var(--ink);background:var(--paper)}
.routine svg{width:20px;height:20px}
@media (max-width:700px){ .routine{margin-left:0;width:100%} .routine button{padding:4px 10px 4px 5px;font-size:13px} }

/* 입력 */
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--deco);padding:6px 2px;width:100%;border-radius:0}
select{border:1px solid var(--edge);border-radius:6px;padding:6px 8px;background:var(--paper)}
textarea{border:1px dashed var(--deco);border-radius:4px;padding:10px;resize:vertical;min-height:90px;line-height:1.8}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sepia)}
.field{margin:12px 0 0}
.field>span{display:block;font-family:"Nanum Pen Script";font-size:19px;color:var(--ink-soft);line-height:1}

/* 버튼 */
.btn{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--ink-soft);border-radius:999px;padding:6px 16px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--paper-2)}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ink:hover{opacity:.9;background:var(--ink)}
.btn.small{font-size:13px;padding:3px 11px}
.btn.ghost{border-color:transparent;color:var(--ink-soft)}
.btn.danger{color:var(--stamp);border-color:transparent}
/* 밀랍 봉인 */
.sealrow{display:flex;gap:16px;align-items:center}
.seal{flex:0 0 auto;width:118px;height:118px;padding:0;border:0;background:none;cursor:pointer;transition:transform .2s ease;-webkit-tap-highlight-color:transparent}
.seal svg{width:100%;height:100%;display:block;overflow:visible}
.seal:hover{transform:rotate(-5deg) translateY(-2px)}
.seal:focus-visible{outline:2px dashed var(--sepia);outline-offset:4px;border-radius:50%}
.seal.press svg{animation:stampdown .5s cubic-bezier(.3,.6,.3,1)}
@keyframes stampdown{0%{transform:scale(1)}35%{transform:scale(.86) rotate(-4deg)}60%{transform:scale(1.04) rotate(1deg)}100%{transform:scale(1)}}
.sealtext{font-size:14px;line-height:1.6;color:var(--ink-soft)}

/* 흐름: 밑줄 → 글 → 원고 */
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.flow span{flex:1;min-width:120px;background:var(--paper-2);border:1px dashed var(--edge);border-radius:6px;padding:8px 10px;line-height:1.45}
.flow b{display:block;font-family:"Nanum Pen Script";font-weight:400;font-size:22px;color:var(--sepia);line-height:1}
.flow i{align-self:center;font-style:normal;color:var(--faint);font-size:18px}
/* 오늘 카드 안의 밑줄 */
.noteform{margin-top:14px;padding:14px;background:var(--paper-2);border:1px dashed var(--sepia);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.noteform textarea{min-height:72px;font-size:16px;background:var(--paper)}
.todaynotes{margin-top:14px;border-top:1px dashed var(--edge);padding-top:10px}
.mini-note{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px;line-height:1.5}
/* 글쓰기: 더 적기 */
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-family:"Nanum Myeongjo";font-weight:700;font-size:14px;color:var(--ink-soft);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";color:var(--sepia)}
details.more[open] summary::before{content:"▾ "}
/* 원고 꼭지 */
ol.chapters{list-style:none;padding:0;margin:12px 0}
ol.chapters li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--edge);font-size:15px}
ol.chapters .cn{font-size:21px;color:var(--sepia);width:20px;text-align:center}
ol.chapters .btn[disabled]{opacity:.25;cursor:default}

/* 원고 만들기 · 서랍 거르기 */
.bigchoice{font:inherit;color:inherit;text-align:left;width:100%;padding-left:16px}
.bigchoice:hover{border-color:var(--sepia)}
.rulegrid{display:grid;grid-template-columns:72px 1fr;gap:10px 12px;align-items:start;margin:10px 0}
.rulegrid .rl{font-family:"Nanum Pen Script";font-size:20px;color:var(--ink-soft);line-height:1.6}
.preview{background:var(--paper-2);border:1px dashed var(--sepia);border-radius:6px;padding:10px 14px}
.rulechips{font-size:13px;color:var(--bible);background:var(--bible-wash);border-radius:4px;padding:3px 8px;display:inline-block;margin:2px 0 6px}
.filterbar{margin-top:12px;gap:8px}
.filterbar select{flex:1;min-width:120px}
@media (max-width:700px){ .rulegrid{grid-template-columns:1fr;gap:2px} .rulegrid .rl{margin-top:8px} }

ol.toc{margin:6px 0 4px;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink-soft);max-height:320px;overflow:auto}
.pre{white-space:pre-wrap}

/* 책 미리보기 (PDF) */
.bookview{position:fixed;inset:0;z-index:60;background:var(--desk);display:flex;flex-direction:column}
.bv-bar{display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--edge)}
.bv-hint{margin:0;padding:6px 16px;background:var(--paper-2)}
.bookview iframe{flex:1;width:100%;border:0;background:#d9cfc0}

.draftbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper-2);border:1px dashed var(--sepia);border-radius:6px;padding:6px 12px;margin-bottom:10px;font-size:14px;color:var(--ink-soft)}

/* 도움말 · 단계 */
.hint{display:block;font-size:13.5px;line-height:1.55;color:var(--faint);margin-top:4px}
.step{display:flex;align-items:center;gap:8px;font-family:"Nanum Myeongjo";font-weight:700;font-size:15px;margin:0 0 6px}
.step .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sepia);color:var(--sepia);font-family:"Nanum Pen Script";font-size:18px;line-height:1}

/* 오늘의 말씀: 읽기 목록 */
.planline{font-size:15px;margin:2px 0 10px;color:var(--ink-soft)}
.portions{display:flex;flex-direction:column;gap:2px}
.portion{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--edge);padding:9px 2px;cursor:pointer}
.portion:last-child{border-bottom:0}
.portion .tick{color:var(--ink-soft);display:flex}
.portion .plab{font-family:"Nanum Pen Script";font-size:18px;color:var(--bible);min-width:44px}
.portion .ptext{font-family:"Nanum Myeongjo";font-weight:700;font-size:18px}
.portion.on .ptext{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--stamp);text-decoration-thickness:1.5px}
.portions-flow{font-family:"Nanum Myeongjo";font-weight:700;font-size:16px;line-height:1.9}
.portions-flow span:not(:last-child)::after{content:" · ";color:var(--faint);font-weight:400}
.portions-flow.done{color:var(--faint)}

/* 설정: 통독 방법 카드 */
.plancards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.plancards.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.plancard{position:relative;display:block;cursor:pointer;background:var(--paper-2);border:1px solid var(--edge);border-radius:6px;padding:14px 16px 12px 42px;transition:border-color .15s,background .15s}
.plancard input{position:absolute;left:14px;top:17px;width:auto;accent-color:var(--bible)}
.plancard.on{border-color:var(--bible);background:var(--bible-wash)}
.pc-head{display:flex;gap:8px;align-items:baseline;font-family:"Nanum Myeongjo";font-size:17px}
.pc-how{font-size:14px;line-height:1.65;color:var(--ink-soft);margin-top:4px}
.pc-ex{font-size:13px;color:var(--faint);margin-top:8px;line-height:1.5}
.pc-ex .pen{font-size:17px;color:var(--sepia)}

/* 도장 */
/* 고무도장: 이중 테두리로 또렷하게 (예전의 종이 질감 mask는 도장을 거의 투명하게 만들어 뺐습니다) */
.stamp{display:inline-block;font-family:"Nanum Pen Script";font-size:23px;line-height:1;letter-spacing:.5px;color:var(--stamp);border:2.5px solid currentColor;border-radius:6px;padding:5px 12px 3px;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3.5px currentColor;opacity:.92;white-space:nowrap}
.stamp.round{border-radius:50%;width:66px;height:66px;display:inline-flex;align-items:center;justify-content:center;padding:0;transform:rotate(-12deg)}
.stamp.ok{color:var(--book)}
.stamp.err{color:var(--stamp)}

/* 칩 */
.chip{display:inline-block;font-size:13px;padding:1px 10px;border:1px solid var(--edge);border-radius:999px;margin:3px 4px 0 0;color:var(--ink-soft);background:var(--paper-2);cursor:pointer;user-select:none}
.chip.on{background:var(--bible-wash);color:var(--bible);border-color:var(--bible)}
.chip.book.on{background:var(--book-wash);color:var(--book);border-color:var(--book)}
.tag{font-family:"Nanum Pen Script";font-size:19px;color:var(--sepia);margin-right:8px}

/* 질문 */
ol.q{margin:4px 0 0;padding-left:22px}
ol.q li{margin:8px 0;font-size:16px}
ol.q li::marker{font-family:"Nanum Pen Script";color:var(--sepia);font-size:20px}

/* 메모 */
.item{padding:14px 0;border-top:1px dashed var(--edge)}
.item:first-child{border-top:0}
.quote{font-family:"Nanum Myeongjo";font-size:17px;line-height:1.85;border-left:3px solid var(--sepia);padding:2px 0 2px 14px;margin:6px 0;white-space:pre-wrap}
.quote.bible{border-color:var(--bible)} .quote.book{border-color:var(--book)}
.thought{font-family:"Nanum Pen Script";font-size:21px;color:var(--ink-soft);line-height:1.3;white-space:pre-wrap}

/* 노트 페이지 */
.notebook{position:relative;background:var(--paper) var(--grain);box-shadow:var(--shadow);border:1px solid var(--edge);border-radius:2px 6px 6px 2px;padding:30px 118px 26px 84px}
.notebook::after{content:"";position:absolute;top:30px;bottom:26px;right:104px;width:0;border-left:1px dashed rgba(138,90,43,.18)}   /* 오른쪽 스티커 여백 */
body.readmode .notebook::after,body.focus .notebook::after{display:none}
@media (max-width:880px){ .notebook::after{display:none} }   /* 좁은 화면에는 스티커 여백이 없으니 점선도 없음 */
.notebook::before{content:"";position:absolute;left:22px;top:30px;bottom:30px;width:16px;background:radial-gradient(circle,var(--desk) 6px,rgba(0,0,0,.12) 7px,transparent 8px) 0 0/16px 72px repeat-y}
.notebook .title-in{font-family:"Nanum Myeongjo";font-weight:800;font-size:26px;border:0;border-bottom:2px solid var(--ink);padding:4px 0;margin-bottom:6px}
.notebook .meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--faint);font-size:14px;margin-bottom:10px}
textarea.page{display:block;width:100%;min-height:62vh;border:0;border-radius:0;padding:4px 4px 0;resize:none;overflow:hidden;
  font-family:"Gowun Batang",serif;font-size:var(--note-fs,18px);line-height:var(--note-lh,36px);color:var(--penink,var(--ink));
  background-color:transparent;background-attachment:local;background-position:0 3px}
textarea.page.lined{background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--note-lh,36px) - 1px),var(--rule) calc(var(--note-lh,36px) - 1px) var(--note-lh,36px))}
/* 이 기기만의 노트 꾸미기 (설정 → 화면 꾸미기): 종이 색·글자 색·글자 크기 */
.notebook{background-color:var(--note-bg,var(--paper))}
.notebook .title-in,.notebook .meta,#readview{color:var(--note-ink,var(--ink))}
.notebook .title-in{border-bottom-color:var(--note-ink,var(--ink))}
/* 소제목 굵게 보이는 거울 층 (글자 칸 위에 겹침, 누르기는 통과) */

.hmirror i.mkfn .fnsup{position:absolute;left:0;top:-.42em;font:700 .62em/1 Georgia,serif;color:#a0522d} .hmirror i.mkfn.en .fnsup{color:#4f7fa8}
.hmirror i.mkfn .fntx{visibility:visible;position:absolute;left:.95em;right:0;top:50%;transform:translateY(-50%);font-size:.66em;line-height:1.2;color:var(--ink-soft);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnpane{margin:14px 0 4px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 25%,transparent);max-width:46%;min-width:260px;font:13px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink-soft)}
.fnpane .fnh{margin:4px 0 2px;font-weight:600;color:var(--ink)} .fnpane .fnh small{font-weight:400;color:var(--faint)} .fnpane ol{margin:0;padding:0;list-style:none} .fnpane li{display:flex;align-items:flex-start;gap:2px}

.fnpane .fned{border:0;background:none;color:var(--faint);cursor:pointer;font-size:12px} .fnkind{display:flex;gap:14px;margin-bottom:6px;font-size:13px} .fnkind small{color:var(--faint)}

@media (max-width:700px){ .fnpane{max-width:none} } .hmirror i.mki{visibility:visible;font-style:normal;color:transparent;text-decoration:underline dotted color-mix(in srgb,var(--sepia) 75%,transparent);text-decoration-thickness:1.5px;text-underline-offset:5px}

function dedupeWritings(){
  // 같은 날·갈래·종류·제목·본문 위치에 본문 앞 200자까지 같은 글(또는 본문이 똑같은 글)만 같은 글로 봅니다. 본문이 더 긴 쪽을 남기고(같으면 노션 실린 쪽, 그다음 먼저 만든 쪽),
  // 남는 쪽에 노션 번호가 없으면 물려받습니다. 지워지는 쪽은 휴지통으로만 보냅니다(노션 페이지는 건드리지 않음 — 사람이 휴지통에서 확인)
  const norm=t=>String(t||"").replace(/\s+/g," ").trim(), seen=new Map(), drop=[];
  const keyOf=w=>{ const t=norm(w.title); const pl=w.type==="설교초안"?(w.place||""):""; return t?[w.date,w.track,w.type,pl,"t",t,norm(w.passage),norm(w.body).slice(0,200)].join("|"):[w.date,w.track,w.type,pl,"b",norm(w.body)].join("|"); };
  for(const w of live().slice().sort((a,b)=>a.id.localeCompare(b.id))){ const k=keyOf(w), o=seen.get(k);
    if(!o){ seen.set(k,w); continue; }
    const lb=norm(w.body).length-norm(o.body).length;
    const keep=lb>0?w:lb<0?o:(o.notion?.page&&!w.notion?.page)?o:(w.notion?.page&&!o.notion?.page)?w:o, gone=keep===o?w:o;
    if(!keep.notion?.page&&gone.notion?.page){ keep.notion=gone.notion; keep.syncedAt=gone.syncedAt; gone.notion=null; }
    for(const f of ["summary","topics","situations","stickers","prev"]) if(!keep[f]?.length&&gone[f]?.length) keep[f]=gone[f];
    seen.set(k,keep); drop.push(gone); }
  if(!drop.length) return;
  const now=new Date().toISOString(); drop.forEach(w=>{ w.trashed=now; w.updated=now; S.manuscripts.forEach(m=>{ if(m.items) m.items=m.items.filter(x=>x!==w.id); }); });
  if(drop.some(w=>w.id===editId)) editId=null;
  setTimeout(()=>{ toast(`같은 글 ${drop.length}편을 휴지통으로 옮겼습니다 (서랍 → 휴지통에서 확인)`); save(); if(tab!=="write") render(); },800);
}

    else if(dirty||!d.writings){ clearTimeout(saveT); saveT=null; mergeFrom(d); PENDING=true; }
    else if((d.rev??0)!==known) useData(d);               // 다른 기기에서 바뀐 것이 있으면 최신으로
    else changed=false;
    READY=true; takeSnap(); try{ purgeOldTrash(); }catch(_){} try{ roomBase(); }catch(_){}
    if(PENDING){ PENDING=false; pushSave(); }
    else if(changed&&!first){ try{ localStorage.setItem(LKEY,SER()); }catch(_){} }
    if(changed&&!first){ ensurePlan(); ensureMs(); if(tab!=="write") render(); else afterRemote(); }   // 쓰는 중이면 화면을 바꾸지 않음(손대지 않은 글만 새 판으로)
    if(window._justConnected){ window._justConnected=false; setTimeout(()=>toast("이 기기를 아침 서재에 연결했습니다"),300); }
  }catch(e){
    if(AUTH_FAIL){ if(!first) render(); return; }
    if(first){
      SERVER=false;
      try{ const d=JSON.parse(localStorage.getItem(LKEY)); if(d) S=Object.assign(blank(),d); else migrate(); }catch(_){}
      if(GAS&&!window._firstRetry){ window._firstRetry=1; setTimeout(()=>fetchFresh(true).then(()=>{ if(SERVER) render(); }),15000); }   // 잠시 뒤 한 번 더
    } else {
      toast("최신 기록을 아직 받지 못해 이 기기의 사본을 보여 드립니다");
      setTimeout(()=>fetchFresh(false),15000);          // 잠시 뒤 다시 시도
    }
  }
}

function takeSnap(){

  for(const k in (S.settings||{})) SNAP.sk[k]=JSON.stringify(S.settings[k]);

function stampChanges(){
  if(!SNAP) return takeSnap();
  const now=new Date().toISOString();
  if(!S.settingsTs){ S.settingsTs={}; for(const k in (S.settings||{})) S.settingsTs[k]=S.settingsT||""; }   // 처음엔 모든 칸을 지금까지의 설정 시각으로
  if(SNAP.settings!==JSON.stringify(S.settings)){ S.settingsT=now;
    for(const k of new Set([...Object.keys(S.settings||{}),...Object.keys(SNAP.sk||{})])) if((SNAP.sk||{})[k]!==JSON.stringify(S.settings[k])) S.settingsTs[k]=now; }   // 바뀐 칸에만 시각

function dSameText(a,b){ if(a.includes(b)||b.includes(a)) return true; const n=t=>t.replace(/\s+/g," ").trim();
  const L=new Set(a.split("\n").map(n).filter(x=>x.length>=4)); if(b.split("\n").map(n).some(x=>x.length>=4&&L.has(x))) return true;
  const bg=t=>{ const c=t.replace(/\s+/g,""), m=new Map(); for(let i=0;i<c.length-1;i++){ const k=c.slice(i,i+2); m.set(k,(m.get(k)||0)+1); } return [m,Math.max(0,c.length-1)]; };   // 글자 두 개씩 겹치는 정도
  const [ma,na]=bg(a), [mb,nb]=bg(b); if(!na||!nb) return false; let both=0; for(const [k,v] of ma) both+=Math.min(v,mb.get(k)||0); return 2*both/(na+nb)>=0.5; }
// 항목 안을 칸 단위로: 글의 모드 정보 meta는 칸마다 시각(metaTs)이 나중인 쪽, 원고 안 목록(자료·줄기·복선·차례 후보)은 항목 id마다 u가 나중인 쪽 + 묘비
function mergeInner(win,lose,del){
  if(lose.metaTs){ const wm=win.meta=Object.assign({},win.meta||{}), wt=win.metaTs=Object.assign({},win.metaTs||{});
    for(const [k,t] of Object.entries(lose.metaTs)){ if((t||"")>(wt[k]||"")){ wt[k]=t; if(lose.meta&&k in lose.meta) wm[k]=lose.meta[k]; else delete wm[k]; } } }
  for(const f of ["research","threads","seeds","orders"]){ if(!Array.isArray(lose[f])) continue; const mp=new Map((win[f]||[]).map(x=>[x.id,x]));
    lose[f].forEach(x=>{ const y=mp.get(x.id); if(!y||(x.u||x.at||"")>(y.u||y.at||"")) mp.set(x.id,x); });
    win[f]=[...mp.values()].filter(x=>{ const t=del[x.id]; return !t||(x.u||"")>t; }); }

    const r=el.getBoundingClientRect(); st={dx:e.clientX-r.left,dy:e.clientY-r.top,x0:e.clientX,y0:e.clientY,moved:false}; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener("pointermove",e=>{ if(!st) return; if(!st.moved&&Math.hypot(e.clientX-st.x0,e.clientY-st.y0)<5) return; st.moved=true; el.classList.add("drag");
    const r=el.getBoundingClientRect(), x=Math.max(6,Math.min(innerWidth-r.width-6,e.clientX-st.dx)), y=Math.max(6,Math.min(innerHeight-r.height-6,e.clientY-st.dy));

// 크기: s 작게(영상 200×200만) · m 보통(영상 224×200 + 목록) · l 크게(영상 330×330 + 목록). 유튜브 규칙상 영상은 200×200보다 작게·가리게 하지 않음

const DICT=new Map(); let dictT=null, dictWord="";
function wordAt(x,y){
  let node,off; if(document.caretRangeFromPoint){ const r=document.caretRangeFromPoint(x,y); if(!r) return null; node=r.startContainer; off=r.startOffset; }
  else if(document.caretPositionFromPoint){ const p=document.caretPositionFromPoint(x,y); if(!p) return null; node=p.offsetNode; off=p.offset; } else return null;
  if(!node||node.nodeType!==3||!node.parentElement?.closest("#sutext .vt.en")) return null;
  const t=node.textContent, isW=ch=>/[A-Za-z'’-]/.test(ch||""); let a=off,b=off; while(a>0&&isW(t[a-1])) a--; while(b<t.length&&isW(t[b])) b++;
  const w=t.slice(a,b).replace(/^['’-]+|['’-]+$/g,""); return w.length>=2?w:null;
}
async function dictLookup(w){
  const k=w.toLowerCase(); if(DICT.has(k)) return DICT.get(k);
  const out={w:k,ko:"",ph:"",defs:[]};
  await Promise.all([
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(k)}&langpair=en%7Cko`).then(r=>r.json()).then(j=>{ const seen=new Set(); out.ko=[j.responseData?.translatedText,...(j.matches||[]).map(m=>m.translation)].map(x=>String(x||"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim()).filter(x=>x&&x.length<=24&&!/[A-Za-z<>]{2,}/.test(x)&&!seen.has(x)&&seen.add(x)).slice(0,3).join(", "); }).catch(()=>{}),
    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(k)}`).then(r=>r.ok?r.json():[]).then(j=>{ const e=j[0]; if(!e) return; out.ph=e.phonetic||""; out.defs=(e.meanings||[]).slice(0,2).map(m=>({pos:m.partOfSpeech,d:m.definitions?.[0]?.definition||""})); }).catch(()=>{})
  ]);
  DICT.set(k,out); return out;
}
async function showDict(w,x,y){
  dictWord=w; let p=$("#dictpop"); if(!p){ p=document.createElement("div"); p.id="dictpop"; p.className="dictpop"; document.body.appendChild(p); }
  p.innerHTML=`<b>${esc(w)}</b> <span class="muted">찾는 중…</span>`; place(); const d=await dictLookup(w); if(dictWord!==w||!$("#dictpop")) return;
  p.innerHTML=`<b>${esc(d.w)}</b> ${d.ph?`<span class="muted">${esc(d.ph)}</span>`:""}${d.ko?`<div class="ko">${esc(d.ko)}</div>`:""}
    ${d.defs.map(x=>`<div><span class="pos">${esc(x.pos)}</span> ${esc(x.d)}</div>`).join("")}${!d.ko&&!d.defs.length?`<div class="muted">뜻을 찾지 못했습니다.</div>`:""}
    <div style="margin-top:6px"><a class="muted" href="https://en.dict.naver.com/#/search?query=${encodeURIComponent(d.w)}" target="_blank" rel="noopener">네이버 영어사전 ↗</a></div>`; place();
  function place(){ const w2=p.offsetWidth,h=p.offsetHeight; p.style.left=Math.max(8,Math.min(innerWidth-w2-8,x-w2/2))+"px"; p.style.top=(y+18+h>innerHeight?y-h-14:y+18)+"px"; }

const chapterList=(from,to)=>{ const L=[]; for(let i=from;i<to;i++) for(let c=1;c<=BIBLE[i][1];c++) L.push([i,c]); return L; };
const OT=chapterList(0,39), NT=chapterList(39,66), ALLCH=chapterList(0,66), PSALMS=chapterList(18,19);
const split=(L,n,r=Math.floor)=>Array.from({length:n},(_,d)=>L.slice(r(d*L.length/n),r((d+1)*L.length/n)));

function fmt(chs){ // 같은 책의 이어지는 장은 묶어서: 창세기 1-3장

  for(const [b,c] of chs){ if(cur&&cur.b===b&&cur.e===c-1) cur.e=c; else parts.push(cur={b,s:c,e:c}); }
  return parts.map(p=>`${BIBLE[p.b][0]} ${p.s===p.e?p.s:p.s+"-"+p.e}${p.b===18?"편":"장"}`);
}

let _days={key:"",val:null};
const planObj=()=>PLANS.find(p=>p.id===S.settings.plan.id)||PLANS[0];
function planDays(){
  const p=S.settings.plan, pl=planObj(), k=p.id+"/"+p.perDay+"/"+(p.span||0);
  if(_days.key!==k){ let d;
    if(p.span) d=pl.fit?pl.fit(p.span):split(pl.days(),Math.min(p.span,pl.days().length)).map(g=>g.flat());   // 기간에 맞춰 다시 나눈 읽기표
    else d=pl.days();
    _days={key:k,val:d}; }
  return _days.val;
}
// ───────── 기간에 맞춰 읽기: 남은 분량을 '읽는 요일'만 세어 하루 장 수를 계산 ─────────
const SPANS=[[3,"3개월"],[6,"6개월"],[12,"1년"],[18,"1년 6개월"]];
function addMonths(key,m){ const d=new Date(key+"T00:00"), day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m); d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); return dkey(d); }   // 11월 30일+3개월 → 2월 말일
function spanCalc(m,untilKey){
  const pl=planObj(), cur=planDays(), frac=Math.min(1,todayIdx()/cur.length);
  const until=untilKey||addMonths(today(),m), rd=Math.max(1,activeBetween(today(),until)), remCh=Math.max(1,Math.round(pl.ch*(1-frac)));
  return {until,rd,remCh,frac,per:Math.max(1,Math.round(remCh/rd*10)/10)};
}
function walkFwd(n){ const d=new Date(); let c=0; while(c<n){ d.setDate(d.getDate()+1); if(isReadDay(dkey(d))) c++; } return dkey(d); }
function walkBack(n){ const d=new Date(); let c=0; while(c<n){ d.setDate(d.getDate()-1); if(isReadDay(dkey(d))) c++; } return dkey(d); }
function setIndexTo(i,was=doneToday()){ const p=S.settings.plan; p.checks=[]; p.last=null;   // 오늘 이미 읽었으면 그 도장은 지키고 자리만 옮깁니다
  if(p.mode==="date"){ p.start=walkBack(i); p.setOn=today(); p.done=was?{[i]:true}:{}; }
  else if(was){ p.last={date:today(),index:i}; p.day=Math.min(planDays().length,i+1); } else p.day=i; }
function applySpan(m,untilKey){
  const p=S.settings.plan, pl=planObj(), c=spanCalc(m,untilKey);
  if(c.frac>=1){ toast("이 방법은 이미 다 읽었습니다"); return false; }
  { const total=Math.max(1,Math.round(c.rd/(1-c.frac))); p.span=total; _days.key="";
    setIndexTo(Math.min(planDays().length-1,Math.round(c.frac*planDays().length))); }
  const left=Math.max(1,planDays().length-todayIdx());                 // 실제로 다시 나뉜 표 기준으로 안내
  p.spanM=m; p.spanUntil=left<c.rd-1?walkFwd(left):c.until; p.spanPer=Math.max(1,Math.round(c.remCh/left));
  planChanged(left<c.rd-1?`이 방법은 더 길게 늘릴 수 없어, ${p.spanUntil}쯤 끝납니다 (하루 약 ${p.spanPer}장)`:`${c.until}까지, 읽는 날마다 약 ${p.spanPer}장씩 읽습니다`);
  return true;
}
function clearSpan(){ // 기본: 그 방법의 원래 날 수대로
  const p=S.settings.plan; if(!p.spanM) return;
  const frac=Math.min(1,todayIdx()/planDays().length);
  if(p.perDayBase!=null){ p.perDay=p.perDayBase; delete p.perDayBase; }
  delete p.span; delete p.spanM; delete p.spanUntil; delete p.spanPer; _days.key="";
  setIndexTo(Math.round(frac*planDays().length)); planChanged("원래 읽기표 날 수대로 읽습니다"); }
// 읽는 요일 (0=일 … 6=토). 정하지 않았으면 매일
const WEEK="일월화수목금토";
const readWeek=()=>{ const d=S.settings.days; return Array.isArray(d)&&d.length?d:[0,1,2,3,4,5,6]; };
const isReadDay=(key=today())=>readWeek().includes(new Date(key+"T00:00").getDay());
function activeBetween(a,b){ // a 날부터 b 날 전까지 가운데 '읽는 날'의 수
  const set=readWeek(), n=daysBetween(a,b); if(n<=0) return 0; if(set.length===7) return n;
  const sd=new Date(a+"T00:00").getDay(); let c=Math.floor(n/7)*set.length;
  for(let k=0;k<n%7;k++) if(set.includes((sd+k)%7)) c++; return c;
}
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
function todayIdx(){
  const p=S.settings.plan;
  if(p.mode==="date") return activeBetween(p.start,today());     // 시작한 날부터 '읽는 날'만 셉니다
  return p.last?.date===today()?p.last.index:p.day;
}
function doneToday(){ const p=S.settings.plan; return p.mode==="date"?!!p.done[todayIdx()]:p.last?.date===today(); }
function completeDay(){
  const p=S.settings.plan, i=todayIdx();
  const L=S.log[today()]=S.log[today()]||{}, bl=L.bible=L.bible||[];      // 독서 일기용: 오늘 읽은 분량
  if(!bl.some(x=>x.plan===planObj().name&&x.day===i+1)) bl.push({plan:planObj().name,day:i+1,portions:planDays()[i]||[]});
  if(p.mode==="date") p.done[i]=true; else { p.last={date:today(),index:p.day}; p.day=Math.min(planDays().length,p.day+1); }
  p.checks=[]; mark("read"); save(); toast("오늘 말씀을 다 읽었습니다"); render();
}
function togglePortion(k){
  if(doneToday()) return;
  const p=S.settings.plan, n=planDays()[todayIdx()]?.length||0;
  p.checks=p.checks.includes(k)?p.checks.filter(x=>x!==k):[...p.checks,k];
  if(p.checks.length>=n) completeDay(); else { save(); render(); }
}
function missedDays(){ const p=S.settings.plan, out=[]; if(p.mode!=="date") return out; for(let i=activeBetween(p.start,p.setOn||p.start);i<todayIdx();i++) if(!p.done[i]) out.push(i); return out; }
function catchUp(i){ const p=S.settings.plan; if(p.mode!=="date") return; p.done[i]=true; mark("read"); save(); toast(`${i+1}일째 분량을 읽음으로 표시했습니다`); render(); }
function readAhead(){ S.settings.plan.last=null; S.settings.plan.checks=[]; save(); render(); }
function planProgress(){ const p=S.settings.plan, len=planDays().length; const done=p.mode==="date"?activeBetween(p.start,p.setOn||p.start)+Object.keys(p.done).length:p.day; return {len,done,pct:Math.min(100,Math.round(done/len*1000)/10)}; }
function behind(){ // 이 방법을 고른 날 이후에 놓친 날만 셉니다
  const p=S.settings.plan; if(p.mode!=="date") return 0;
  let n=0; for(let i=activeBetween(p.start,p.setOn||p.start);i<todayIdx();i++) if(!p.done[i]) n++; return n;
}
function todayPassageHint(){ const first=(planDays()[todayIdx()]||[])[0]||""; const m=first.match(/^(\S+) (\d+)/); return m?`${m[1]} ${m[2]}:`:""; }
function streak(){ // 쉬는 요일은 건너뛰고 셉니다 (쉬어도 끊기지 않음)
  const act=k=>{const l=S.log[k]; return l&&(l.read||l.book||l.note||l.write);};
  let d=new Date(),n=0; if(!act(dkey(d))) d.setDate(d.getDate()-1);
  const from=S.settings.streakFrom||"";   // '다시 세기'를 누른 날부터만 셉니다 (기록은 그대로)
  for(let g=0;g<4000;g++){ const k=dkey(d); if(k<from) break; if(act(k)) n++; else if(isReadDay(k)) break; d.setDate(d.getDate()-1); }
  return n;
}

// 대한민국 표준시로 지금 몇 시 몇 분인가 (기기 시계가 다른 나라로 맞춰져 있어도)
function kstMinutes(){ try{ const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()); const g=t=>+(p.find(x=>x.type===t)?.value||0); return (g("hour")%24)*60+g("minute"); }catch(_){ const d=new Date(); return d.getHours()*60+d.getMinutes(); } }
const dayPart=()=>kstMinutes()<4*60+30?"새벽":"아침";   // 밤 12시 ~ 새벽 4시 30분은 「새벽」
// 머리의 날 수: 밤 12시가 지나면 오늘이 다음 날째가 됩니다 (어제까지 이어졌으면 아직 읽기 전이어도 +1)
function streakShown(){ const l=S.log[today()], done=!!(l&&(l.read||l.book||l.note||l.write)), n=streak(); return done?n:(n?n+1:0); }
function paintStreak(){ const el=$("#streak"); if(!el) return; const s=streakShown();
  el.innerHTML=(isReadDay()?"":`<span class="rest">쉬는 날</span>`)+(s?`<span class="n">${s}</span><span>일째 이어지는 ${dayPart()}</span>`:`<span>오늘의 첫 페이지</span>`); }
let SHOWN_DAY=today(), SHOWN_PART=dayPart();
setInterval(()=>{ const d=today(), p=dayPart(); if(d===SHOWN_DAY&&p===SHOWN_PART) return; const dayChanged=d!==SHOWN_DAY; SHOWN_DAY=d; SHOWN_PART=p; paintStreak(); if(tab==="today"||(dayChanged&&tab!=="write")) render(); },30000);   // 밤 12시·새벽 4시 30분을 넘으면 바로 바뀜

// 손으로 그린 듯 조금씩 다른 톱니 — 놋쇠 열쇠 같은 아날로그 느낌
function gearSvg(){
  const n=9, cx=24, cy=24, pts=[];
  for(let k=0;k<n;k++){ const a=k/n*Math.PI*2-Math.PI/2, w=Math.PI/n*.52, j=1+.03*Math.sin(k*2.3);
    [[a-w*1.35,15.2],[a-w*.8,20.6*j],[a+w*.8,20.6*j],[a+w*1.35,15.2]].forEach(([t,r])=>pts.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r])); }
  const d="M"+pts.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" L")+"Z";
  return `<svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="${d}" fill="var(--paper-2)" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="currentColor" stroke-width=".6" opacity=".45" transform="rotate(3 24 24) translate(.6 .4)"/>
    <circle cx="24" cy="24" r="9.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 1.6" opacity=".8"/>
    <circle cx="24" cy="24" r="4.4" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/>
    <path d="M21.6 22.6c1.2-1 3.4-1 4.6.3" fill="none" stroke="currentColor" stroke-width=".9" opacity=".6" stroke-linecap="round"/>
  </svg>`;
}

// ───────── 작은 달력: 묵상한 날(형광 동그라미)·설교로 올린 날(붉은 도장)·책 글(초록 점) ─────────
let calY=null, calM=null, calPick=null;
function calHtml(){
  const now=new Date(); if(calY==null){ calY=now.getFullYear(); calM=now.getMonth(); }
  const marks={}; live().forEach(w=>{ const m=marks[w.date]=marks[w.date]||{}; if(w.type==="묵상을설교로"||w.type==="설교초안") m.promo=true; else if(w.track==="bible") m.bible=true; else m.book=true; });
  const first=new Date(calY,calM,1), start=new Date(first); start.setDate(1-first.getDay()); const t=today(); let cells="";
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); if(i>=35&&d.getMonth()!==calM) break;
    const k=dkey(d), m=marks[k]||{}, cls=["d",d.getMonth()!==calM?"o":"",d.getDay()===0?"sun":"",k===t?"today":"",m.promo?"promo":m.bible?"bible":"",m.book?"book":""].filter(Boolean).join(" ");
    cells+=`<button type="button" class="${cls}" onclick="calGo('${k}')" title="${k}${m.bible||m.promo||m.book?" · 쓴 글 "+live().filter(w=>w.date===k).length+"편":""}"><span>${d.getDate()}</span></button>`; }
  const pick=calPick?live().filter(w=>w.date===calPick):[];
  return `<div class="calcard"><p class="label ${track==="bible"?"bible":"book"}" style="margin:0 0 4px;font-size:20px">${track==="bible"?"묵상 캘린더":"글쓰기 캘린더"}</p><div class="calhead"><button onclick="calMove(-12)" title="지난해">«</button><button onclick="calMove(-1)" title="지난달">‹</button><span class="t">${calY}년 ${calM+1}월</span><button onclick="calMove(1)" title="다음 달">›</button><button onclick="calMove(12)" title="다음 해">»</button>${(calY!==now.getFullYear()||calM!==now.getMonth())?`<button onclick="calY=calM=null;calPick=null;paintCal()" title="이번 달로" style="font-size:12px;width:auto;padding:0 6px">오늘</button>`:""}</div>
    <div class="cal">${"일월화수목금토".split("").map(x=>`<div class="wd">${x}</div>`).join("")}${cells}</div>
    <div class="callegend"><span><i style="background:rgba(247,214,92,.8)"></i>묵상</span><span><i style="border:1.5px solid var(--stamp);border-radius:3px;width:10px;height:10px"></i>설교초안</span><span><i style="background:var(--book);width:7px;height:7px"></i>책 글</span></div>
    ${pick.length>1?`<div class="calpick"><div class="muted">${calPick}에 쓴 글 ${pick.length}편</div>${pick.map(w=>`<a href="#" onclick="go('write',{edit:'${w.id}'});return false" style="${w.id===editId?"font-weight:700":""}">[${esc(wTag(w))}] ${esc(w.title||w.passage||"(제목 없음)")}${w.id===editId?" ← 지금":""}</a>`).join("")}</div>`:""}</div>`;
}
function paintCal(){ const el=$(".calcard"); if(!el) return; el.outerHTML=calHtml(); }
function calMove(n){ let m=calM+n, y=calY; while(m<0){ m+=12; y--; } while(m>11){ m-=12; y++; } calY=y; calM=m; calPick=null; paintCal(); }
function calGo(k){ // 그날 쓴 글로: 묵상(없으면 첫 글)을 바로 열고, 여럿이면 달력 아래에 나머지 목록. 없으면 그날 일기
  const ws=live().filter(w=>w.date===k);
  if(ws.length){ const w=ws.find(x=>x.type==="묵상")||ws[0]; const d=new Date(k+"T00:00"); calY=d.getFullYear(); calM=d.getMonth(); calPick=ws.length>1?k:null; go("write",{edit:w.id}); if(ws.length>1) toast(`${k}에 쓴 글 ${ws.length}편 — 달력 아래에서 고를 수 있습니다`); return; }
  diaryDate=k; go("diary"); toast(`${k}에 쓴 글이 없어 그날 일기를 엽니다`);

let CMTR=null, CMT_GEN=0; const CMT_CACHE=new Map();   // 같은 본문·같은 파일은 다시 읽지 않습니다 (이번 화면 동안)

function addSticker(k){

    const b=$("#wbody"), v=k.slice(2); tInsert(b,v,b.selectionStart??b.value.length,b.selectionEnd??b.value.length); return; }

        <p class="step"><span class="num">1</span>무엇에 대한 글인가요?</p>
        ${track==="bible"
          ?`<label class="field" style="margin-top:0"><span>본문</span><input id="wpassage" value="${esc(defPassage)}" placeholder="요한복음 15:1-8"><small class="hint">성경책 이름부터 적어 주세요 (예: 시편 17:1-3).${CONF.notion?" 노션의 그 책 노트로 들어갑니다.":""}</small></label>
          <div class="row" id="cmtanchor" style="margin-top:6px"><button class="btn small" onclick="cmtShow()" title="드라이브 「성경공부」 폴더의 주석에서 이 본문 부분을 찾아 보여 줍니다">${ICO.books}주석 보기</button></div>${placeBox(dtype)}`
          :`<div class="row"><label class="field" style="flex:1;margin-top:0"><span>읽은 책</span><select id="wbook"><option value="">(책 없이)</option>${books.map(b=>`<option value="${b.id}" ${defBook===b.id?"selected":""}>${esc(b.title)}</option>`).join("")}</select></label><label class="field" style="width:76px;margin-top:0"><span>쪽</span><input id="wpage" value="${esc(defPage)}"></label></div>`}
        <details class="more" ${hasMore?"open":""}>
          <summary>더 적기 <small class="hint" style="display:inline">· 안 적어도 됩니다</small></summary>
          <label class="field"><span>핵심 한 줄</span><input id="wsummary" value="${esc(w?.summary)}" placeholder="이 글을 한 문장으로" oninput="draftInput();autoKeepKick()"></label>
          <details class="more field" ${selTopics.length?"":""}><summary>주제 <small class="hint" style="display:inline">${selTopics.length?"· "+esc(selTopics.join(", ")):"· 3개까지 고를 수 있습니다"}</small></summary>
            <div id="topics">${allTopics().map(t=>`<span class="chip ${selTopics.includes(t)?"on":""}" onclick="toggleTopic(this.textContent)">${esc(t)}</span>`).join("")}</div>
            <input id="newtopic" placeholder="＋ 새 주제 (적고 Enter)" style="margin-top:6px" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();addTopic(this.value)}"></details>
          ${track==="bible"?`<details class="more field"><summary>상황 <small class="hint" style="display:inline">${selSits.length?"· "+esc(selSits.join(", ")):"· 특별한 자리에 쓸 설교라면 (노션 「상황별」 보기에 모임)"}</small></summary>
            <div id="sits">${SITUATIONS.map(t=>`<span class="chip ${selSits.includes(t)?"on":""}" onclick="toggleSit(this.textContent)">${esc(t)}</span>`).join("")}</div></details>`:""}
          ${track==="bible"?`<div class="field" id="lenbox" style="${dtype==="묵상을설교로"?"":"display:none"}"><span>설교 길이 <small class="hint" style="display:inline">· 노션 태그와 완성 뒤 색인 종류(긴설교→주일설교, 짧은설교→새벽설교)에 쓰입니다</small></span>
            <div class="pills">${SLEN.map(([n,d])=>`<button type="button" class="pill ${selLen===n?"on":""}" data-tip="${d}" onclick="selLen=selLen==='${n}'?null:'${n}';this.parentNode.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b.textContent===selLen))">${n}</button>`).join("")}</div></div>`:""}
          <label class="field"><span>글의 상태</span><select id="wstatus" style="width:auto">${WSTATUS.map(x=>`<option ${(w?.status||"초고")===x?"selected":""}>${x}</option>`).join("")}</select><small class="hint">씨앗 → 초고 → 다듬는 중 → 완성. 서랍에서 상태가 보입니다.</small></label>
          <label class="field"><span>원고에 넣기</span><select id="wms"><option value="">고르지 않음</option>${liveMs().filter(m=>!m.rule&&!(w&&m.items.includes(w.id))).map(m=>`<option value="${m.id}" ${SEL_MS===m.id?"selected":""}>${esc(m.title)}</option>`).join("")}</select>            <small class="hint">${(()=>{ const inMs=w?msOf(w):[]; return inMs.length?`지금 들어 있는 원고: ${inMs.map(m=>`${ICO.closed}${esc(m.title)}`).join(", ")}`:"직접 고른 원고에 넣을 수 있습니다. 조건으로 모으는 원고에는 주제·본문·종류에 맞으면 저절로 들어갑니다."; })()}</small></label>
        </details>
        <hr class="dash">
        <p class="step"><span class="num">2</span>간직하기</p>
        <div class="sealrow">
          <button class="seal" id="sealbtn" onclick="pressSeal()" aria-label="간직하기">${waxSeal()}</button>
          <div class="sealtext"><b class="pen" style="font-size:24px">${dtype==="설교초안"?"설교초안 봉인":"봉인을 누르면"}</b><br>${PLACE()}에 저장${track==="bible"&&(dtype||"묵상")==="묵상"&&canSync()?"되고, 노션에도 실립니다.":canNotion()?"됩니다. 노션은 「노션에 보내기」로.":"됩니다."}<br><span class="muted">⌘S 를 눌러도 됩니다</span>
            <div id="syncstamp" style="margin-top:10px">${syncStamp(w)}${w?.syncError?`<div class="muted" style="margin-top:8px">${esc(w.syncError)}</div>`:""}</div></div>
        </div>
        <div class="row" style="margin-top:14px"><button class="btn small" onclick="copyW()" title="제목과 본문을 복사해 카톡·블로그 등에 붙여 넣을 수 있습니다">글 복사</button>
        ${w?.type==="묵상을설교로"?`<button class="btn small" onclick="pullNotion('${w.id}')" title="설교작성 프로젝트가 노션 이 페이지에 쓴 글을 앱으로 가져옵니다">${ICO.down}노션에서 가져오기</button>`:""}${w&&CONF.notion?`<button class="btn small" onclick="syncWriting(S.writings.find(x=>x.id==='${w.id}'),false,true)">${w.notion?.page?"노션에 다시 보내기":"노션에 보내기"}</button>`:""}${w?`<button class="btn small danger" onclick="delWriting('${w.id}')">휴지통에 넣기</button>`:""}</div>
        ${w?(()=>{ const srcs=srcOf(w), ups=draftsOf(w), ln=x=>`<a href="#" onclick="go('write',{edit:'${x.id}'});return false">[${esc(wTag(x))}] ${esc(x.title||x.passage||"(제목 없음)")} · ${esc(x.date)}</a>`;
          return (srcs.length?`<p class="muted" style="margin-top:10px">← 바탕이 된 묵상: ${srcs.map(ln).join(", ")}</p>`:"")
            +(ups.length?`<p class="muted" style="margin-top:6px">→ 이 묵상으로 쓴 설교초안: ${ups.map(ln).join(", ")}</p>`:""); })():""}
        ${w?.prev?.length?`<details class="more" style="margin-top:10px"><summary>이전 판 ${w.prev.length}개</summary><ol class="prevs">${w.prev.map((v,k)=>`<li><span class="muted">${esc((v.at||"").slice(0,16).replace("T"," "))} · ${chars(v.body).toLocaleString()}자</span> <button class="btn small ghost" onclick="restorePrev('${w.id}',${k})">본문 되돌리기</button></li>`).join("")}</ol><small class="hint">간직할 때마다 바로 앞의 본문을 3개까지 남겨 둡니다.</small></details>`:""}
        ${w?snapHtml(w):""}
        ${canSync()?"":`<p class="muted" style="margin-top:10px">노션이 아직 연결되지 않아 ${PLACE()}에만 간직됩니다. <a href="#" onclick="go('settings');return false">연결하기</a></p>`}
      </div>
      ${sideTabs(w)}
    </aside>
  </div>`;
},
shelf(){
  // 책장: 읽는 책은 표지를 크게(지금 읽는 책은 더 크게), 다 읽은 책은 책등으로 꽂아 둡니다 — 수백 권이 되어도 한 화면에 보이게.
  // 보기 방식: 최신 · 오래된 순 · 분류별 · 별점순 (이 기기에 기억). 찾기 칸으로 제목·저자를 거릅니다.
  let sortBy="new"; try{ sortBy=localStorage.getItem("seojae.shelfsort")||"new"; }catch(_){}
  const key=b=>b.finished||b.started||"";
  const sorters={new:(a,b)=>key(b).localeCompare(key(a)),old:(a,b)=>key(a).localeCompare(key(b)),star:(a,b)=>(b.rating||0)-(a.rating||0)||key(b).localeCompare(key(a)),cat:(a,b)=>(bookCat(a)||"힣").localeCompare(bookCat(b)||"힣","ko")||key(b).localeCompare(key(a))};
  const q=(SHELF_Q||"").trim().toLowerCase();
  const sorted=S.books.slice().sort(sorters[sortBy]||sorters.new).filter(b=>!q||(b.title+" "+(b.authors||[]).join(" ")+" "+(b.publisher||"")).toLowerCase().includes(q));
  const reading=sorted.filter(b=>b.status!=="완료"), done=sorted.filter(b=>b.status==="완료");
  const card=b=>`<div class="bookc ${b.id===S.settings.currentBook?"now":""}" onclick="openBook('${b.id}')">${b.id===S.settings.currentBook?`<span class="nowtag">지금 읽는 중</span>`:""}${coverHtml(b)}<div class="t">${esc(b.title)}</div>${b.total?`<div class="progress" style="margin:6px 8px 0"><i style="width:${Math.min(100,(b.page||0)/b.total*100)}%"></i></div>`:""}${b.status!=="완료"&&b.id!==S.settings.currentBook?`<button class="pickbtn" onclick="event.stopPropagation();pickBook('${b.id}')" title="이 책을 지금 읽는 책으로">이 책 펴기</button>`:""}</div>`;
  const shelfRow=list=>`<div class="shelf">${list.map(card).join("")||`<p class="muted" style="align-self:center">비어 있는 칸</p>`}</div><div class="plank"></div>`;
  const spines=list=>list.length?`<div class="spines">${list.map(spineHtml).join("")}</div>`:`<p class="muted" style="margin:6px 0 20px">아직 없습니다.</p>`;
  const group=(list,of,order)=>{ const g={}; list.forEach(b=>{ const c=of(b); (g[c]=g[c]||[]).push(b); }); return Object.keys(g).sort(order).map(c=>({c,items:g[c]})); };
  const catOrder=(a,b)=>(CATS.indexOf(a)+1||99)-(CATS.indexOf(b)+1||99);
  // 읽는 중: 분류별이면 갈래마다 칸, 아니면 한 칸(표지가 많으면 줄을 바꿔 이어짐)
  const readingHtml=sortBy==="cat"?(group(reading,b=>bookCat(b)||"미정",catOrder).map(({c,items})=>`<p class="catlabel">${esc(c)} <span class="muted" style="font-size:13px">${items.length}권</span></p>${shelfRow(items)}`).join("")||shelfRow([])):shelfRow(reading);
  // 다 읽은 책: 책등으로. 최신·오래된 순은 다 읽은 해마다 한 칸, 분류별은 갈래마다, 별점순은 한 칸
  const doneGroups=sortBy==="cat"?group(done,b=>bookCat(b)||"미정",catOrder):sortBy==="star"?[{c:"",items:done}]:group(done,b=>(b.finished||b.started||"").slice(0,4)||"연도 없음",(a,b)=>sortBy==="old"?a.localeCompare(b):b.localeCompare(a));
  const doneHtml=done.length?doneGroups.map(({c,items})=>`${c?`<p class="catlabel">${esc(c)}${/^\d{4}$/.test(c)?"년":""} <span class="muted" style="font-size:13px">${items.length}권</span></p>`:""}${spines(items)}`).join(""):`<p class="muted" style="margin:6px 0 20px">${q?"찾은 책이 없습니다.":"다 읽은 책이 여기에 책등으로 꽂힙니다."}</p>`;
  const bar=`<div class="shelfbar"><span class="muted" style="font-size:13px">보기</span><span class="pills">${[["new","최신"],["old","오래된 순"],["cat","분류별"],["star","별점순"]].map(([k,n])=>`<button class="pill ${sortBy===k?"on":""}" onclick="try{localStorage.setItem('seojae.shelfsort','${k}')}catch(_){};render()">${n}</button>`).join("")}</span>
    <input id="bqf" placeholder="책장에서 찾기 (제목·저자)" value="${esc(SHELF_Q||"")}" oninput="SHELF_Q=this.value;clearTimeout(window._sq);window._sq=setTimeout(shelfPaint,200)" style="width:auto;flex:1;min-width:160px;max-width:300px;margin-left:auto"></div>`;
  return `<div class="row" style="margin-bottom:18px"><h2>책장</h2><span class="muted" style="font-size:14px">읽는 중 ${S.books.filter(b=>b.status!=="완료").length}권 · 다 읽은 책 ${S.books.filter(b=>b.status==="완료").length}권</span></div>
  <section class="sheet tape" style="margin-bottom:30px">
    <p class="label book">새 책 꽂기</p>
    <div class="row"><input id="bq" placeholder="책 이름, 저자, 또는 ISBN" style="flex:1" onkeydown="if(event.key==='Enter'&&!event.isComposing)searchBook()"><button class="btn ink" onclick="searchBook()">표지 찾기</button><button class="btn" onclick="if(!$('#bq').value.trim()) return toast('책 이름을 먼저 적어 주세요'); addBook(-1)" title="검색 없이 적은 제목 그대로 꽂습니다">제목만으로 꽂기</button><button class="btn" onclick="openStore(millieUrl,$('#bq').value)" title="같은 이름으로 밀리의 서재를 검색합니다 (밀리에 로그인되어 있어야 결과가 보입니다)">밀리의 서재</button><button class="btn" onclick="openStore(welaaaUrl,$('#bq').value)" title="같은 이름으로 윌라(전자책·오디오북)를 검색합니다">윌라</button></div>
    ${CONF.kakao?"":`<p class="muted" style="margin-top:8px">한국 책 표지를 정확히 찾으려면 설정에서 카카오 검색 키를 넣어 주세요. 지금은 해외 도서 검색만 씁니다.</p>`}
    <div id="bresults"></div>
  </section>
  <div id="bookdetail"></div>
  ${bar}
  <div id="shelves">
  <p class="label book">읽는 중 ${reading.length>1?`<small class="hint" style="display:inline">· 여러 권을 같이 읽을 때는 「이 책 펴기」로 기준 책을 바꿉니다</small>`:""}</p>${readingHtml}
  <p class="label">다 읽은 책 <small class="hint" style="display:inline">· 책등을 누르면 열립니다. 두께는 쪽수, 색은 책마다</small></p>${doneHtml}
  </div>`;
},
room(){ return roomPage(); },
drawer(){
  const segBtn=(k,n)=>`<span class="chip ${drawerSub===k?"on":""}" onclick="drawerSub='${k}';msDraft=null;render()">${n}</span>`;
  const head=`<div class="row" style="margin-bottom:10px"><h2>서랍</h2><span class="spacer"></span>${segBtn("all","모든 기록")}${segBtn("ms","원고 — 책으로 엮기")}${segBtn("trash",`휴지통${(()=>{ const n=trashed().length+S.manuscripts.filter(m=>m.trashed).length; return n?" "+n:""; })()}`)}</div><div style="height:22px"></div>`;
  if(drawerSub==="trash") return head+trashView();
  if(drawerSub==="ms") return head+`
  <section class="sheet" style="margin-bottom:30px">
    <p class="label">새 원고</p>
    ${msDraft?msDraftHtml():`<div class="plancards two">
      <button class="plancard bigchoice" onclick="newMsDraft('rule')"><div class="pc-head"><b>${ICO.search}조건으로 모으기</b></div><div class="pc-how">주제·성경책·글 종류를 정해 두면, 맞는 글이 저절로 모입니다. 앞으로 쓰는 글도 계속 들어옵니다.<br><span class="muted">예) 요한복음 묵상집 · 믿음에 관하여 · 2026 주일설교 모음</span></div></button>
      <button class="plancard bigchoice" onclick="newMsDraft('manual')"><div class="pc-head"><b>${ICO.pen}직접 고르기</b></div><div class="pc-how">마음에 드는 글을 하나씩 골라 넣고, 순서를 직접 정합니다.</div></button>
    </div>`}
  </section>
  <div class="grid">${liveMs().map(msCardHtml).join("")||`<p class="muted">아직 원고가 없습니다. 위에서 만들어 보세요.</p>`}</div>`;
  return head+`
  <section class="sheet" style="margin-bottom:26px">
    <div class="row"><input id="q" placeholder="낱말로 찾기 (제목, 본문, 성경 본문…)" style="flex:1" oninput="clearTimeout(window._aq);window._aq=setTimeout(renderArchive,150)"></div>
    ${filterBar()}
    ${live().some(w=>w.syncError)?`<div class="row" style="margin-top:12px"><span class="muted">노션에 아직 못 간 글이 있습니다.</span><button class="btn small" onclick="resyncAll()">모두 다시 보내기</button></div>`:""}
  </section>
  <section class="sheet" id="results"></section>`;
},
settings(){
  return `<div class="row" style="margin-bottom:6px"><h2>설정</h2></div>
  <div class="setgroup first">읽기</div>
  ${planSettings()}
  <div class="setgroup">아침 알림 · 화면 · 앱</div>
  <div class="grid setgrid">
  ${reminderSection()}
  ${appSection()}
  ${musicSection()}
  ${vrSection()}
  ${quietSection()}
  ${lookSection()}
  </div>
  <div class="setgroup">연결</div>
  <div class="grid setgrid">
  ${CONF.phoneUrl?`<section class="sheet tape c ${GAS?"compact":""}">
    <p class="label">${GAS?"다른 기기 연결":"휴대폰에서 쓰기"}</p>
    ${GAS?`<div class="okline"><span class="stamp ok">이 기기 연결됨</span><span class="muted">구글 드라이브와 같은 기록을 씁니다</span></div><details class="keybox"><summary>다른 기기 연결하기 (QR 보기) · 연결 끊기</summary>`:""}
    <p class="sub">${GAS?"휴대폰(또는 다른 컴퓨터) 카메라로 아래 QR을 찍으면 그 기기가 연결됩니다. 열린 화면에서 <b>공유 → 홈 화면에 추가</b>를 누르면 아침 서재 아이콘으로 앱처럼 쓸 수 있습니다. <b>컴퓨터가 꺼져 있어도 열립니다.</b>"
      :"휴대폰이 이 컴퓨터와 <b>같은 와이파이</b>에 있으면, 카메라로 아래 QR을 찍어 열어 주세요. 열린 화면에서 <b>공유 → 홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있습니다."}</p>
    <div id="qr"></div>
    ${GAS?"":`<p class="muted" style="word-break:break-all;margin-top:8px">${esc(CONF.phoneUrl)}</p>`}
    <p class="muted">${GAS?"이 QR에는 비밀 열쇠가 들어 있습니다. 다른 사람에게 보여 주거나 사진으로 보내지 마세요.":"이 주소에는 비밀 열쇠가 들어 있어 다른 사람에게는 보내지 마세요. 컴퓨터가 켜져 있고 아침 서재가 열려 있어야 휴대폰에서도 열립니다."}</p>
    ${GAS?`<div class="row"><button class="btn small" onclick="navigator.clipboard?.writeText(connectLink()).then(()=>toast('연결 링크를 복사했습니다'))">연결 링크 복사</button><button class="btn small danger" onclick="disconnect()">이 기기 연결 끊기</button></div></details>`:""}
  </section>`:""}
  ${CONF.local===false?"":`<section class="sheet tape ${CONF.notion?"compact":""}">

function addTopic(v){ // 목록에 없는 주제를 더해 두면 다음부터 모든 글에서 고를 수 있습니다
  const t=v.trim().replace(/^#/,""); if(!t) return;

}

// 묵상 글을 ■ 소제목마다 나눕니다 (※ 주석 요약은 빼고)
function medSections(m){ const out=[]; let cur={h:"",t:[]};
  for(const l of stripMemo(m?.body||"").split("\n")){ if(/^\s*■/.test(l)){ out.push(cur); cur={h:l.replace(/^\s*■\s*/,"").trim(),t:[]}; } else cur.t.push(l); }
  out.push(cur); return out.map(x=>({h:x.h,t:x.t.join("\n").trim()})).filter(x=>x.t); }
// 씨앗만 이어받은 초안 틀: 중심 메시지 ← 설교 씨앗 · 붙잡은 것 ← 본문·관찰·하나님·해석 · 적용 후보 ← 적용 · 더 살펴볼 것 ← 주석 요약 제목
function sermonSeed(ms){
  const many=ms.length>1, tag=m=>many?`(${m.date.slice(5).replace("-",".")}) `:"";
  const pick=re=>ms.flatMap(m=>medSections(m).filter(x=>re.test(x.h)).map(x=>({m,t:stripMk(x.t)})));
  const list=arr=>arr.map(x=>x.t.split("\n").map(l=>l.trim()).filter(Boolean).map((l,i)=>"· "+(i?"":tag(x.m))+l).join("\n")).filter(Boolean).join("\n");
  const seedL=pick(/설교 씨앗/).map(x=>x.t.replace(/\s+/g," ").trim()).filter(Boolean);
  const notes=ms.flatMap(m=>String(m.body||"").split("\n").map(l=>l.trim()).filter(l=>MEMO_START.test(l)).map(l=>"· "+tag(m)+l.replace(/^※\s*/,"").replace(/\s*\(.*$/,"")+" — 바탕 묵상에 정리해 둔 요약"));
  return `■ 중심 메시지 (한 문장)\n${seedL.join(" / ")}\n\n■ 본문의 흐름 — 앞뒤 문맥과 구조\n\n\n■ 본문에서 붙잡은 것\n${list(pick(/^(본문|관찰|하나님은|해석)/))}\n\n■ 듣는 이 — 누구에게, 어떤 마음으로\n\n\n■ 뼈대 메모 — 대지 후보\n\n\n■ 예화·자료 후보\n\n\n■ 적용 후보 — 이번 주의 한 걸음\n${list(pick(/^적용/))}\n\n■ 결단·초청 (한 문장)\n\n\n■ 더 살펴볼 것 (원어·배경·주석)\n${notes.join("\n")}\n`;
}

function waxBlob(cx,cy,r){
  const n=30, pts=[];
  for(let k=0;k<n;k++){ const a=k/n*Math.PI*2;
    const bump=1+.045*Math.sin(a*3+1.3)+.03*Math.sin(a*7+.4)+.02*Math.sin(a*13)+(Math.abs(a-2.2)<.25?.07:0)+(Math.abs(a-5.1)<.2?.05:0);
    pts.push([cx+Math.cos(a)*r*bump,cy+Math.sin(a)*r*bump]); }
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let k=0;k<n;k++){ const p0=pts[(k-1+n)%n],p1=pts[k],p2=pts[(k+1)%n],p3=pts[(k+2)%n];
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`; }
  return d+"Z";
}

function plainWithNotes(t,md,pre=""){ // md: 마크다운 각주 문법([^1] / [^1]: 내용)으로. pre: 꼭지 번호 접두(원고 전체에서 각주 이름이 겹치지 않게)
  const fn=[], ref=n=>md?`[^${pre}${n}]`:`[${n}]`, body=String(t||"").replace(MK_RE,(m,c,h,u,f)=>f!=null?ref(fn.push(f)):String(h??u).replace(FN_RE,(m2,f2)=>ref(fn.push(f2))));
  return body+(fn.length?(md?"\n\n"+fn.map((x,i)=>`[^${pre}${i+1}]: ${x}`).join("\n"):"\n\n각주\n"+fn.map((x,i)=>`[${i+1}] ${x}`).join("\n")):""); }

// 도서관 분류(KDC 십진분류 큰 갈래): 국립중앙도서관 KDC 번호가 있으면 그것으로, 없으면 제목·출판사 낱말로 짐작합니다. 책 카드에서 직접 바꿀 수 있습니다
const CATS=["성경·주석","신학","목회·설교","신앙·영성·묵상","종교(기타)","철학","심리·상담","자기계발","경영·리더십","경제·투자","교육·자녀","사회·정치","인문·교양","역사","자연과학","컴퓨터·AI","기술·공학","건강·의학","생활·취미","예술","언어·글쓰기","소설","시·에세이","총류"];
const OLD_CAT={"종교(기독교)":"신앙·영성·묵상","철학·심리":"철학","사회과학":"사회·정치","기술과학":"기술·공학","문학":"소설","언어":"언어·글쓰기"};   // 예전 큰 갈래 이름 → 새 이름
// KDC(한국십진분류) 번호 → 갈래. 앞 세 자리로 봅니다 (233 성경, 231 교의신학, 232 신앙·명상, 234·235 목회·설교·전도 …)
function kdcCat(k){ k=String(k||"").trim(); if(!/^\d/.test(k)) return ""; const d=k.slice(0,3).padEnd(3,"0"), n=+d, h=+d[0];
  if(h===2){ if(d.startsWith("23")){ if(n===233) return "성경·주석"; if(n===231||n===236||n===237||n===238) return "신학"; if(n===232) return "신앙·영성·묵상"; if(n===234||n===235) return "목회·설교"; return "신앙·영성·묵상"; } return "종교(기타)"; }
  if(h===0) return (n===4||n===5||n===3)?"컴퓨터·AI":"총류";
  if(h===1) return (d.startsWith("15")||d.startsWith("18"))?"심리·상담":d.startsWith("19")?"자기계발":"철학";
  if(h===3){ if(d.startsWith("32")) return n===325?"경영·리더십":"경제·투자"; if(d.startsWith("37")) return "교육·자녀"; return "사회·정치"; }
  if(h===4) return "자연과학";
  if(h===5){ if(d.startsWith("51")) return "건강·의학"; if(d.startsWith("59")) return "생활·취미"; if(n===5||d.startsWith("56")) return "컴퓨터·AI"; return "기술·공학"; }
  if(h===6) return "예술"; if(h===7) return "언어·글쓰기";
  if(h===8){ const t=d[2]; if(t==="3") return "소설"; if("1245".includes(t)) return "시·에세이"; return "인문·교양"; }
  return "역사"; }

const strHash=t=>{ let h=7; for(const c of String(t||"")) h=(h*31+c.charCodeAt(0))>>>0; return h; };
function spineHtml(b){ const h=strHash(b.title), [bg,fg]=SPINE_COLORS[h%SPINE_COLORS.length], w=b.unit==="pct"?30:b.total>450?42:b.total>280?35:b.total>150?30:26, ht=116+(h>>4)%6*7;
  return `<div class="sp"><div class="spine" style="width:${w}px;height:${ht}px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 22%,rgba(255,255,255,.08) 50%,rgba(0,0,0,.22)),${bg};color:${fg}" onclick="openBook('${b.id}')" title="${esc(b.title)}${(b.authors||[]).length?" · "+esc(b.authors.join(", ")):""}${b.finished?" · "+esc(b.finished)+" 완독":""}${b.rating?" · "+"★".repeat(b.rating):""}"><span class="st">${esc(b.title)}</span>${b.rating?`<span class="sr">${"•".repeat(b.rating)}</span>`:""}</div></div>`; }
function shelfPaint(){ if(tab!=="shelf") return; const el=$("#shelves"); if(!el) return; const html=VIEWS.shelf(); const tmp=document.createElement("div"); tmp.innerHTML=html; el.innerHTML=tmp.querySelector("#shelves").innerHTML; }   // 찾기 칸은 그대로 두고 책장만 다시
const pgUnit=b=>b?.unit==="pct"?"%":"쪽";
const pgText=(b,n)=>b?.unit==="pct"?`${n||0}%`:`${n||0}쪽`;
function setUnit(id,u){ const b=S.books.find(x=>x.id===id); if(!b) return; b.unit=u; if(u==="pct"){ b.total=100; if(b.page>100) b.page=100; } save(); openBook(id); toast(u==="pct"?"전자책: 읽은 곳을 %로 적습니다":"종이책: 읽은 곳을 쪽수로 적습니다"); }
function setCat(id,c){ const b=S.books.find(x=>x.id===id); if(!b) return; b.catMan=c||null; save(); openBook(id); if(b.reviewNotion?.page) syncReview(b); }
// 독후감: 다 읽은 책의 카드에서 적고, 노션 자기계발 → 「독서 노트」에 쌓입니다 (표지 그림·저자·별점·읽은 기간과 함께)
let REVIEW_OPEN=null;
function reviewBox(b){
  return `${bookNotesHtml(b.id,true)}<div class="reviewbox" style="margin-top:12px"><p class="label book" style="font-size:19px">독후감 ${b.reviewNotion?.page?`<a class="nstate ok" href="${esc(safeUrl(b.reviewNotion.url)||"#")}" target="_blank" style="text-decoration:none;margin-left:8px"><i></i>노션 독서 노트에 보관됨</a>`:""}</p>
    <input id="rv-one" class="pen" style="font-size:20px" placeholder="이 책을 한 줄로" value="${esc(b.oneLine||"")}">
    <textarea id="rv-text" placeholder="읽고 난 뒤 남는 것 — 기억하고 싶은 문장, 내 삶과 설교에 가져올 것, 아쉬운 점…" style="margin-top:8px">${esc(b.review||"")}</textarea>

function saveReview(id){ const b=S.books.find(x=>x.id===id); if(!b) return; b.oneLine=($("#rv-one")?.value||"").trim(); b.review=($("#rv-text")?.value||"").trim(); b.reviewAt=new Date().toISOString(); save(); toast("독후감을 간직했습니다"); syncReview(b).then(()=>openBook(id)); }
async function syncReview(b){
  if(!canSync()||!b.review) return;
  try{ const r=await gcall("notionReview",{book:{...b,cat:bookCat(b)}}); if(r.ok){ b.reviewNotion={page:r.page,url:r.url,marker:r.marker,blocks:r.blocks}; b.reviewErr=null; toast("노션 독서 노트에 실었습니다"); } else { b.reviewErr=r.error; toast("노션에 올리지 못했습니다: "+r.error); } }

}
// 국립중앙도서관에서 목차·책 소개·쪽수·분류·출간일 가져오기 (없는 항목은 카카오에서 받은 값을 그대로 둡니다)
async function enrichBook(b,quiet){
  if(!SERVER||!CONF.nl||!b.isbn) { if(!quiet) toast(!CONF.nl?"설정에서 국립중앙도서관 인증키를 먼저 넣어 주세요":"ISBN이 없는 책이라 가져올 수 없습니다"); return; }
  try{
    const isbn=String(b.isbn).split(/\s+/).pop();
    const r=await apiGet("/api/books/detail",{isbn});
    if(!r.ok){ if(!quiet) toast(r.error); return; }
    Object.assign(b,{description:r.description||b.description,toc:r.toc?.length?r.toc:b.toc,category:r.category||b.category,kdc:r.kdc||b.kdc,pubDate:r.pubDate||b.pubDate,isbn:r.isbn||b.isbn});
    if(kdcCat(b.kdc)) b.cat=kdcCat(b.kdc);   // 도서관 분류 번호로 갈래를 바로잡음
    if(!b.total&&r.pages) b.total=r.pages; if(!b.publisher&&r.publisher) b.publisher=r.publisher; if(!b.cover&&r.cover) b.cover=r.cover;
    save(); if(!quiet) toast(r.toc?.length?"국립중앙도서관에서 목차와 책 정보를 가져왔습니다":"국립중앙도서관에 이 책의 목차가 없어 쪽수·분류만 채웠습니다");
    if($("#bookdetail")?.innerHTML) openBook(b.id);
  }catch(e){ if(!quiet) toast("국립중앙도서관에 닿지 못했습니다"); }
}
// 읽기 속도: 최근 21일 쪽수 기록으로 하루 평균과 예상 완독일
function bookPace(b){ if(!b||b.status==="완료") return ""; const total=b.unit==="pct"?100:b.total; if(!total) return "";
  let sum=0, days=0; const d=new Date(); for(let i=0;i<21;i++){ const k=dkey(d), e=S.log?.[k]?.books?.[b.id]; if(e){ const n=Math.max(0,(+e.to||0)-(+e.from||0)); if(n){ sum+=n; days++; } } d.setDate(d.getDate()-1); }
  if(days<2||!sum) return ""; const per=sum/days, left=Math.max(0,total-(b.page||0)); if(!left) return "";
  const per7=sum/21*7, wk=Math.ceil(left/(per7/7)); const end=new Date(); end.setDate(end.getDate()+wk);
  return `읽은 날 평균 ${Math.round(per)}${b.unit==="pct"?"%":"쪽"} · 이대로면 ${end.getMonth()+1}월 ${end.getDate()}일쯤 다 읽습니다`; }
// 이 책의 밑줄을 쪽 순서로
function bookNotes(id){ return S.notes.filter(n=>n.bookId===id).sort((a,b)=>(+a.page||0)-(+b.page||0)||String(a.date).localeCompare(b.date)); }
function copyBookNotes(id){ const b=S.books.find(x=>x.id===id); const t=bookNotes(id).map(n=>`「${n.text}」${n.page?` (${b?.unit==="pct"?n.page+"%":"p."+n.page})`:""}${n.thought?"\n  ✎ "+n.thought:""}`).join("\n\n");
  navigator.clipboard?.writeText(`${b?.title||""}\n\n${t}`).then(()=>toast("이 책 밑줄을 복사했습니다")); }
function bookNotesHtml(id,open){ const ns=bookNotes(id); if(!ns.length) return ""; const b=S.books.find(x=>x.id===id);
  return `<details class="more" ${open?"open":""}><summary>이 책 밑줄 ${ns.length}개</summary>${ns.map(n=>`<div class="dquote">${esc(n.text)}<div class="muted">${n.page?(b?.unit==="pct"?n.page+"%":"p."+n.page)+" · ":""}${esc(n.date||"")}${n.thought?` · ✎ ${esc(n.thought)}`:""}</div></div>`).join("")}<button class="btn small" onclick="copyBookNotes('${id}')">밑줄 모두 복사</button></details>`; }
function openBook(id){
  const b=S.books.find(x=>x.id===id); if(!b) return;
  if(!$("#bookdetail")) go("shelf");
  const essays=live().filter(w=>w.bookId===id).length, notes=S.notes.filter(n=>n.bookId===id).length;
  $("#bookdetail").innerHTML=`<section class="sheet tape c" style="margin-bottom:30px"><div class="nowbook">${coverHtml(b)}<div style="flex:1;min-width:0">
    <div class="big">${esc(b.title)}</div><div class="sub">${esc((b.authors||[]).join(", "))}${b.publisher?" · "+esc(b.publisher):""}${b.isbn?" · ISBN "+esc(b.isbn):""}</div>
    <div class="muted">${[b.pubDate,b.unit==="pct"?"전자책":(b.total?b.total+"쪽":"")].filter(Boolean).map(esc).join(" · ")}${b.pubDate||b.total?"<br>":""}밑줄 ${notes}개 · 글 ${essays}편 ${b.notionId?"· 노션 독서 목록 ✓":""}${bookPace(b)?`<br>${bookPace(b)}`:""}</div>
    ${REVIEW_OPEN===b.id?"":bookNotesHtml(b.id)}
    <div class="row" style="gap:6px;margin-top:6px;align-items:center"><span class="muted" style="font-size:13px">분류</span><select style="width:auto;font-size:13px;padding:2px 6px" onchange="setCat('${b.id}',this.value)"><option value="">${esc(bookCat(b)||"미정")}${b.catMan?"":" (자동)"}</option>${CATS.map(c=>`<option value="${c}" ${b.catMan===c?"selected":""}>${c}</option>`).join("")}</select>${b.kdc?`<span class="muted" style="font-size:12px">KDC ${esc(b.kdc)}</span>`:""}
      <span class="muted" style="font-size:13px;margin-left:8px">읽는 방식</span><span class="pills"><button class="pill ${b.unit==="pct"?"":"on"}" onclick="setUnit('${b.id}','page')" data-tip="읽은 곳을 쪽수로 적습니다">종이책(쪽)</button><button class="pill ${b.unit==="pct"?"on":""}" onclick="setUnit('${b.id}','pct')" data-tip="밀리·윌라 같은 전자책은 읽은 곳을 %로 적습니다">전자책(%)</button></span></div>
    ${b.description?`<details class="more"><summary>책 소개</summary><p class="sub pre" style="margin:6px 0">${esc(b.description)}</p>${safeUrl(b.link)?`<a class="muted" href="${esc(safeUrl(b.link))}" rel="noopener" target="_blank">자세히 보기 ↗</a>`:""}</details>`:""}
    ${b.toc?.length?`<details class="more"><summary>목차 (${b.toc.length})</summary><ol class="toc">${b.toc.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></details>`:""}
    ${CONF.nl&&b.isbn&&!b.toc?.length?`<button class="btn small" style="margin-top:8px" onclick="enrichBook(S.books.find(x=>x.id==='${b.id}'))">국립중앙도서관에서 목차·쪽수 가져오기</button>`:""}
    <div class="row" style="margin-top:8px"><label class="field" style="width:90px"><span>${b.unit==="pct"?"읽은 %":"읽은 쪽"}</span><input id="bp" type="number" value="${b.page||0}" ${b.unit==="pct"?'max="100"':""}></label>${b.unit==="pct"?`<input id="bt" type="hidden" value="100">`:`<label class="field" style="width:90px"><span>전체 쪽</span><input id="bt" type="number" value="${b.total||""}"></label>`}
      <label class="field" style="flex:1;min-width:160px"><span>표지 바꾸기</span><input type="file" accept="image/*" onchange="uploadCover('${b.id}',this)" style="border:0"></label></div>
    <div class="row" style="margin-top:8px"><span class="stars">${[1,2,3,4,5].map(n=>`<span class="${(b.rating||0)>=n?"on":""}" onclick="rate('${b.id}',${n})">★</span>`).join("")}</span>${b.status==="완료"?`<span class="stamp round">완독</span>`:""}</div>
    ${b.oneLine&&REVIEW_OPEN!==b.id?`<p class="pen" style="font-size:21px;margin:8px 0 0">“${esc(b.oneLine)}”</p>`:""}
    ${b.review&&REVIEW_OPEN!==b.id?`<details class="more"><summary>독후감 ${b.reviewNotion?.page?`<a class="nstate ok" href="${esc(safeUrl(b.reviewNotion.url)||"#")}" target="_blank" style="text-decoration:none;margin-left:6px"><i></i>노션 독서 노트</a>`:""}</summary><p class="sub pre" style="margin:6px 0">${esc(b.review)}</p><button class="btn small" onclick="REVIEW_OPEN='${b.id}';openBook('${b.id}')">고치기</button></details>`:""}
    ${REVIEW_OPEN===b.id?reviewBox(b):""}
    <div class="row" style="margin-top:12px"><button class="btn ink small" onclick="saveBook('${b.id}')">저장</button>${b.status==="완료"&&REVIEW_OPEN!==b.id&&!b.review?`<button class="btn small" onclick="REVIEW_OPEN='${b.id}';openBook('${b.id}')">${ICO.pen}독후감 쓰기</button>`:""}
      ${b.id!==S.settings.currentBook&&b.status!=="완료"?`<button class="btn small" onclick="pickBook('${b.id}')">지금 읽는 책으로</button>`:""}
      ${b.status!=="완료"?`<button class="btn small" onclick="finishBook('${b.id}')">다 읽었습니다</button>`:`<button class="btn small" onclick="reopenBook('${b.id}')">다시 읽기</button>`}
      ${storeLinks(b.title)}
      <button class="btn small danger" onclick="delBook('${b.id}')">책장에서 빼기</button></div>
  </div></div></section>`;
  $("#bookdetail").scrollIntoView({behavior:"smooth",block:"start"});
}
function saveBook(id){ const b=S.books.find(x=>x.id===id); let p=+$("#bp").value||0; if(b.unit==="pct") p=Math.min(100,p); logPages(b,b.page||0,p); b.page=p; b.total=b.unit==="pct"?100:(+$("#bt").value||0); save(); syncBook(b); toast("저장했습니다"); render(); openBook(id); }
function rate(id,n){ const b=S.books.find(x=>x.id===id); b.rating=n; save(); syncBook(b); if(b.reviewNotion?.page) syncReview(b); openBook(id); }
function finishBook(id){ const b=S.books.find(x=>x.id===id); b.status="완료"; b.finished=today(); if(b.unit==="pct") b.page=100;
  if(S.settings.currentBook===id) S.settings.currentBook=S.books.find(x=>x.status!=="완료"&&x.id!==id)?.id||null; save(); syncBook(b); toast("한 권을 다 읽었습니다. 독후감을 남겨 보세요"); REVIEW_OPEN=id; render(); openBook(id); setTimeout(()=>$("#rv-one")?.focus(),200); }
// 여러 권을 같이 읽을 때: 고른 책이 「읽고 있는 책」 기준이 됩니다(쪽수 적기·밑줄의 기본 책)
function pickBook(id){ const b=S.books.find(x=>x.id===id); if(!b) return; if(b.status==="완료") return toast("다 읽은 책입니다. 「다시 읽기」를 눌러 주세요"); S.settings.currentBook=id; save(); toast(`「${b.title}」을(를) 지금 읽는 책으로 폈습니다`); render(); if(tab==="shelf") openBook(id); }
function reopenBook(id){ const b=S.books.find(x=>x.id===id); b.status="읽는 중"; S.settings.currentBook=id; save(); syncBook(b); render(); openBook(id); }
function delBook(id){ if(!confirm("책장에서 뺄까요? 밑줄과 글은 남습니다.")) return; tomb(id); S.books=S.books.filter(b=>b.id!==id); if(S.settings.currentBook===id) S.settings.currentBook=null; save(); render(); }
function uploadCover(id,input){
  const f=input.files[0]; if(!f) return; const img=new Image(), r=new FileReader();
  r.onload=()=>{ img.onload=()=>{ const s=Math.min(1,400/img.width), c=document.createElement("canvas"); c.width=img.width*s; c.height=img.height*s; c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S.books.find(x=>x.id===id).cover=c.toDataURL("image/jpeg",.85); save(); toast("표지를 바꿨습니다 (사진 표지는 노션에는 올라가지 않습니다)"); render(); openBook(id); }; img.src=r.result; };
  r.readAsDataURL(f);
}

// ───────── 동작: 원고 · 보관함 · 설정 ─────────
// ───────── 분류 · 원고 ─────────
// 저절로 붙는 분류(글 종류·성경책·읽은 책·해)와 직접 고르는 주제로 글을 찾고, 원고로 엮습니다
const ALL_TYPES=[...Object.keys(TYPES.bible),...Object.keys(LEGACY_TYPES.bible),...Object.keys(TYPES.book)];
const BOOK_NAMES=BIBLE.map((b,i)=>[b[0],i]).sort((a,b)=>b[0].length-a[0].length);
function bibleRef(s){ s=(s||"").trim(); for(const [n,i] of BOOK_NAMES) if(s.startsWith(n)){ const m=s.slice(n.length).match(/(\d+)(?:\s*[:장편]\s*(\d+))?/); return {book:i,ch:m?+m[1]:0,vs:m&&m[2]?+m[2]:0}; } return null; }
const wRef=w=>w.track==="bible"?bibleRef(w.passage):null;
const nRef=n=>n.track==="bible"?bibleRef(n.source):null;
const allTopics=()=>[...TOPICS,...(S.settings.customTopics||[])];
const usedTopics=()=>[...new Set([...live().flatMap(w=>[...(w.topics||[]),...(w.tags||[])]),...S.notes.flatMap(n=>n.tags||[])])];
const usedBooks=()=>[...new Set([...live().map(wRef),...S.notes.map(nRef)].filter(Boolean).map(x=>x.book))].sort((a,b)=>a-b);
const years=()=>[...new Set(live().map(w=>w.date.slice(0,4)))].sort().reverse();
function matches(w,r){
  if(r.types?.length&&!r.types.includes(w.type)) return false;
  if(r.books?.length){ const x=wRef(w); if(!x||!r.books.includes(x.book)) return false; }
  if(r.topics?.length&&![...(w.topics||[]),...(w.tags||[])].some(t=>r.topics.includes(t))) return false;
  if(r.readBooks?.length&&!r.readBooks.includes(w.bookId)) return false;
  if(r.year&&!w.date.startsWith(r.year)) return false;
  return true;
}
const ruleEmpty=r=>!(r.types.length||r.books.length||r.topics.length||r.readBooks.length||r.year);
function bibleOrder(a,b){ const x=wRef(a),y=wRef(b); if(x&&y) return x.book-y.book||x.ch-y.ch||x.vs-y.vs||a.date.localeCompare(b.date); return x?-1:y?1:a.date.localeCompare(b.date); }
function msList(m){
  if(m.rule) return live().filter(w=>matches(w,m.rule)).sort(m.order==="date"?(a,b)=>a.date.localeCompare(b.date):bibleOrder);
  return (m.items||[]).map(id=>S.writings.find(w=>w.id===id)).filter(w=>w&&!w.trashed);
}
const msOf=w=>liveMs().filter(m=>msList(m).includes(w));
const liveMs=()=>S.manuscripts.filter(m=>!m.trashed);
function ruleText(r){ const p=[];
  if(r.types?.length) p.push(r.types.join("·")); if(r.books?.length) p.push(r.books.map(i=>BIBLE[i][0]).join("·"));
  if(r.topics?.length) p.push("주제 "+r.topics.join("·")); if(r.readBooks?.length) p.push("책 "+r.readBooks.map(id=>S.books.find(b=>b.id===id)?.title||"").join("·"));
  if(r.year) p.push(r.year+"년"); return p.join("  +  "); }
function ensureMs(){ // 예전 방식(글마다 manuscriptId)을 원고의 목록(items)으로 옮깁니다
  S.manuscripts.forEach(m=>{ if(!m.rule&&!m.items) m.items=S.writings.filter(w=>w.manuscriptId===m.id).sort((a,b)=>(a.chapter??999)-(b.chapter??999)).map(w=>w.id); });
  S.writings.forEach(w=>{ delete w.manuscriptId; delete w.chapter; });
}
function msChanged(m,extra=[]){ save(); render(); syncSeq([...msList(m),...extra]); }

// 원고 만들기
let msDraft=null;
const blankRule=()=>({types:[],books:[],topics:[],readBooks:[],year:""});
function newMsDraft(kind){ msDraft={kind,rule:blankRule(),order:"bible",editing:null,title:""}; render(); }
function toggleRule(key,val){ msDraft.title=$("#mtitle")?.value||msDraft.title; const a=msDraft.rule[key], i=a.indexOf(val); i>=0?a.splice(i,1):a.push(val); render(); }
function setRuleYear(v){ msDraft.title=$("#mtitle")?.value||msDraft.title; msDraft.rule.year=v; render(); }
function addMs(){
  const t=$("#mtitle").value.trim(); if(!t) return toast("가제를 적어 주세요");
  if(msDraft.kind==="rule"){
    if(ruleEmpty(msDraft.rule)) return toast("모을 조건을 하나 이상 골라 주세요");
    const m=msDraft.editing?S.manuscripts.find(x=>x.id===msDraft.editing):null, data={title:t,rule:structuredClone(msDraft.rule),order:msDraft.order};
