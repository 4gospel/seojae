<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아침 서재</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아침 서재">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8dfcf" id="themecolor">
<meta name="color-scheme" content="light" id="colorscheme">
<script>
// 화면 밝기: 기기의 야간 모드와 상관없이 기본은 '밝게'. 설정에서 기기마다 '어둡게'·'기기 설정 따라'를 고를 수 있습니다.
// (화면이 그려지기 전에 정해야 어둡게 번쩍이지 않아서 맨 앞에 둡니다)
function applyTheme(t){
  t=t||(()=>{ try{ return localStorage.getItem("seojae.theme"); }catch(_){ return null; } })()||"light";
  const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.getElementById("colorscheme").content=dark?"dark":"light";
  document.getElementById("themecolor").content=dark?"#1a1612":"#e8dfcf";
  return t;
}
applyTheme();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e8dfcf; --paper:#fbf7ee; --paper-2:#f5eedf; --ink:#2e2721; --ink-soft:#6d6157; --faint:#7a6d5c; --deco:#b8ab98;
  --rule:rgba(110,140,170,.28); --margin:rgba(196,84,72,.42); --edge:rgba(80,60,40,.14);
  --sepia:#8a5a2b; --bible:#7a2e3a; --bible-wash:rgba(122,46,58,.08); --book:#2f5d4e; --book-wash:rgba(47,93,78,.09);
  --tape-a:rgba(214,170,120,.55); --tape-b:rgba(160,190,170,.55); --tape-c:rgba(200,150,160,.5);
  --wood-1:#9b6b43; --wood-2:#7c5233; --stamp:#b23a2e; --shadow:0 1px 1px rgba(60,40,20,.08),0 10px 24px -14px rgba(60,40,20,.35);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1a1612; --paper:#29231d; --paper-2:#231e19; --ink:#ece2d2; --ink-soft:#b7a993; --faint:#9a8c78; --deco:#6a5e50;
    --rule:rgba(236,226,210,.10); --margin:rgba(220,110,95,.35); --edge:rgba(0,0,0,.4);
    --sepia:#d9a466; --bible:#e09aa6; --bible-wash:rgba(224,154,166,.08); --book:#8fcfb8; --book-wash:rgba(143,207,184,.08);
    --tape-a:rgba(190,150,100,.35); --tape-b:rgba(120,160,140,.35); --tape-c:rgba(180,120,135,.35);
    --wood-1:#5a3d26; --wood-2:#3f2a1a; --stamp:#e0705f; --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --desk:#1a1612; --paper:#29231d; --paper-2:#231e19; --ink:#ece2d2; --ink-soft:#b7a993; --faint:#9a8c78; --deco:#6a5e50;
  --rule:rgba(236,226,210,.10); --margin:rgba(220,110,95,.35); --edge:rgba(0,0,0,.4);
  --sepia:#d9a466; --bible:#e09aa6; --bible-wash:rgba(224,154,166,.08); --book:#8fcfb8; --book-wash:rgba(143,207,184,.08);
  --tape-a:rgba(190,150,100,.35); --tape-b:rgba(120,160,140,.35); --tape-c:rgba(180,120,135,.35);
  --wood-1:#5a3d26; --wood-2:#3f2a1a; --stamp:#e0705f; --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{background:var(--desk)}
body{margin:0;min-height:100vh;background:var(--desk) var(--grain);color:var(--ink);font-family:"Gowun Batang",serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--sepia)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.pen{font-family:"Nanum Pen Script",cursive;font-weight:400}
.myeongjo{font-family:"Nanum Myeongjo",serif}

/* 머리 */
header{padding:22px 0 0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:"Nanum Pen Script";font-size:44px;line-height:1;color:var(--ink)}
.brand small{display:block;font-family:"Nanum Myeongjo";font-size:12px;letter-spacing:.35em;color:var(--faint);margin-top:6px}
.streak{font-family:"Nanum Pen Script";font-size:24px;color:var(--sepia)}
nav{display:flex;gap:6px;margin-top:18px;overflow-x:auto;padding:0 2px}
nav button{font:inherit;font-size:15px;color:var(--ink-soft);background:var(--paper-2) var(--grain);border:1px solid var(--edge);border-bottom:0;border-radius:10px 10px 0 0;padding:8px 16px 7px;cursor:pointer;white-space:nowrap;transform:translateY(3px);transition:transform .15s}
nav button:hover{transform:translateY(0)}
nav button.on{background:var(--paper) var(--grain);color:var(--ink);font-weight:700;transform:translateY(1px);box-shadow:0 -2px 0 var(--sepia) inset}
.navline{height:1px;background:var(--edge)}
main{padding:26px 0 80px}

/* 종이 */
.sheet{position:relative;background:var(--paper) var(--grain);border-radius:3px;padding:24px 24px 22px;box-shadow:var(--shadow);border:1px solid var(--edge)}
.sheet.tape::before{content:"";position:absolute;top:-11px;left:calc(50% - 55px);width:110px;height:24px;background:repeating-linear-gradient(45deg,var(--tape-a) 0 8px,transparent 8px 12px),var(--tape-a);opacity:.85;transform:rotate(-2.5deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet.tape.b::before{background:var(--tape-b);transform:rotate(2deg);left:24px}
.sheet.tape.c::before{background:repeating-linear-gradient(90deg,var(--tape-c) 0 6px,transparent 6px 10px),var(--tape-c);transform:rotate(-1.5deg);left:auto;right:28px}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.label{font-family:"Nanum Pen Script";font-size:22px;color:var(--sepia);line-height:1.1;margin:0 0 6px}
.label.bible{color:var(--bible)} .label.book{color:var(--book)}
h2{font-family:"Nanum Myeongjo";font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:14px}
.muted{color:var(--faint);font-size:14.5px}
.big{font-family:"Nanum Myeongjo";font-weight:700;font-size:22px;margin:4px 0 6px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* 날짜 */
.dateline{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.dateline .d{font-family:"Nanum Myeongjo";font-weight:800;font-size:46px;letter-spacing:-.02em;line-height:1}
.dateline .w{font-family:"Nanum Pen Script";font-size:28px;color:var(--ink-soft)}

/* 입력 */
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--deco);padding:6px 2px;width:100%;border-radius:0}
select{border:1px solid var(--edge);border-radius:6px;padding:6px 8px;background:var(--paper)}
textarea{border:1px dashed var(--deco);border-radius:4px;padding:10px;resize:vertical;min-height:90px;line-height:1.8}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sepia)}
.field{margin:12px 0 0}
.field>span{display:block;font-family:"Nanum Pen Script";font-size:19px;color:var(--ink-soft);line-height:1}

/* 버튼 */
.btn{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--ink-soft);border-radius:999px;padding:6px 16px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--paper-2)}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ink:hover{opacity:.9;background:var(--ink)}
.btn.small{font-size:13px;padding:3px 11px}
.btn.ghost{border-color:transparent;color:var(--ink-soft)}
.btn.danger{color:var(--stamp);border-color:transparent}
/* 밀랍 봉인 */
.sealrow{display:flex;gap:16px;align-items:center}
.seal{flex:0 0 auto;width:118px;height:118px;padding:0;border:0;background:none;cursor:pointer;transition:transform .2s ease;-webkit-tap-highlight-color:transparent}
.seal svg{width:100%;height:100%;display:block;overflow:visible}
.seal:hover{transform:rotate(-5deg) translateY(-2px)}
.seal:focus-visible{outline:2px dashed var(--sepia);outline-offset:4px;border-radius:50%}
.seal.press svg{animation:stampdown .5s cubic-bezier(.3,.6,.3,1)}
@keyframes stampdown{0%{transform:scale(1)}35%{transform:scale(.86) rotate(-4deg)}60%{transform:scale(1.04) rotate(1deg)}100%{transform:scale(1)}}
.sealtext{font-size:14px;line-height:1.6;color:var(--ink-soft)}

/* 흐름: 밑줄 → 글 → 원고 */
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.flow span{flex:1;min-width:120px;background:var(--paper-2);border:1px dashed var(--edge);border-radius:6px;padding:8px 10px;line-height:1.45}
.flow b{display:block;font-family:"Nanum Pen Script";font-weight:400;font-size:22px;color:var(--sepia);line-height:1}
.flow i{align-self:center;font-style:normal;color:var(--faint);font-size:18px}
/* 오늘 카드 안의 밑줄 */
.noteform{margin-top:14px;padding:14px;background:var(--paper-2);border:1px dashed var(--sepia);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.noteform textarea{min-height:72px;font-size:16px;background:var(--paper)}
.todaynotes{margin-top:14px;border-top:1px dashed var(--edge);padding-top:10px}
.mini-note{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px;line-height:1.5}
/* 글쓰기: 더 적기 */
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-family:"Nanum Myeongjo";font-weight:700;font-size:14px;color:var(--ink-soft);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";color:var(--sepia)}
details.more[open] summary::before{content:"▾ "}
/* 원고 꼭지 */
ol.chapters{list-style:none;padding:0;margin:12px 0}
ol.chapters li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--edge);font-size:15px}
ol.chapters .cn{font-size:21px;color:var(--sepia);width:20px;text-align:center}
ol.chapters .btn[disabled]{opacity:.25;cursor:default}

/* 원고 만들기 · 서랍 거르기 */
.bigchoice{font:inherit;color:inherit;text-align:left;width:100%;padding-left:16px}
.bigchoice:hover{border-color:var(--sepia)}
.rulegrid{display:grid;grid-template-columns:72px 1fr;gap:10px 12px;align-items:start;margin:10px 0}
.rulegrid .rl{font-family:"Nanum Pen Script";font-size:20px;color:var(--ink-soft);line-height:1.6}
.preview{background:var(--paper-2);border:1px dashed var(--sepia);border-radius:6px;padding:10px 14px}
.rulechips{font-size:13px;color:var(--bible);background:var(--bible-wash);border-radius:4px;padding:3px 8px;display:inline-block;margin:2px 0 6px}
.filterbar{margin-top:12px;gap:8px}
.filterbar select{flex:1;min-width:120px}
@media (max-width:700px){ .rulegrid{grid-template-columns:1fr;gap:2px} .rulegrid .rl{margin-top:8px} }

ol.toc{margin:6px 0 4px;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink-soft);max-height:320px;overflow:auto}
.pre{white-space:pre-wrap}

/* 책 미리보기 (PDF) */
.bookview{position:fixed;inset:0;z-index:60;background:var(--desk);display:flex;flex-direction:column}
.bv-bar{display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--edge)}
.bv-hint{margin:0;padding:6px 16px;background:var(--paper-2)}
.bookview iframe{flex:1;width:100%;border:0;background:#d9cfc0}

.draftbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper-2);border:1px dashed var(--sepia);border-radius:6px;padding:6px 12px;margin-bottom:10px;font-size:14px;color:var(--ink-soft)}

/* 도움말 · 단계 */
.hint{display:block;font-size:13.5px;line-height:1.55;color:var(--faint);margin-top:4px}
.step{display:flex;align-items:center;gap:8px;font-family:"Nanum Myeongjo";font-weight:700;font-size:15px;margin:0 0 6px}
.step .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sepia);color:var(--sepia);font-family:"Nanum Pen Script";font-size:18px;line-height:1}

/* 오늘의 말씀: 읽기 목록 */
.planline{font-size:15px;margin:2px 0 10px;color:var(--ink-soft)}
.portions{display:flex;flex-direction:column;gap:2px}
.portion{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--edge);padding:9px 2px;cursor:pointer}
.portion:last-child{border-bottom:0}
.portion .tick{color:var(--ink-soft);display:flex}
.portion .plab{font-family:"Nanum Pen Script";font-size:18px;color:var(--bible);min-width:44px}
.portion .ptext{font-family:"Nanum Myeongjo";font-weight:700;font-size:18px}
.portion.on .ptext{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--stamp);text-decoration-thickness:1.5px}
.portions-flow{font-family:"Nanum Myeongjo";font-weight:700;font-size:16px;line-height:1.9}
.portions-flow span:not(:last-child)::after{content:" · ";color:var(--faint);font-weight:400}
.portions-flow.done{color:var(--faint)}

/* 설정: 통독 방법 카드 */
.plancards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.plancards.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.plancard{position:relative;display:block;cursor:pointer;background:var(--paper-2);border:1px solid var(--edge);border-radius:6px;padding:14px 16px 12px 42px;transition:border-color .15s,background .15s}
.plancard input{position:absolute;left:14px;top:17px;width:auto;accent-color:var(--bible)}
.plancard.on{border-color:var(--bible);background:var(--bible-wash)}
.pc-head{display:flex;gap:8px;align-items:baseline;font-family:"Nanum Myeongjo";font-size:17px}
.pc-how{font-size:14px;line-height:1.65;color:var(--ink-soft);margin-top:4px}
.pc-ex{font-size:13px;color:var(--faint);margin-top:8px;line-height:1.5}
.pc-ex .pen{font-size:17px;color:var(--sepia)}

/* 도장 */
/* 고무도장: 이중 테두리로 또렷하게 (예전의 종이 질감 mask는 도장을 거의 투명하게 만들어 뺐습니다) */
.stamp{display:inline-block;font-family:"Nanum Pen Script";font-size:23px;line-height:1;letter-spacing:.5px;color:var(--stamp);border:2.5px solid currentColor;border-radius:6px;padding:5px 12px 3px;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3.5px currentColor;opacity:.92;white-space:nowrap}
.stamp.round{border-radius:50%;width:66px;height:66px;display:inline-flex;align-items:center;justify-content:center;padding:0;transform:rotate(-12deg)}
.stamp.ok{color:var(--book)}
.stamp.err{color:var(--stamp)}

/* 칩 */
.chip{display:inline-block;font-size:13px;padding:1px 10px;border:1px solid var(--edge);border-radius:999px;margin:3px 4px 0 0;color:var(--ink-soft);background:var(--paper-2);cursor:pointer;user-select:none}
.chip.on{background:var(--bible-wash);color:var(--bible);border-color:var(--bible)}
.chip.book.on{background:var(--book-wash);color:var(--book);border-color:var(--book)}
.tag{font-family:"Nanum Pen Script";font-size:19px;color:var(--sepia);margin-right:8px}

/* 질문 */
ol.q{margin:4px 0 0;padding-left:22px}
ol.q li{margin:8px 0;font-size:16px}
ol.q li::marker{font-family:"Nanum Pen Script";color:var(--sepia);font-size:20px}

/* 메모 */
.item{padding:14px 0;border-top:1px dashed var(--edge)}
.item:first-child{border-top:0}
.quote{font-family:"Nanum Myeongjo";font-size:17px;line-height:1.85;border-left:3px solid var(--sepia);padding:2px 0 2px 14px;margin:6px 0;white-space:pre-wrap}
.quote.bible{border-color:var(--bible)} .quote.book{border-color:var(--book)}
.thought{font-family:"Nanum Pen Script";font-size:21px;color:var(--ink-soft);line-height:1.3;white-space:pre-wrap}

/* 노트 페이지 */
.notebook{position:relative;background:var(--paper) var(--grain);box-shadow:var(--shadow);border:1px solid var(--edge);border-radius:2px 6px 6px 2px;padding:30px 34px 26px 84px}
.notebook::before{content:"";position:absolute;left:22px;top:30px;bottom:30px;width:16px;background:radial-gradient(circle,var(--desk) 6px,rgba(0,0,0,.12) 7px,transparent 8px) 0 0/16px 72px repeat-y}
.notebook .title-in{font-family:"Nanum Myeongjo";font-weight:800;font-size:26px;border:0;border-bottom:2px solid var(--ink);padding:4px 0;margin-bottom:6px}
.notebook .meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--faint);font-size:14px;margin-bottom:10px}
textarea.page{display:block;width:100%;min-height:62vh;border:0;border-radius:0;padding:4px 4px 0;resize:none;overflow:hidden;
  font-family:"Gowun Batang",serif;font-size:18px;line-height:36px;color:var(--penink,var(--ink));
  background-color:transparent;background-attachment:local;background-position:0 3px}
textarea.page.lined{background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px)}
textarea.page.grid{background-image:repeating-linear-gradient(to bottom,transparent 0 17px,var(--rule) 17px 18px),repeating-linear-gradient(to right,transparent 0 17px,var(--rule) 17px 18px)}
textarea.page.blank{background-image:none}
.notebook .margin{position:absolute;top:0;bottom:0;left:70px;width:1px;background:var(--margin)}
.notebook.blank .margin{display:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inkdot{width:20px;height:20px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--edge);cursor:pointer}
.inkdot.on{box-shadow:0 0 0 2px var(--ink-soft)}
.writegrid{display:grid;grid-template-columns:1fr 310px;gap:26px;align-items:start}
@media (max-width:880px){.writegrid{grid-template-columns:1fr}.notebook{padding:24px 18px 20px 54px}.notebook::before{left:12px}.notebook .margin{left:44px}}
.card-index{background:var(--paper) var(--grain);border:1px solid var(--edge);box-shadow:var(--shadow);padding:18px 18px 16px;border-top:22px solid var(--bible-wash);position:relative}
.card-index.book{border-top-color:var(--book-wash)}
.side-note{cursor:pointer;padding:10px 12px;margin:8px 0;background:var(--paper-2);border-left:3px solid var(--sepia);font-size:14px;line-height:1.6}
.side-note:hover{background:var(--bible-wash)}

/* 집중 모드 */
body.focus header,body.focus .writegrid>aside,body.focus .toolbar .nofocus{display:none}
body.focus .writegrid{grid-template-columns:1fr;max-width:820px;margin:0 auto}
body.focus main{padding-top:40px}

/* 책장 */
.shelf{position:relative;display:flex;align-items:flex-end;gap:18px;padding:18px 18px 0;min-height:200px;overflow-x:auto}
.shelf::after{content:"";position:sticky;left:0}
.plank{height:16px;background:linear-gradient(var(--wood-1),var(--wood-2));border-radius:2px;box-shadow:0 6px 10px -4px rgba(0,0,0,.4);margin:0 0 26px}

/* 오늘 책 */

.timer{font-family:"Nanum Myeongjo";font-weight:800;font-size:40px;letter-spacing:2px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:50}

}
.penpaper{display:inline-flex;align-items:center;gap:8px}

/* 설정: 구석의 톱니(손으로 그린 듯한 놋쇠 톱니) */
.top{position:relative}
.gearbtn{position:absolute;right:0;top:-6px;width:46px;height:46px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--sepia);border-radius:50%;transition:transform .5s ease}
.gearbtn svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.12))}
.gearbtn:hover{transform:rotate(40deg)}

.top .streak{margin-right:58px}
/* 설정 화면 묶음 */
.setgroup{font-family:"Nanum Myeongjo";font-weight:800;font-size:15px;letter-spacing:.3em;color:var(--faint);margin:34px 0 12px;display:flex;align-items:center;gap:12px}

/* 작은 단추 묶음 (통독 방법·넘어가기·요일·밝기) */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;font:inherit;font-size:14.5px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--edge);border-radius:999px;padding:6px 14px;cursor:pointer;line-height:1.3}
.pill small{color:var(--faint);font-size:12px;margin-left:4px}
.pill.on{background:var(--bible-wash);color:var(--bible);border-color:var(--bible);font-weight:700}

@media (hover:hover){
  .pill[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:max-content;max-width:300px;white-space:normal;text-align:left;font-weight:400;font-size:13.5px;line-height:1.6;color:var(--ink);background:var(--paper) var(--grain);border:1px solid var(--edge);border-radius:4px;padding:9px 12px;box-shadow:var(--shadow)}
}
.planinfo{margin-top:12px;padding:10px 14px;border-left:2px solid var(--bible);background:var(--bible-wash);font-size:14px;line-height:1.7;color:var(--ink-soft)}
.setrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px}

.restcard .big{font-family:"Nanum Pen Script";font-size:30px}
@media (max-width:700px){ .gearbtn{width:42px;height:42px;top:-2px} .setrow>.k{min-width:0;width:100%} }

/* 독서 일기 */

@media (max-width:700px){ .diary{grid-template-columns:1fr} .diary .pg{padding:22px 18px 30px} .diary .pg.l{border-right:0;border-bottom:1px dashed var(--edge);box-shadow:none} .diary .pg.r{box-shadow:none} .dhead .dd{font-size:46px} }
/* 스티커 */
.notebook{position:relative}

.stk .tape{display:block;width:130px;height:30px;opacity:.85;clip-path:polygon(2% 0,98% 6%,100% 30%,98% 52%,100% 76%,97% 100%,3% 95%,0 70%,2% 48%,0 24%)}

.calpick a:hover{color:var(--sepia)}
/* 주석 서재 */
.cmtbox{margin-top:12px;border-top:1px dashed var(--deco);padding-top:10px}
.cmtsum{white-space:pre-wrap;font-size:15px;line-height:1.75}
.cmtsum h5{font-family:"Nanum Pen Script";font-size:21px;color:var(--sepia);margin:10px 0 2px}
.cmtex{white-space:pre-wrap;font-size:14px;line-height:1.65;color:var(--ink-soft);max-height:40vh;overflow:auto;border-left:2px solid var(--deco);padding-left:10px;margin:4px 0 8px}
.cmtlist{margin:6px 0 0;padding:0;list-style:none}
.cmtlist li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dotted var(--edge);font-size:14px}
.cmtlist li .nm{flex:1;min-width:0;word-break:break-all}
.cmtlist .bk{font-size:12px;color:var(--faint)}

/* 성경 약어 줄에서 보이는 작은 안내: ⇧⏎ 로 구절 넣기 */
.refhint{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-soft);background:var(--paper-2);border:1px dashed var(--deco);border-radius:999px;padding:2px 10px 2px 6px;cursor:pointer;margin-left:8px;animation:fadein .25s}
.refhint:hover{border-style:solid;color:var(--sepia)}
.refhint kbd{font:inherit;font-size:11px;line-height:1;padding:3px 5px;border:1px solid var(--deco);border-bottom-width:2px;border-radius:4px;background:var(--paper);color:var(--ink)}
@keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}

/* 잉크 선 아이콘 (이모지 대신) */
.ico{width:16px;height:16px;vertical-align:-3px;margin-right:4px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .ico{opacity:.85}
.label .ico{width:18px;height:18px;margin-right:2px}

/* 설정: 이미 된 것은 작게 */
.sheet.compact{padding:12px 18px 10px}
.sheet.compact>.label{font-size:18px;margin:0 0 2px}
.sheet.compact>.sub,.sheet.compact>.okline{font-size:14px;margin:0}
.okline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-soft)}
.okline .stamp.ok{font-size:15px;padding:2px 8px 1px;transform:rotate(-3deg)}
.sheet.compact details.keybox{margin-top:6px}
.sheet.compact details.keybox>summary{font-size:13px;color:var(--faint)}

function validConn(c){ return !!c&&typeof c.k==="string"&&c.k.length>=20&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(c.u||""); }
function askReplace(c){ let cur=null; try{ cur=JSON.parse(localStorage.getItem(CONN_KEY)||"null"); }catch(_){}
  return !cur||(cur.u===c.u&&cur.k===c.k)||confirm("이 기기는 이미 아침 서재에 연결되어 있습니다.\n받은 연결 링크로 바꿀까요? (본인이 직접 만든 링크가 아니면 「취소」를 누르세요)"); }
(function takeConnectLink(){ // 주소 끝의 #connect=… 를 읽어 이 기기에 열쇠를 저장하고, 주소에서는 지웁니다
  const m=location.hash.match(/^#connect=([\w\-=]+)/); if(!m) return;
  try{ const c=JSON.parse(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")));
    if(validConn(c)&&askReplace(c)){ localStorage.setItem(CONN_KEY,JSON.stringify({u:c.u,k:c.k})); window._justConnected=true; } }catch(_){}
  history.replaceState(null,"",location.pathname+location.search);
})();
let CONN=null; try{ CONN=JSON.parse(localStorage.getItem(CONN_KEY)||"null"); }catch(_){}
const IS_LOCAL=/^(localhost|127\.0\.0\.1|\[::1\]|192\.168\.|10\.)/.test(location.hostname)||location.protocol==="file:";
const GAS=!!CONN;                        // 구글 서버를 쓰는지
let NEED_CONNECT=!CONN&&!IS_LOCAL, AUTH_FAIL=false;
async function gcall(fn,...args){
  // 본문을 글자(text/plain)로 보내면 브라우저가 따로 허락을 묻지 않아 구글 서버에 바로 닿습니다
  const r=await fetch(CONN.u,{method:"POST",body:JSON.stringify({key:CONN.k,fn,args})});
  const j=await r.json();
  if(j.auth===false){ AUTH_FAIL=true; throw new Error(j.error); }
  if(!j.ok) throw new Error(j.error);
  return j.result;
}
const connectLink=()=>location.origin+location.pathname+"#connect="+btoa(JSON.stringify(CONN)).replace(/\+/g,"-").replace(/\//g,"_");
function connectWith(text){ // 연결 링크나 연결 코드를 붙여 넣었을 때
  const code=(text||"").trim().replace(/^.*#connect=/,"");
  try{ const c=JSON.parse(atob(code.replace(/-/g,"+").replace(/_/g,"/"))); if(!validConn(c)||!askReplace(c)) throw 0;
    localStorage.setItem(CONN_KEY,JSON.stringify({u:c.u,k:c.k})); location.reload(); }

// 휴대폰과 컴퓨터에서 번갈아 쓰다가 엇갈리면, 두 쪽 기록을 하나로 합칩니다(같은 글이면 나중에 고친 쪽)
// · 지운 것은 S.deleted 에 지운 시각(묘비)을 남겨, 옛 사본과 합쳐도 되살아나지 않게 합니다
// · 책·원고·설정은 바뀔 때 시각을 찍어 두고(stampChanges), 합칠 때 나중에 바뀐 쪽을 씁니다
const SER=()=>JSON.stringify(S,(k,v)=>k==="syncing"||k==="resync"?undefined:v);
const isDirty=()=>{ try{ return localStorage.getItem("seojae.dirty")==="1"; }catch(_){ return false; } };

function tomb(id){ (S.deleted=S.deleted||{})[id]=new Date().toISOString(); }
let SNAP=null;
const itemKey=x=>JSON.stringify(x,(k,v)=>k==="updated"||k==="syncing"||k==="resync"?undefined:v);
function takeSnap(){
  SNAP={settings:JSON.stringify(S.settings),reminder:JSON.stringify(S.reminder||null)};
  for(const k of ["books","manuscripts"]) for(const x of S[k]) SNAP[k+":"+x.id]=itemKey(x);
}
function stampChanges(){
  if(!SNAP) return takeSnap();
  const now=new Date().toISOString();
  if(SNAP.settings!==JSON.stringify(S.settings)) S.settingsT=now;
  if(SNAP.reminder!==JSON.stringify(S.reminder||null)) S.reminderT=now;
  for(const k of ["books","manuscripts"]) for(const x of S[k]) if(SNAP[k+":"+x.id]!==itemKey(x)) x.updated=now;
  takeSnap();
}
function mergeFrom(other){
  const del=Object.assign({},other.deleted||{},S.deleted||{});
  const stamp=x=>x.updated||x.date||"";
  for(const k of ["notes","writings","books","manuscripts"]){
    const map=new Map((other[k]||[]).map(x=>[x.id,x]));
    for(const x of S[k]) if(!map.has(x.id)||stamp(x)>=stamp(map.get(x.id))) map.set(x.id,x);
    S[k]=[...map.values()].filter(x=>!del[x.id]);
  }
  const old=new Date(Date.now()-400*864e5).toISOString();        // 1년 넘은 묘비는 정리
  S.deleted=Object.fromEntries(Object.entries(del).filter(([,t])=>t>old));
  const L=Object.assign({},other.log);                       // 날마다 기록은 칸 단위로 합칩니다 (읽은 분량·쪽수는 양쪽 합집합)
  for(const [d,v] of Object.entries(S.log||{})){ const o=L[d]||{}, m=Object.assign({},o,v);
    if(o.bible||v.bible){ const bl=[...(o.bible||[])]; (v.bible||[]).forEach(x=>{ if(!bl.some(y=>y.plan===x.plan&&y.day===x.day)) bl.push(x); }); m.bible=bl; }
    if(o.books||v.books){ const bk=Object.assign({},o.books); for(const [id,x] of Object.entries(v.books||{})) bk[id]=bk[id]?{title:x.title,from:Math.min(bk[id].from,x.from),to:Math.max(bk[id].to,x.to)}:x; m.books=bk; }
    L[d]=m; }
  S.log=L;
  const D=Object.assign({},other.diary);                     // 독서 일기: 더 나중에 고친 쪽을 바탕으로, 비어 있는 칸은 다른 쪽에서, 스티커는 합집합
  for(const [d,v] of Object.entries(S.diary||{})){ const o=D[d]; if(!o){ D[d]=v; continue; }
    const [nw,old]=(v.t||"")>=(o.t||"")?[v,o]:[o,v], m=Object.assign({},old,nw);
    for(const k of ["weather","mood","line"]) if(nw[k]==null||nw[k]==="") m[k]=old[k]??nw[k];
    const st=new Map((old.stickers||[]).map(x=>[x.id,x])); (nw.stickers||[]).forEach(x=>st.set(x.id,x)); m.stickers=[...st.values()].filter(x=>!del[x.id]);
    D[d]=m; }
  S.diary=D;
  const MK=Object.assign({},other.marks);                    // 본문 형광펜: 날짜마다 표시 하나하나 더 나중에 고친 쪽
  for(const [d,list] of Object.entries(S.marks||{})){ const map=new Map((MK[d]||[]).map(x=>[x.id,x])); for(const x of list) if(!map.has(x.id)||(x.u||"")>=(map.get(x.id).u||"")) map.set(x.id,x); MK[d]=[...map.values()]; }
  for(const d in MK) MK[d]=(MK[d]||[]).filter(x=>!del[x.id]);
  S.marks=MK;
  if((other.settingsT||"")>(S.settingsT||"")){ S.settings=Object.assign(blank().settings,other.settings); S.settingsT=other.settingsT; }
  if((other.reminderT||"")>(S.reminderT||"")){ S.reminder=other.reminder; S.reminderT=other.reminderT; }
  takeSnap();
}

let SAVING=false, AGAIN=false;
async function pushSave(){

}

  for(const m of str.matchAll(FN_RE)){ out+=esc(str.slice(last,m.index)); last=m.index+m[0].length; out+=`<sup class="fnref" title="${esc(m[1])}">${fn?fn.push(m[1]):"✎"}</sup>`; }
  return out+esc(str.slice(last));
}
function richHtml(t,fn){ // fn: 각주를 모을 배열 (없으면 각주를 ✎ 로만)
  let out="", last=0; const str=String(t||"");
  for(const m of str.matchAll(MK_RE)){ out+=esc(str.slice(last,m.index)); last=m.index+m[0].length;
    if(m[4]!=null) out+=`<sup class="fnref" title="${esc(m[4])}">${fn?fn.push(m[4]):"✎"}</sup>`;
    else if(m[3]!=null) out+=`<u class="mku">${fnHtmlIn(m[3],fn)}</u>`;
    else out+=`<mark class="mk hl-${m[1]||"y"}">${fnHtmlIn(m[2],fn)}</mark>`; }
  return out+esc(str.slice(last));
}

function markHtml(t,ms){
  if(!ms.length) return esc(t);
  const cuts=new Set([0,t.length]); ms.forEach(m=>{ cuts.add(Math.max(0,Math.min(t.length,m.s))); cuts.add(Math.max(0,Math.min(t.length,m.e))); });
  const pts=[...cuts].sort((a,b)=>a-b); let out="";
  for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1], seg=t.slice(a,b), cov=ms.filter(m=>m.s<=a&&m.e>=b);
    if(!cov.length){ out+=esc(seg); continue; }
    const hl=[...cov].reverse().find(m=>m.color), ul=cov.some(m=>m.ul);
    out+=`<mark class="mk ${hl?"hl-"+hl.color:""} ${ul?"ul":""}" data-mid="${cov[cov.length-1].id}">${esc(seg)}</mark>`;
    cov.filter(m=>m.memo&&m.e===b).forEach(m=>out+=`<sup class="mmo" data-mid="${m.id}" title="${esc(m.memo)}">✎</sup>`); }
  return out;
}

function spanCalc(m,untilKey){

function walkFwd(n){ const d=new Date(); let c=0; while(c<n){ d.setDate(d.getDate()+1); if(isReadDay(dkey(d))) c++; } return dkey(d); }

  if(p.mode==="date"){ p.start=walkBack(i); p.setOn=today(); p.done=was?{[i]:true}:{}; }
  else if(was){ p.last={date:today(),index:i}; p.day=Math.min(planDays().length,i+1); } else p.day=i; }

  { const total=Math.max(1,Math.round(c.rd/(1-c.frac))); p.span=total; _days.key="";
    setIndexTo(Math.min(planDays().length-1,Math.round(c.frac*planDays().length))); }

// 읽는 요일 (0=일 … 6=토). 정하지 않았으면 매일

// ───────── 작은 달력: 묵상한 날(형광 동그라미)·설교로 올린 날(붉은 도장)·책 글(초록 점) ─────────
let calY=null, calM=null, calPick=null;
function calHtml(){
  const now=new Date(); if(calY==null){ calY=now.getFullYear(); calM=now.getMonth(); }
  const marks={}; S.writings.forEach(w=>{ const m=marks[w.date]=marks[w.date]||{}; if(w.type==="묵상을설교로") m.promo=true; else if(w.track==="bible") m.bible=true; else m.book=true; });
  const first=new Date(calY,calM,1), start=new Date(first); start.setDate(1-first.getDay()); const t=today(); let cells="";
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); if(i>=35&&d.getMonth()!==calM) break;
    const k=dkey(d), m=marks[k]||{}, cls=["d",d.getMonth()!==calM?"o":"",d.getDay()===0?"sun":"",k===t?"today":"",m.promo?"promo":m.bible?"bible":"",m.book?"book":""].filter(Boolean).join(" ");
    cells+=`<button type="button" class="${cls}" onclick="calGo('${k}')" title="${k}${m.bible||m.promo||m.book?" · 쓴 글 "+S.writings.filter(w=>w.date===k).length+"편":""}"><span>${d.getDate()}</span></button>`; }
  const pick=calPick?S.writings.filter(w=>w.date===calPick):[];
  return `<div class="calcard"><div class="calhead"><button onclick="calMove(-12)" title="지난해">«</button><button onclick="calMove(-1)" title="지난달">‹</button><span class="t">${calY}년 ${calM+1}월</span><button onclick="calMove(1)" title="다음 달">›</button><button onclick="calMove(12)" title="다음 해">»</button>${(calY!==now.getFullYear()||calM!==now.getMonth())?`<button onclick="calY=calM=null;calPick=null;paintCal()" title="이번 달로" style="font-size:12px;width:auto;padding:0 6px">오늘</button>`:""}</div>
    <div class="cal">${"일월화수목금토".split("").map(x=>`<div class="wd">${x}</div>`).join("")}${cells}</div>
    <div class="callegend"><span><i style="background:rgba(247,214,92,.8)"></i>묵상·말씀 글</span><span><i style="border:1.5px solid var(--stamp);border-radius:3px;width:10px;height:10px"></i>설교로 올린 날</span><span><i style="background:var(--book);width:7px;height:7px"></i>책 글</span></div>
    ${pick.length>1?`<div class="calpick"><div class="muted">${calPick}에 쓴 글 ${pick.length}편</div>${pick.map(w=>`<a href="#" onclick="calPick=null;go('write',{edit:'${w.id}'});return false">[${esc(wTag(w))}] ${esc(w.title||w.passage||"(제목 없음)")}</a>`).join("")}</div>`:""}</div>`;
}
function paintCal(){ const el=$(".calcard"); if(!el) return; el.outerHTML=calHtml(); }
function calMove(n){ let m=calM+n, y=calY; while(m<0){ m+=12; y--; } while(m>11){ m-=12; y++; } calY=y; calM=m; calPick=null; paintCal(); }
function calGo(k){ // 그날 쓴 글로: 한 편이면 바로, 여럿이면 고르기, 없으면 그날 일기
  const ws=S.writings.filter(w=>w.date===k);
  if(ws.length===1) return go("write",{edit:ws[0].id});
  if(ws.length>1){ calPick=k; const d=new Date(k+"T00:00"); calY=d.getFullYear(); calM=d.getMonth(); paintCal(); return; }
  diaryDate=k; go("diary"); toast(`${k}에 쓴 글이 없어 그날 일기를 엽니다`);
}

};
let wStk=[], STK_SEL=null, STK_OPEN=false, STK_CAT="책·글", STK_MODE="paper", STK_DRAG=null;
const stkBody=k=>k.startsWith("t:")?`<span class="tape t-${esc(k.slice(2))}"></span>`:k.startsWith("s:")?`<span class="sst">${esc(k.slice(2))}</span>`:`<span class="se">${esc(k.slice(2))}</span>`;
function stkList(ctx){
  if(ctx==="write"){ const w=editId&&S.writings.find(x=>x.id===editId); return w?(w.stickers=w.stickers||[]):wStk; }
  const e=dEntry(ctx.slice(6),true); return e.stickers=e.stickers||[];
}
function stkCommit(ctx){
  if(ctx==="write"){ const w=editId&&S.writings.find(x=>x.id===editId); if(w){ w.updated=new Date().toISOString(); save(); } return; }
  dTouch(ctx.slice(6));
}
const stkStyle=t=>`left:${t.x}%;top:${t.y}%;transform:translate(-50%,-50%) rotate(${t.r||0}deg) scale(${t.s||1})`;
function stkInner(ctx){
  const L=(ctx==="write"?(editId&&S.writings.find(x=>x.id===editId)?.stickers)||wStk:dEntry(ctx.slice(6)).stickers)||[];
  const sel=L.find(t=>t.id===STK_SEL);
  return L.map(t=>`<div class="stk ${t.id===STK_SEL?"sel":""}" data-id="${t.id}" style="${stkStyle(t)}">${stkBody(t.k)}</div>`).join("")
    +(sel?`<div class="stk-tools" style="left:clamp(112px,${sel.x}%,calc(100% - 112px));top:calc(${sel.y}% + ${Math.round(34*(sel.s||1))}px)"><button onclick="stkAct('l')" title="왼쪽으로 돌리기">⟲</button><button onclick="stkAct('r')" title="오른쪽으로 돌리기">⟳</button><button onclick="stkAct('-')" title="작게">−</button><button onclick="stkAct('+')" title="크게">＋</button><button onclick="stkAct('f')" title="맨 앞으로">⇡</button><button onclick="stkAct('x')" title="떼기">${ICO.trash.replace('class="ico"','class="ico" style="margin:0"')}</button></div>`:"");
}
const stkLayer=ctx=>`<div class="stk-layer" data-ctx="${esc(ctx)}">${stkInner(ctx)}</div>`;
function paintStk(){ document.querySelectorAll(".stk-layer").forEach(l=>l.innerHTML=stkInner(l.dataset.ctx)); paintPalette(); }
function curLayer(){ return $(".stk-layer"); }
function addSticker(k){
  if(STK_MODE==="text"&&tab==="write"){ if(!k.startsWith("e:")) return toast("글 속에는 이모지만 넣을 수 있습니다");
    const b=$("#wbody"), v=k.slice(2), p=b.selectionStart??b.value.length; b.value=b.value.slice(0,p)+v+b.value.slice(b.selectionEnd??p); b.selectionStart=b.selectionEnd=p+v.length; countW(); draftInput(); return; }
  const layer=curLayer(); if(!layer) return; const ctx=layer.dataset.ctx, r=layer.getBoundingClientRect();
  const cl=v=>Math.max(4,Math.min(96,v));
  const t={id:uid(),k,x:cl((innerWidth/2-r.left)/r.width*100+(Math.random()*16-8)),y:cl((innerHeight*.42-r.top)/r.height*100+(Math.random()*10-5)),r:Math.round(Math.random()*24-12),s:1};
  stkList(ctx).push(t); STK_SEL=t.id; stkCommit(ctx); paintStk();
}
function stkAct(op){
  const layer=document.querySelector(`.stk[data-id="${STK_SEL}"]`)?.parentElement; if(!layer) return; const ctx=layer.dataset.ctx, L=stkList(ctx), i=L.findIndex(t=>t.id===STK_SEL); if(i<0) return; const t=L[i];
  if(op==="l") t.r=(t.r||0)-15; if(op==="r") t.r=(t.r||0)+15;
  if(op==="+") t.s=Math.min(3,+((t.s||1)*1.15).toFixed(2)); if(op==="-") t.s=Math.max(.4,+((t.s||1)/1.15).toFixed(2));
  if(op==="f"){ L.splice(i,1); L.push(t); } if(op==="x"){ L.splice(i,1); tomb(t.id); STK_SEL=null; }
  stkCommit(ctx); paintStk();
}
function toggleStk(){ STK_OPEN=!STK_OPEN; if(!STK_OPEN) STK_SEL=null; paintStk(); }
function paintPalette(){
  let el=$("#stkpal"); if(!STK_OPEN||!(tab==="diary"||tab==="write")){ el?.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="stkpal"; el.className="stk-palette"; document.body.appendChild(el); }
  const items=STICKERS[STK_CAT].map(k=>k.includes(":")?k:"e:"+k);
  el.innerHTML=`<div class="ptabs">${Object.keys(STICKERS).map(c=>`<button class="pill ${c===STK_CAT?"on":""}" onclick="STK_CAT='${c}';paintPalette()">${c}</button>`).join("")}<span style="flex:1"></span>
    ${tab==="write"?`<button class="pill ${STK_MODE==="paper"?"on":""}" onclick="STK_MODE='paper';paintPalette()" data-tip="종이 위 아무 곳에나 붙입니다">종이에 붙이기</button><button class="pill ${STK_MODE==="text"?"on":""}" onclick="STK_MODE='text';paintPalette()" data-tip="커서 자리에 이모지를 글자로 넣습니다">글 속에 넣기</button>`:""}
    <button class="btn small ghost" onclick="toggleStk()">닫기</button></div>
    <div class="pgrid">${items.map(k=>`<button class="pi" onmousedown="event.preventDefault()" onclick="addSticker(${jsArg(k)})">${k.startsWith("e:")?esc(k.slice(2)):stkBody(k)}</button>`).join("")}</div>
    <p class="hint" style="margin:6px 0 0">누르면 붙고, 끌어서 옮깁니다. 붙인 스티커를 누르면 돌리기·크기·떼기 단추가 나옵니다.</p>`;
}
document.addEventListener("pointerdown",e=>{
  if(e.target.closest(".stk-tools,.stk-palette")) return;
  const el=e.target.closest(".stk");
  if(!el){ if(STK_SEL){ STK_SEL=null; paintStk(); } return; }
  e.preventDefault(); const layer=el.parentElement, ctx=layer.dataset.ctx, t=stkList(ctx).find(x=>x.id===el.dataset.id); if(!t) return;
  if(STK_SEL!==t.id){ STK_SEL=t.id; document.querySelectorAll(".stk.sel").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); layer.querySelector(".stk-tools")?.remove(); }
  STK_DRAG={el,ctx,t,r:layer.getBoundingClientRect(),sx:e.clientX,sy:e.clientY,x0:t.x,y0:t.y,moved:false};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove",e=>{ const g=STK_DRAG; if(!g) return;
  const dx=e.clientX-g.sx, dy=e.clientY-g.sy; if(Math.abs(dx)+Math.abs(dy)>3) g.moved=true;
  g.t.x=Math.max(0,Math.min(100,g.x0+dx/g.r.width*100)); g.t.y=Math.max(0,Math.min(100,g.y0+dy/g.r.height*100)); g.el.style.cssText=stkStyle(g.t); });
document.addEventListener("pointerup",()=>{ const g=STK_DRAG; if(!g) return; STK_DRAG=null; g.t.x=+g.t.x.toFixed(2); g.t.y=+g.t.y.toFixed(2); if(g.moved) stkCommit(g.ctx); paintStk(); });
document.addEventListener("pointercancel",()=>{ const g=STK_DRAG; if(!g) return; STK_DRAG=null; if(g.moved) stkCommit(g.ctx); paintStk(); });
document.addEventListener("keydown",e=>{ if(STK_SEL&&(e.key==="Delete"||e.key==="Backspace")&&!e.target.matches?.("input,textarea,select")){ e.preventDefault(); stkAct("x"); } });

async function pullNotion(id){
  const w=S.writings.find(x=>x.id===id); if(!w) return;
  if(!w.notion?.page) return toast(w.syncing?"노션에 싣는 중입니다. 잠시 뒤 다시 눌러 주세요":"아직 노션에 실리지 않은 글입니다. 먼저 간직해 주세요");
  if(tab==="write"&&writingUnsaved()) return toast("먼저 지금 글을 간직하거나 되돌린 뒤 가져와 주세요");
  toast("노션에서 가져오는 중…");
  try{ const r=await gcall("notionPull",{page:w.notion.page,marker:w.notion.marker});
    if(!r.ok) return toast(r.error||"가져오지 못했습니다");
    if(!r.body.trim()) return toast("노션 페이지에 가져올 글이 없습니다");
    const norm=t=>String(t||"").replace(/[ \t]+$/gm,"").replace(/\n{2,}/g,"\n").trim();
    if(norm(r.body)===norm(w.body)) return toast("앱의 글과 노션 글이 같습니다");
    if(!confirm(`노션 페이지의 글로 이 글을 바꿀까요?\n지금 글은 「이전 판」으로 남습니다.${r.skipped?`\n(토글·표 등 ${r.skipped}개는 노션에만 그대로 둡니다)`:""}`)) return;
    w.prev=[{at:w.updated||w.date,body:w.body},...(w.prev||[])].slice(0,3);
    w.body=r.body; w.notion.blocks=r.blocks; w.updated=new Date().toISOString(); if(w.status==="씨앗") w.status="다듬는 중";
    save(); render(); toast("노션의 글을 가져왔습니다");
  }catch(e){ toast("서버에 닿지 못했습니다"); }
}

function waxBlob(cx,cy,r){
  const n=30, pts=[];
  for(let k=0;k<n;k++){ const a=k/n*Math.PI*2;
    const bump=1+.045*Math.sin(a*3+1.3)+.03*Math.sin(a*7+.4)+.02*Math.sin(a*13)+(Math.abs(a-2.2)<.25?.07:0)+(Math.abs(a-5.1)<.2?.05:0);
    pts.push([cx+Math.cos(a)*r*bump,cy+Math.sin(a)*r*bump]); }
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let k=0;k<n;k++){ const p0=pts[(k-1+n)%n],p1=pts[k],p2=pts[(k+1)%n],p3=pts[(k+2)%n];
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`; }
  return d+"Z";
}

function uploadCover(id,input){
  const f=input.files[0]; if(!f) return; const img=new Image(), r=new FileReader();
  r.onload=()=>{ img.onload=()=>{ const s=Math.min(1,400/img.width), c=document.createElement("canvas"); c.width=img.width*s; c.height=img.height*s; c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S.books.find(x=>x.id===id).cover=c.toDataURL("image/jpeg",.85); save(); toast("표지를 바꿨습니다 (사진 표지는 노션에는 올라가지 않습니다)"); render(); openBook(id); }; img.src=r.result; };

// ───────── 분류 · 원고 ─────────
// 저절로 붙는 분류(글 종류·성경책·읽은 책·해)와 직접 고르는 주제로 글을 찾고, 원고로 엮습니다
const ALL_TYPES=[...Object.keys(TYPES.bible),...Object.keys(TYPES.book)];
const BOOK_NAMES=BIBLE.map((b,i)=>[b[0],i]).sort((a,b)=>b[0].length-a[0].length);
function bibleRef(s){ s=(s||"").trim(); for(const [n,i] of BOOK_NAMES) if(s.startsWith(n)){ const m=s.slice(n.length).match(/(\d+)(?:\s*[:장편]\s*(\d+))?/); return {book:i,ch:m?+m[1]:0,vs:m&&m[2]?+m[2]:0}; } return null; }
const wRef=w=>w.track==="bible"?bibleRef(w.passage):null;
const nRef=n=>n.track==="bible"?bibleRef(n.source):null;
const allTopics=()=>[...TOPICS,...(S.settings.customTopics||[])];
const usedTopics=()=>[...new Set([...S.writings.flatMap(w=>[...(w.topics||[]),...(w.tags||[])]),...S.notes.flatMap(n=>n.tags||[])])];
const usedBooks=()=>[...new Set([...S.writings.map(wRef),...S.notes.map(nRef)].filter(Boolean).map(x=>x.book))].sort((a,b)=>a-b);
const years=()=>[...new Set(S.writings.map(w=>w.date.slice(0,4)))].sort().reverse();
function matches(w,r){
  if(r.types?.length&&!r.types.includes(w.type)) return false;
  if(r.books?.length){ const x=wRef(w); if(!x||!r.books.includes(x.book)) return false; }
  if(r.topics?.length&&![...(w.topics||[]),...(w.tags||[])].some(t=>r.topics.includes(t))) return false;
  if(r.readBooks?.length&&!r.readBooks.includes(w.bookId)) return false;
  if(r.year&&!w.date.startsWith(r.year)) return false;
  return true;
}
const ruleEmpty=r=>!(r.types.length||r.books.length||r.topics.length||r.readBooks.length||r.year);
function bibleOrder(a,b){ const x=wRef(a),y=wRef(b); if(x&&y) return x.book-y.book||x.ch-y.ch||x.vs-y.vs||a.date.localeCompare(b.date); return x?-1:y?1:a.date.localeCompare(b.date); }
function msList(m){
  if(m.rule) return S.writings.filter(w=>matches(w,m.rule)).sort(m.order==="date"?(a,b)=>a.date.localeCompare(b.date):bibleOrder);
  return (m.items||[]).map(id=>S.writings.find(w=>w.id===id)).filter(Boolean);
}
const msOf=w=>S.manuscripts.filter(m=>msList(m).includes(w));
function ruleText(r){ const p=[];
  if(r.types?.length) p.push(r.types.join("·")); if(r.books?.length) p.push(r.books.map(i=>BIBLE[i][0]).join("·"));
  if(r.topics?.length) p.push("주제 "+r.topics.join("·")); if(r.readBooks?.length) p.push("책 "+r.readBooks.map(id=>S.books.find(b=>b.id===id)?.title||"").join("·"));
  if(r.year) p.push(r.year+"년"); return p.join("  +  "); }
function ensureMs(){ // 예전 방식(글마다 manuscriptId)을 원고의 목록(items)으로 옮깁니다
  S.manuscripts.forEach(m=>{ if(!m.rule&&!m.items) m.items=S.writings.filter(w=>w.manuscriptId===m.id).sort((a,b)=>(a.chapter??999)-(b.chapter??999)).map(w=>w.id); });
  S.writings.forEach(w=>{ delete w.manuscriptId; delete w.chapter; });
}

    <div class="rulegrid">

      <div class="rl">주제</div><div>${[...new Set([...usedTopics(),...r.topics])].map(t=>chip("topics",t,t,r.topics.includes(t))).join("")||`<span class="muted">글에 주제를 고르면 여기에 나옵니다</span>`}
        <select style="width:auto;display:inline-block;margin-top:4px" onchange="if(this.value)toggleRule('topics',this.value)"><option value="">＋ 다른 주제</option>${allTopics().filter(t=>!r.topics.includes(t)).map(t=>`<option>${esc(t)}</option>`).join("")}</select></div>
      ${S.books.length?`<div class="rl">읽은 책</div><div>${S.books.map(b=>chip("readBooks",b.id,b.title,r.readBooks.includes(b.id))).join("")}</div>`:""}
      <div class="rl">해</div><div><select style="width:auto" onchange="setRuleYear(this.value)"><option value="">모든 해</option>${years().map(y=>`<option ${r.year===y?"selected":""}>${y}</option>`).join("")}</select></div>
      <div class="rl">순서</div><div><span class="chip ${d.order!=="date"?"on":""}" onclick="msDraft.order='bible';msDraft.title=$('#mtitle').value;render()">성경 순서(장·절)</span><span class="chip ${d.order==="date"?"on":""}" onclick="msDraft.order='date';msDraft.title=$('#mtitle').value;render()">쓴 날짜</span></div>
    </div>
    <div class="preview"><b class="pen" style="font-size:22px">${ruleEmpty(r)?"조건을 골라 주세요":`지금 맞는 글 ${preview.length}편`}</b>${!ruleEmpty(r)&&preview.length?`<span class="muted"> — ${preview.slice(0,4).map(w=>esc(w.title||"(제목 없음)")).join(", ")}${preview.length>4?" …":""}</span>`:""}
      <div class="hint">앞으로 쓰는 글도 이 조건에 맞으면 저절로 이 원고에 들어옵니다.</div></div>
    <div class="row" style="margin-top:12px"><button class="btn ink" onclick="addMs()">${d.editing?"조건 고치기":"원고 만들기"}</button><button class="btn ghost" onclick="msDraft=null;render()">취소</button></div>`;

function msCardHtml(m,i){
  const ch=msList(m), total=ch.reduce((a,w)=>a+chars(w.body),0);
  const row=(w,k)=>`<li><span class="pen cn">${k+1}</span><a href="#" onclick="go('write',{edit:'${w.id}'});return false">${esc(w.title||"(제목 없음)")}</a>${w.passage?`<span class="muted">${esc(w.passage)}</span>`:""}<span class="muted">${chars(w.body).toLocaleString()}자</span><span class="spacer"></span>
    ${m.rule?"":`<button class="btn small ghost" ${k?"":"disabled"} onclick="msMove('${m.id}','${w.id}',-1)" title="앞으로">↑</button><button class="btn small ghost" ${k<ch.length-1?"":"disabled"} onclick="msMove('${m.id}','${w.id}',1)" title="뒤로">↓</button><button class="btn small ghost" onclick="msRemove('${m.id}','${w.id}')" title="원고에서 빼기 (글은 남습니다)">빼기</button>`}</li>`;
  const others=S.writings.filter(w=>!(m.items||[]).includes(w.id)).slice().reverse();
  return `<section class="sheet tape ${["","b","c"][i%3]}">
    <p class="label" style="font-size:19px">${m.rule?"조건으로 모으는 원고":"직접 고른 원고"}</p>
    <div class="big">${esc(m.title)}</div>
    ${m.rule?`<div class="rulechips">${esc(ruleText(m.rule))}</div>`:""}
    <div class="sub">${ch.length}꼭지 · ${total.toLocaleString()}자 · 원고지 약 ${Math.ceil(total/200)}매</div>
    ${m.rule?`<div class="row" style="gap:4px;margin-top:6px"><span class="muted">순서</span><span class="chip ${m.order!=="date"?"on":""}" onclick="setOrder('${m.id}','bible')">성경 순서</span><span class="chip ${m.order==="date"?"on":""}" onclick="setOrder('${m.id}','date')">쓴 날짜</span></div>`:""}
    <ol class="chapters">${ch.map(row).join("")||`<p class="muted">${m.rule?"아직 조건에 맞는 글이 없습니다. 글을 쓰면 저절로 들어옵니다.":"아직 넣은 글이 없습니다."}</p>`}</ol>
    ${m.rule?"":others.length?`<select onchange="msAdd('${m.id}',this.value)"><option value="">＋ 간직한 글 더하기…</option>${others.map(w=>`<option value="${w.id}">${esc(w.date)} · ${esc(w.title||w.body.slice(0,20))}</option>`).join("")}</select>`:""}
    <div class="row" style="margin-top:12px">
      ${m.rule?`<button class="btn small" onclick="editRule('${m.id}')">조건 고치기</button><button class="btn small" onclick="freezeMs('${m.id}')" title="지금 모인 글로 고정하고 순서를 직접 정합니다">직접 다듬기로 바꾸기</button>`:""}
      <button class="btn small ink" onclick="exportPdf('${m.id}')">${ICO.closed}책 모양 PDF</button><button class="btn small" onclick="exportMs('${m.id}')">원고 내려받기</button><button class="btn small danger" onclick="delMs('${m.id}')">묶음 풀기</button></div>
  </section>`;
}

// 서랍: 분류별로 걸러 보기
let filt={track:"",kind:"",type:"",book:"",topic:""};
function setFilt(k,v){ filt[k]=v; renderArchive(); }
function filterBar(){
  const sel=(k,first,opts)=>`<select style="width:auto" onchange="setFilt('${k}',this.value)"><option value="">${first}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(filt[k])===String(v)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  return `<div class="row filterbar">
    ${sel("track","말씀+책",[["bible","말씀"],["book","책"]])}
    ${sel("kind","밑줄+글",[["note","밑줄만"],["write","글만"]])}
    ${sel("type","모든 글 종류",ALL_TYPES.map(t=>[t,t]))}
    ${sel("book","모든 성경책",usedBooks().map(i=>[i,BIBLE[i][0]]))}
    ${sel("topic","모든 주제",usedTopics().map(t=>[t,t]))}
  </div>`;
}
function renderArchive(){
  const q=($("#q")?.value||"").trim().toLowerCase(), f=filt, items=[];
  const bookOk=x=>f.book===""||(x&&x.book===+f.book);
  if(f.kind!=="write"&&!f.type) S.notes.forEach(n=>{
    if(f.track&&n.track!==f.track) return; if(!bookOk(nRef(n))) return; if(f.topic&&!(n.tags||[]).includes(f.topic)) return;
    if(q&&!(n.text+(n.thought||"")+noteSrc(n)+(n.tags||[]).join(" ")).toLowerCase().includes(q)) return;
    items.push({d:n.date,html:noteHtml(n)}); });
  if(f.kind!=="note") S.writings.forEach(w=>{
    if(f.track&&w.track!==f.track) return; if(f.type&&w.type!==f.type) return; if(!bookOk(wRef(w))) return;
    if(f.topic&&![...(w.topics||[]),...(w.tags||[])].includes(f.topic)) return;
    if(q&&!(w.title+w.body+(w.passage||"")+[...(w.topics||[]),...(w.tags||[])].join(" ")).toLowerCase().includes(q)) return;
    const ms=msOf(w), tp=[...(w.topics||[]),...(w.tags||[])];
    items.push({d:w.date,html:`<div class="item"><div class="row"><span class="label ${w.track}" style="margin:0;font-size:19px">[${esc(wTag(w))}]${w.length?" "+esc(w.length):""}</span>${w.passage?`<span class="muted">${esc(w.passage)}</span>`:""}${w.status&&w.status!=="초고"?`<span class="chip on" style="cursor:default">${esc(w.status)}</span>`:""}<span class="spacer"></span>${w.notion?.page?`<a class="muted" href="${esc(w.notion.url)}" target="_blank">노션 ✓</a>`:w.syncError?`<span class="muted" style="color:var(--stamp)">노션 미전송</span>`:""}</div>
      <a href="#" onclick="go('write',{edit:'${w.id}'});return false" class="myeongjo" style="font-size:18px;color:var(--ink)"><b>${esc(w.title||"(제목 없음)")}</b></a>
      <div class="muted">${w.date} · ${chars(w.body).toLocaleString()}자${ms.length?` · ${ms.map(m=>ICO.closed+esc(m.title)).join(" ")}`:""}${w.fromNote?" · 밑줄에서 키운 글":""}</div>
      ${tp.length?`<div>${tp.map(t=>`<a href="#" class="tag" onclick="setFilt('topic',${jsArg(t)});render();return false">#${esc(t)}</a>`).join("")}</div>`:""}
      <div class="sub">${esc(stripMk(w.body).replace(/\s+/g," ").slice(0,130))}…</div></div>`}); });
  items.sort((a,b)=>b.d.localeCompare(a.d));
  const any=Object.values(f).some(v=>v!=="")||q;
  $("#results").innerHTML=`<div class="row" style="margin-bottom:6px"><b class="pen" style="font-size:22px">${items.length}개</b>${any?`<button class="btn small ghost" onclick="filt={track:'',kind:'',type:'',book:'',topic:''};$('#q').value='';render()">거르기 풀기</button>`:""}<span class="spacer"></span>${any&&items.some(i=>i.html.includes('class="label'))?`<button class="btn small" onclick="ruleFromFilter()">이 조건으로 원고 만들기</button>`:""}</div>`
    +(items.length?items.map(i=>i.html).join(""):`<p class="muted">찾은 기록이 없습니다.</p>`);
}
function ruleFromFilter(){ // 서랍에서 거른 조건을 그대로 원고로
  const r=blankRule(); if(filt.type) r.types=[filt.type]; if(filt.book!=="") r.books=[+filt.book]; if(filt.topic) r.topics=[filt.topic];
  if(ruleEmpty(r)) return toast("글 종류·성경책·주제 중 하나로 걸러 주세요");
  msDraft={kind:"rule",rule:r,order:"bible",editing:null,title:ruleText(r).replace(/주제 /,"")}; drawerSub="ms"; render(); scrollTo(0,0);
}
// ───────── 설정: 통독 방법 ─────────
let draft=null; // (예전 '선택 후 적용' 방식의 흔적 — go()에서 초기화만 합니다)
function planSettings(){
  const p=S.settings.plan, cur=planObj(), wk=readWeek();
  const lenOf=pl=>pl.id==="seq"?Math.ceil(1189/Math.max(1,p.perDay)):pl.days().length;
  const tipOf=pl=>`${pl.how}  예) 1일째: ${pl.days()[0].join(" · ")}`;
  const MODES=[["pace","그 자리에서 이어 읽기","「다 읽었습니다」를 눌러야 다음 분량으로 넘어갑니다. 하루 빠져도 밀리지 않고 그 자리에서 이어 읽습니다."],
               ["date","달력대로 넘어가기","읽는 날이 지날 때마다 저절로 다음 분량이 나옵니다. 못 읽은 날은 '따라잡을 날'로 남습니다. 맥체인처럼 날짜가 정해진 표에 잘 맞습니다."]];
  const mode=p.mode==="date"?"date":"pace";
  return `<section class="sheet tape b">
    <p class="label bible">성경 통독</p>
    <div class="setrow" style="margin-top:6px"><span class="k">읽는 방법</span>
      <div class="pills" style="flex:1">${PLANS.map(pl=>{ const kept=pl.id!==p.id&&readDays(planState(pl.id));
        return `<button class="pill ${pl.id===p.id?"on":""} ${kept?"kept":""}" data-tip="${esc(tipOf(pl))}" onclick="setPlan('${pl.id}')">${pl.name}<small>${lenOf(pl)}일${kept?` · 진도 ${kept}일`:""}</small></button>`; }).join("")}</div></div>
    <div class="planinfo"><b>${esc(cur.name)}</b> — ${esc(cur.how)}<br><span class="muted">예) 1일째: ${esc(cur.days()[0].join(" · "))}</span></div>
    <div class="setrow"><span class="k">기간</span>
      <div class="pills"><button class="pill ${p.spanM?"":"on"}" data-tip="이 방법의 원래 읽기표 그대로 (${lenOf(cur)}일)" onclick="clearSpan()">기본<small>${lenOf(cur)}일</small></button>${SPANS.map(([m,n])=>{ const c=spanCalc(m); return `<button class="pill ${p.spanM===m?"on":""}" data-tip="${c.until}까지 · 읽는 날 ${c.rd}일 · 하루 약 ${c.per}장" onclick="applySpan(${m})">${n}<small>하루 약 ${Math.max(1,Math.round(c.per))}장</small></button>`; }).join("")}
</div>
    </div>
    <p class="hint">${p.spanM?`지금: <b>${p.spanUntil}까지</b> 끝내도록 맞췄습니다 — 읽는 날마다 약 <b>${p.spanPer}장</b>.`:`지금은 <b>기본</b> — 이 방법의 원래 날 수(${lenOf(cur)}일)대로 읽습니다. 기간을 고르면 남은 분량을 <b>읽는 요일만 세어</b> 하루에 몇 장씩 읽을지 계산해 읽기표를 다시 나눕니다.`} (남은 분량 약 ${spanCalc(12).remCh.toLocaleString()}장)</p>
    <div class="setrow"><span class="k">못 읽은 날</span>
      <div class="pills">${MODES.map(([v,n,t])=>`<button class="pill ${mode===v?"on":""}" data-tip="${t}" onclick="setMode('${v}')">${n}</button>`).join("")}</div>
      ${mode==="date"
        ?`<label class="row" style="gap:6px;margin:0"><span class="muted">1일째 날짜</span><input type="date" value="${p.start}" onchange="setStart(this.value)" style="width:150px"></label><button class="btn small ghost" onclick="setStart(new Date().getFullYear()+'-01-01')">올해 1월 1일</button>`
        :`<label class="row" style="gap:6px;margin:0"><span class="muted">지금</span><input type="number" min="1" max="${planDays().length}" value="${p.day+1}" onchange="setDay(this.value)" style="width:70px"><span class="muted">일째</span></label>`}
      ${p.id==="seq"&&!p.spanM?`<label class="row" style="gap:6px;margin:0"><span class="muted">하루</span><input type="number" min="1" value="${p.perDay}" onchange="setPerDay(this.value)" style="width:56px"><span class="muted">장</span></label>`:""}
    </div>
    <p class="hint">${mode==="date"?"달력대로: 「1일째 날짜」부터 읽는 날마다 하루치씩 넘어갑니다. 못 읽은 날은 따라잡을 날로 남습니다.":"그 자리에서: 읽기를 마쳐야 다음 날 분량으로 넘어가서, 빠진 날이 있어도 밀리지 않습니다."}</p>
    <div class="setrow"><span class="k">성경 번역</span>
      <div class="pills">${BVERS.map(([v,n])=>`<button class="pill ${bibleVer()[0]===v?"on":""}" data-tip="「오늘의 말씀」의 책 그림을 누르면 대한성서공회 성경플랫폼에서 ${n}으로 그 장을 엽니다" onclick="setBibleVer('${v}')">${n}</button>`).join("")}</div></div>
    <div class="setrow"><span class="k">묵상 본문</span>
      <div class="pills"><button class="pill ${S.settings.qtSource!=="plan"?"on":""}" data-tip="새 묵상을 쓸 때 성서유니온 매일성경의 오늘 본문을 본문 칸에 넣습니다" onclick="S.settings.qtSource='su';save();render()">매일성경 따라</button><button class="pill ${S.settings.qtSource==="plan"?"on":""}" data-tip="새 묵상을 쓸 때 통독표의 오늘 분량을 본문 칸에 넣습니다" onclick="S.settings.qtSource='plan';save();render()">통독표 따라</button></div></div>
    <div class="setrow"><span class="k">읽는 요일</span>
      <div class="pills">${[1,2,3,4,5,6,0].map(d=>`<button class="pill day ${wk.includes(d)?"on":""}" onclick="toggleWeekday(${d})">${WEEK[d]}</button>`).join("")}</div>
      <div class="pills"><button class="pill ${wk.length===7?"on":""}" onclick="setWeek([0,1,2,3,4,5,6])">매일</button><button class="pill ${wk.length===6&&!wk.includes(0)?"on":""}" onclick="setWeek([1,2,3,4,5,6])">주일 빼고</button></div>
    </div>
    <p class="hint">고르지 않은 요일은 「오늘」 화면이 쉬는 날로 바뀌고, 아침 메일도 오지 않으며, 이어지는 날 수도 끊기지 않습니다.${mode==="date"?" 달력대로 넘어갈 때는 1일째 날짜부터 <b>읽는 요일만</b> 하루로 셉니다.":""}</p>
    <p class="hint" style="margin-top:12px">방법을 바꿔도 방법마다 읽던 자리가 따로 보관됩니다(점선 단추). 지금은 <b>${todayIdx()+1}일째</b> — ${esc((planDays()[todayIdx()]||["다 읽음"]).join(" · "))}
      <button class="btn small ghost danger" style="margin-left:6px" onclick="resetPlan()">이 방법 처음부터</button></p>
  </section>`;
}
function resetStreak(){ if(!confirm("「이어지는 아침」 날 수를 오늘부터 다시 셀까요?\n(읽은 기록·글·일기는 그대로 남습니다)")) return; S.settings.streakFrom=today(); save(); render(); toast("오늘부터 다시 셉니다 — 1일째 아침"); }
function setWeek(list){ const d=[...new Set(list)].sort(); if(!d.length) return toast("하루는 골라 주세요");
  S.settings.days=d; restPeek=false;
  const p=S.settings.plan; if(p.spanM&&p.spanUntil>today()){ _days.key=""; if(applySpan(p.spanM,p.spanUntil)) return; }   // 기간을 정해 두었으면 같은 끝날에 맞춰 다시 계산
  planChanged(d.length===7?"매일 읽습니다":`${[1,2,3,4,5,6,0].filter(x=>d.includes(x)).map(x=>WEEK[x]).join("·")}요일에 읽습니다`); }
function toggleWeekday(x){ const w=readWeek(); setWeek(w.includes(x)?w.filter(y=>y!==x):[...w,x]); }
function planChanged(msg){ _days.key=""; save(); toast(msg); render(); }
// 통독 방법마다 진도를 따로 보관합니다. 지우는 것은 resetPlan() 뿐입니다.
const freshPlan=()=>({perDay:3,day:0,mode:"pace",start:today(),done:{},checks:[],last:null,setOn:today()});
function planState(id){ return id===S.settings.plan.id?S.settings.plan:(S.settings.planStates||{})[id]; }
function readDays(st){ return st?(st.mode==="date"?Object.keys(st.done||{}).length:st.day||0):0; }
function setPlan(id){
  const p=S.settings.plan; if(id===p.id) return;
  const keep=S.settings.planStates=S.settings.planStates||{};
  const {id:_,...cur}=p; keep[p.id]=cur;               // 지금 방법의 진도를 보관
  const back=keep[id]; delete keep[id];
  S.settings.plan={id,...(back||freshPlan())};         // 예전 진도가 있으면 그대로 이어서
  const name=PLANS.find(x=>x.id===id).name;
  planChanged(back?`「${name}」 읽던 자리(${todayIdx()+1}일째)로 돌아왔습니다`:`「${name}」를 1일째부터 시작합니다`);
}
function resetPlan(){
  const p=S.settings.plan, name=planObj().name;
  if(!confirm(`「${name}」의 진도를 지우고 1일째부터 다시 시작할까요?\n(다른 통독 방법의 진도와 읽은 날 기록은 그대로 남습니다)`)) return;
  S.settings.plan={id:p.id,...freshPlan(),perDay:p.perDay,mode:p.mode,start:p.mode==="date"?p.start:today()};
  planChanged(`「${name}」를 처음부터 다시 시작합니다`);
}
function setMode(m){ const p=S.settings.plan; if(p.mode===m) return; const i=todayIdx(), was=doneToday();   // 읽던 자리와 오늘 읽음 도장은 그대로 두고 방식만 바꿉니다
  p.mode=m; if(!p.start) p.start=today(); setIndexTo(i,was); planChanged(m==="date"?"날짜에 맞춰 넘어갑니다":"내 속도로 넘어갑니다"); }
function setStart(v){ const p=S.settings.plan; if(!v) return; p.start=v; p.checks=[]; p.done={}; p.setOn=today(); planChanged(`${v}부터 시작한 것으로 맞췄습니다`); }
function setDay(v){ const p=S.settings.plan; p.day=Math.min(planDays().length-1,Math.max(0,(+v||1)-1)); p.checks=[]; p.last=null; planChanged(`${p.day+1}일째부터 읽습니다`); }
function setPerDay(v){ ["spanM","spanUntil","spanPer","perDayBase"].forEach(k=>delete S.settings.plan[k]); const p=S.settings.plan, old=p.perDay, n=Math.max(1,+v||1), i=Math.floor(todayIdx()*old/n); p.perDay=n; _days.key=""; setIndexTo(i); planChanged(`하루 ${n}장씩 읽습니다`); }
async function saveKey(k,inputId){
  if(!SERVER) return toast("서버로 열어야 저장할 수 있습니다");
  const v=$("#"+inputId).value.trim(); if(!v) return;
  await api("/api/config",{[k]:v}); $("#"+inputId).value="";
  CONF=await apiGet("/api/config"); toast("저장했습니다"); render();
}
async function checkNotion(){
  const el=$("#nstatus"); if(!el) return;
  try{ const r=await apiGet("/api/notion/check");
    if(!r.ok){ el.innerHTML=`<span style="color:var(--stamp)">${esc(r.error)}</span>`; return; }
    const miss=Object.entries(r.found).filter(([,v])=>!v).map(([k])=>k);
    el.innerHTML=miss.length?`연결 키는 맞지만 「${miss.join("」, 「")}」에 닿지 못했습니다. 2번(연결 추가)을 확인해 주세요.`:`<span class="stamp ok">노션 연결됨</span> <span class="muted">${esc(r.bot||"")}</span>`;
  }catch(_){ el.textContent="확인하지 못했습니다."; }
}
function restore(input){ const f=input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.notes||!d.writings) throw 0; if(!confirm("지금 기록을 백업 파일 내용으로 바꿀까요?")) return; S=Object.assign(blank(),d); save(); toast("복원했습니다"); render(); }catch(_){ toast("올바른 백업 파일이 아닙니다"); } };
  r.readAsText(f); }

// ───────── 타이머 ─────────
const timer={on:false,start:0,acc:0,h:null};
const elapsed=()=>timer.acc+(timer.on?Date.now()-timer.start:0);
function paintTimer(){ const el=$("#timer"); if(!el) return; const s=Math.floor(elapsed()/1000); el.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
function toggleTimer(){ if(timer.on){ timer.acc=elapsed(); timer.on=false; clearInterval(timer.h); } else { timer.on=true; timer.start=Date.now(); timer.h=setInterval(paintTimer,500); } $("#tbtn").textContent=timer.on?"멈춤":"시작"; }
function resetTimer(){ timer.on=false; timer.acc=0; clearInterval(timer.h); paintTimer(); $("#tbtn").textContent="시작"; }

document.addEventListener("focusin",e=>{ if(e.target.matches?.("textarea,input:not([type=checkbox]):not([type=file]),select")) document.body.classList.add("typing"); });
document.addEventListener("focusout",()=>setTimeout(()=>{ if(!document.activeElement?.matches?.("textarea,input,select")) document.body.classList.remove("typing"); },60));
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="s"&&tab==="write"){ e.preventDefault(); saveWriting(); }
  if(e.key==="Escape"&&document.body.classList.contains("focus")) toggleFocus();
});
function ensurePlan(){
  const st=S.settings;
  if(st.plan) return;
  const b=st.bible||{idx:0,ch:1,perDay:3};  // 첫 버전의 '순서대로' 진도를 이어받습니다
  const offset=BIBLE.slice(0,b.idx).reduce((a,x)=>a+x[1],0)+b.ch-1;
  st.plan={id:"seq",perDay:b.perDay||3,day:Math.floor(offset/(b.perDay||3)),mode:"pace",start:today(),done:{},checks:[],last:null};
}
load().then(()=>{ ensurePlan(); ensureMs(); render(); setTimeout(checkUpdate,1500); });
</script>
